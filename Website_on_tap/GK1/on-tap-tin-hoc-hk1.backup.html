i. Ngọc cần làm gì để dòng tiêu đề vừa in đậm vừa gạch chân?","o":["Kéo thả chuột bôi đen toàn bộ dòng “CẢNH ĐẸP VIỆT NAM” rồi nháy nút B và nút U trên thẻ Home","Chèn thêm một bức ảnh đè lên trên dòng chữ “CẢNH ĐẸP VIỆT NAM”","Bấm nút Delete xóa trang chiếu đi và tắt phần mềm PowerPoint","Nhấn phím F5 rồi dùng tay chỉ lên màn hình vào dòng tiêu đề"],"a":0,"k":0},{"i":56,"b":"Bài 8","c":7,"l":2,"s":"Trong một trang chiếu giới thiệu ba loài hoa mùa xuân, cách trình bày văn bản nào dưới đây giúp khán giả dễ theo dõi nhất khi thuyết trình?","o":["Viết liền một đoạn văn dài 25 dòng cỡ chữ 11 không xuống dòng và không có hình ảnh","Dùng Bullets tách thành 3 gạch đầu dòng ngắn gọn (Hoa đào, Hoa mai, Hoa cúc), cỡ chữ lớn rõ ràng kèm ảnh minh họa","Dùng 6 phông chữ khác nhau cho 6 từ trong cùng một dòng tiêu đề","Đặt màu chữ xanh lá cây nhạt trên nền trang chiếu màu xanh lá cây"],"a":1,"k":2}],"e":[{"i":57,"b":"Bài 1","c":0,"l":2,"s":"Em hãy giải thích sự khác nhau cơ bản giữa phần cứng và phần mềm máy tính, đồng thời nêu 3 việc nên làm để bảo vệ máy tính khi sử dụng.","a":"- Khác nhau: Phần cứng là các thiết bị vật lí cấu thành máy tính có thể nhìn thấy, chạm tay vào được (màn hình, thân máy, bàn phím, chuột...); phần mềm là các chương trình điều khiển máy tính hoạt động, không thể chạm tay vào được (Windows, Chrome, PowerPoint...).\n- Ba việc nên làm bảo vệ máy: (1) Tắt máy đúng cách bằng lệnh Shut down; (2) Giữ máy khô ráo, không để nước hay thức ăn rơi vào bàn phím, thân máy; (3) Không va đập mạnh và không tự ý xóa các tệp hệ thống."},{"i":58,"b":"Bài 2","c":1,"l":2,"s":"Em hãy trình bày cách phân công các ngón tay của bàn tay trái và bàn tay phải khi gõ hàng phím số (từ phím 1 đến phím 0).","a":"- Bàn tay trái: Ngón út gõ phím 1, ngón áp út gõ phím 2, ngón giữa gõ phím 3, ngón trỏ gõ phím 4 và phím 5.\n- Bàn tay phải: Ngón trỏ gõ phím 6 và phím 7, ngón giữa gõ phím 8, ngón áp út gõ phím 9, ngón út gõ phím 0.\nLưu ý: Sau khi vươn lên gõ phím số xong, các ngón tay đều đưa về hàng phím cơ sở."},{"i":59,"b":"Bài 3","c":2,"l":2,"s":"Siêu liên kết trên trang web là gì? Dấu hiệu nào giúp em nhận biết một dòng chữ hay hình ảnh trên trang web là siêu liên kết?","a":"Siêu liên kết (hyperlink) là phần nội dung đặc biệt trên trang web liên kết tới một trang web khác hoặc vị trí khác. Dấu hiệu nhận biết rõ nhất là khi di chuyển con trỏ chuột đặt vào vị trí đó, con trỏ chuột chuyển từ hình mũi tên sang hình bàn tay có ngón trỏ chỉ vào."},{"i":60,"b":"Bài 4","c":3,"l":2,"s":"Từ khóa tìm kiếm là gì? Vì sao khi tìm kiếm thông tin trên Internet bằng máy tìm kiếm, ta nên chọn từ khóa ngắn gọn và cụ thể thay vì gõ từ quá chung chung?","a":"Từ khóa là từ hoặc cụm từ ngắn gọn thể hiện đúng nội dung chính mà người dùng muốn tìm. Chọn từ khóa ngắn gọn, cụ thể giúp máy tìm kiếm hiểu đúng yêu cầu và trả về danh sách kết quả sát nhất, giúp tiết kiệm thời gian tra cứu thay vì phải lọc qua hàng triệu kết quả lan man."},{"i":61,"b":"Bài 5","c":4,"l":2,"s":"Em hãy so sánh điểm giống nhau và khác nhau giữa thao tác Sao chép (Copy -> Paste) và thao tác Di chuyển (Cut -> Paste) đối với một tệp tin.","a":"- Giống nhau: Sau khi thực hiện xong, tại thư mục đích (nơi chọn lệnh Paste) đều xuất hiện tệp tin đó.\n- Khác nhau: Sao chép (Copy -> Paste) vẫn giữ nguyên tệp gốc ở thư mục ban đầu (tạo thành 2 bản ở 2 nơi); còn Di chuyển (Cut -> Paste) chuyển hẳn tệp sang thư mục mới nên tệp không còn nằm ở thư mục ban đầu nữa."},{"i":62,"b":"Bài 6","c":5,"l":2,"s":"Em hiểu thế nào là phần mềm miễn phí và phần mềm không miễn phí? Hãy nêu ví dụ cho từng loại.","a":"- Phần mềm miễn phí là phần mềm được tác giả cho phép mọi người tải về, cài đặt và sử dụng mà không phải trả tiền (ví dụ: phần mềm gõ tiếng Việt UniKey, trình duyệt Google Chrome, phần mềm lập trình Scratch).\n- Phần mềm không miễn phí là phần mềm người dùng phải trả phí mua bản quyền hoặc được tác giả cấp phép mới được sử dụng hợp pháp (ví dụ: hệ điều hành Microsoft Windows bản thương mại, bộ phần mềm Microsoft Office bản quyền)."},{"i":63,"b":"Bài 7","c":6,"l":2,"s":"Em hãy nêu các bước cơ bản để tạo một bài trình chiếu gồm 2 trang có chèn ảnh minh họa và lưu bài vào máy tính trong phần mềm PowerPoint.","a":"Các bước thực hiện:\n1. Khởi động PowerPoint (bật sẵn UniKey để gõ tiếng Việt có dấu), nhập tiêu đề và tên người làm vào Trang 1.\n2. Chọn thẻ Home -> nháy nút New Slide để thêm Trang 2, nhập nội dung văn bản.\n3. Chọn thẻ Insert -> chọn Pictures -> chọn tệp ảnh trong máy tính -> nháy Insert để đưa ảnh vào trang chiếu và chỉnh kích thước phù hợp.\n4. Chọn thẻ File -> Save, chọn thư mục lưu, đặt tên tệp và nhấn Save."},{"i":64,"b":"Bài 8","c":7,"l":2,"s":"Kể tên ít nhất 5 nút lệnh định dạng văn bản trên thẻ Home của phần mềm PowerPoint và nêu tác dụng của từng nút lệnh đó.","a":"Năm nút lệnh định dạng văn bản trên thẻ Home gồm:\n1. Font: Thay đổi phông chữ cho văn bản.\n2. Font Size: Thay đổi cỡ chữ to hoặc nhỏ.\n3. B (Bold): Tạo kiểu chữ in đậm.\n4. I (Italic): Tạo kiểu chữ in nghiêng (hoặc U – Underline: gạch chân).\n5. Font Color: Đổi màu sắc của chữ (ngoài ra còn có Bullets: tạo dấu liệt kê đầu dòng)."},{"i":65,"b":"Bài 1","c":0,"l":3,"s":"Hãy sắp xếp các tên gọi sau đây vào đúng hai nhóm “Phần cứng” và “Phần mềm”: Màn hình cảm ứng, Google Chrome, Ổ cứng SSD, Microsoft PowerPoint, Loa vi tính, UniKey, Bàn phím, Hệ điều hành Windows.","a":"- Nhóm Phần cứng (4 thiết bị): Màn hình cảm ứng, Ổ cứng SSD, Loa vi tính, Bàn phím.\n- Nhóm Phần mềm (4 chương trình): Google Chrome, Microsoft PowerPoint, UniKey, Hệ điều hành Windows."},{"i":66,"b":"Bài 2","c":1,"l":3,"s":"Để gõ địa chỉ thư điện tử “lop4c1@unigo.edu.vn” bằng mười ngón tay đúng quy tắc, khi gõ chữ số “4”, chữ số “1” và kí hiệu “@” (nằm phía trên phím số 2), em phải thao tác các ngón tay như thế nào?","a":"- Gõ chữ số “4”: Vươn ngón trỏ tay trái từ phím F lên gõ phím số 4 rồi về phím F.\n- Gõ chữ số “1”: Vươn ngón út tay trái từ phím A lên gõ phím số 1 rồi về phím A.\n- Gõ kí hiệu “@”: Dùng ngón út tay phải nhấn giữ phím Shift bên phải, đồng thời vươn ngón áp út tay trái lên gõ phím số 2, sau đó thả phím Shift và đưa các ngón về hàng phím cơ sở."},{"i":67,"b":"Bài 3","c":2,"l":3,"s":"Em mở trang báo Thiếu niên Tiền phong điện tử để đọc tin tức. Hãy mô tả cách em sử dụng siêu liên kết và nút quay lại (Back) trên trình duyệt để đọc lần lượt 2 bài báo khác nhau trong chuyên mục “Gương sáng học đường”.","a":"Bước 1: Di chuyển chuột tới tiêu đề “Gương sáng học đường” (con trỏ biến thành hình bàn tay) và nháy chuột để mở danh sách bài viết.\nBước 2: Nháy chuột vào siêu liên kết tiêu đề bài báo thứ nhất để đọc nội dung, hình ảnh.\nBước 3: Sau khi đọc xong bài thứ nhất, nháy nút mũi tên Back (Quay lại) ở góc trên bên trái trình duyệt để trở về trang chuyên mục, rồi nháy tiếp vào siêu liên kết bài báo thứ hai."},{"i":68,"b":"Bài 4","c":3,"l":3,"s":"Cô giáo giao nhiệm vụ tìm hiểu 3 món ăn đặc sản của quê hương Nghệ An và lưu 1 bức ảnh Hoa sen làng Sen về máy tính. Em hãy đề xuất 2 từ khóa tìm kiếm hiệu quả nhất và nêu các bước tải ảnh về thư mục học tập.","a":"- Hai từ khóa ngắn gọn, hiệu quả: (1) “Đặc sản Nghệ An”; (2) “Hoa sen làng Sen Kim Liên”.\n- Các bước tìm và lưu ảnh: Mở trình duyệt -> vào google.com -> gõ từ khóa “Hoa sen làng Sen Kim Liên” và nhấn Enter -> chọn mục Hình ảnh -> nháy chọn bức ảnh rõ nét -> nháy nút phải chuột vào ảnh chọn Save image as... -> chọn thư mục học tập của em, đặt tên tệp rõ ràng và nhấn Save."},{"i":69,"b":"Bài 5","c":4,"l":3,"s":"Trong ổ đĩa D: đang có thư mục “LOP_4C1”. Bên trong “LOP_4C1” có 2 tệp để lẫn lộn là “Bai7_TrinhChieu.pptx” và “Anh_Bac_Ho.jpg”, cùng một thư mục đặt tên sai là “New folder”. Em hãy nêu các thao tác để đổi tên “New folder” thành “Tu_lieu_anh” rồi chuyển tệp ảnh vào đúng thư mục đó.","a":"1. Đổi tên thư mục: Mở thư mục LOP_4C1 -> nháy nút phải chuột vào “New folder” -> chọn Rename -> gõ tên mới “Tu_lieu_anh” rồi nhấn Enter.\n2. Di chuyển tệp ảnh: Nháy nút phải chuột vào tệp “Anh_Bac_Ho.jpg” -> chọn Cut -> mở thư mục “Tu_lieu_anh” -> nháy nút phải chuột vào vùng trống chọn Paste (tệp ảnh được chuyển gọn vào Tu_lieu_anh, còn tệp trình chiếu vẫn ở LOP_4C1)."},{"i":70,"b":"Bài 6","c":5,"l":3,"s":"Bạn Tuấn muốn cài một phần mềm vẽ sơ đồ tư duy lên máy tính ở nhà để học tập. Khi lên trang chủ của hãng, Tuấn thấy có 2 phiên bản: Bản Cơ bản (Free – Miễn phí cho học sinh) và Bản Chuyên nghiệp (Pro – Giá 1.200.000đ). Tuấn nên chọn bản nào và cần tránh điều gì?","a":"Tuấn nên chọn tải và cài đặt “Bản Cơ bản (Free – Miễn phí)” trực tiếp từ trang chủ chính thức của tác giả vì bản này hoàn toàn hợp pháp, được tác giả cho phép dùng miễn phí và đủ đáp ứng nhu cầu học tập của học sinh. Tuấn tuyệt đối tránh lên các trang web lạ tìm bản bẻ khóa (crack) của Bản Pro để không vi phạm bản quyền và bảo vệ máy tính khỏi vi-rút."},{"i":71,"b":"Bài 7","c":6,"l":3,"s":"Em cần gõ dòng tiêu đề “LỄ HỘI ĐỀN HÙNG” bằng kiểu gõ Telex (hoặc VNI) lên trang chiếu đầu tiên của PowerPoint rồi trình chiếu thử để kiểm tra. Hãy viết rõ cách gõ dấu của một kiểu gõ em chọn và phím tắt trình chiếu – thoát trình chiếu.","a":"- Bật phần mềm UniKey ở chế độ tiếng Việt (chữ V):\n + Nếu chọn kiểu Telex, gõ: LEEX HOOIJ DDEENF HUNGF (EE = Ê, OO = Ô, DD = Đ, X = ngã, J = nặng, F = huyền).\n + (Hoặc nếu chọn kiểu VNI, gõ: LE64 HO65I D9E62N HUNG2).\n- Nhấn phím F5 để trình chiếu toàn màn hình kiểm tra bố cục; kiểm tra xong nhấn phím Esc để thoát về cửa sổ soạn thảo."},{"i":72,"b":"Bài 8","c":7,"l":3,"s":"Em đã nhập xong trang chiếu có tiêu đề “Ba thói quen tốt bảo vệ mắt” và 3 dòng nội dung bên dưới. Hãy nêu chi tiết các thao tác định dạng để tiêu đề có phông Arial, cỡ 36, chữ đậm màu đỏ; còn 3 dòng nội dung có dấu chấm tròn đầu dòng (Bullets) cỡ chữ 24.","a":"1. Định dạng tiêu đề: Kéo thả chuột bôi đen dòng “Ba thói quen tốt bảo vệ mắt” -> trên thẻ Home chọn phông chữ Arial ở ô Font, chọn số 36 ở ô Font Size, nháy nút B (Bold) tạo chữ đậm và nháy mũi tên cạnh nút Font Color chọn màu đỏ.\n2. Định dạng 3 dòng nội dung: Kéo thả chuột bôi đen cả 3 dòng nội dung bên dưới -> chọn cỡ chữ 24 ở ô Font Size -> nháy nút lệnh Bullets trong nhóm Paragraph để tạo dấu chấm tròn đầu dòng."},{"i":73,"b":"Bài 1","c":0,"l":4,"s":"Có ý kiến cho rằng: “Phần cứng quan trọng hơn phần mềm vì phần cứng đắt tiền và cầm nắm được, còn phần mềm vô hình nên không quan trọng”. Em có đồng tình với ý kiến đó không? Hãy lấy ví dụ thực tế trên máy tính hoặc máy tính bảng để chứng minh.","a":"Em không đồng tình với ý kiến đó vì phần cứng và phần mềm đều quan trọng như nhau và phụ thuộc lẫn nhau không thể tách rời.\nVí dụ thực tế: Một chiếc máy tính bảng dù có màn hình cảm ứng rất đẹp và đắt tiền (phần cứng), nhưng nếu không có hệ điều hành và các ứng dụng học tập, trình duyệt web (phần mềm) thì màn hình chỉ tối đen, không thể xem bài giảng hay vẽ tranh được; ngược lại phần mềm PowerPoint cũng không thể chạy nếu không có chiếc máy tính vật lí."},{"i":74,"b":"Bài 2","c":1,"l":4,"s":"Khi gõ mật khẩu hoặc biểu thức có nhiều kí hiệu trên hàng phím số như “Nam#2026!”, nhiều bạn chỉ dùng một ngón tay phải vừa đè phím Shift vừa mổ phím số nên rất hay bị trượt phím. Em hãy hướng dẫn quy tắc phối hợp hai tay chuẩn xác cho cụm “#2026!” (biết # trên phím 3 và ! trên phím 1).","a":"Quy tắc vàng khi dùng phím Shift là “tay này gõ phím chính thì ngón út tay kia giữ phím Shift”:\n- Kí hiệu # (trên phím 3 – tay trái): Ngón út tay phải giữ Shift phải + ngón giữa tay trái gõ phím 3.\n- Các chữ số 2, 0, 2, 6 (không giữ Shift): Áp út trái gõ 2 -> út phải gõ 0 -> áp út trái gõ 2 -> trỏ phải gõ 6.\n- Kí hiệu ! (trên phím 1 – tay trái): Ngón út tay phải giữ Shift phải + ngón út tay trái gõ phím 1.\nCuối cùng đưa toàn bộ các ngón tay về hàng phím cơ sở."},{"i":75,"b":"Bài 3","c":2,"l":4,"s":"Trong khi đọc truyện cổ tích trên một trang web, bạn Nam thấy có hai dòng chữ đều màu xanh gạch chân: Dòng 1 ghi “Đọc tiếp chương 2 – Thạch Sanh” và Dòng 2 nhấp nháy ghi “Bấm ngay để nhận 100 viên kim cương miễn phí trong game!”. Cả hai đều biến con trỏ thành hình bàn tay. Em hãy phân tích cho Nam biết nên nháy vào liên kết nào, tránh liên kết nào và giải thích lí do.","a":"- Nam NÊN nháy vào Dòng 1 (“Đọc tiếp chương 2 – Thạch Sanh”) vì đây là siêu liên kết điều hướng nội dung học tập, đọc truyện lành mạnh nằm ngay trong trang truyện.\n- Nam CẦN TRÁNH không nháy vào Dòng 2 (quảng cáo nhấp nháy tặng kim cương miễn phí) vì đây là liên kết quảng cáo mồi chài không đáng tin cậy, dễ dẫn sang trang web lừa đảo lấy cắp tài khoản hoặc tự động tải phần mềm độc hại về máy tính."},{"i":76,"b":"Bài 4","c":3,"l":4,"s":"Nhóm em làm dự án tìm hiểu về “Loài Sao la quý hiếm ở Việt Nam”. Lần đầu bạn nhóm trưởng chỉ gõ từ khóa “Sao” nên Google toàn hiện kết quả về ngôi sao trên bầu trời và nghệ sĩ nổi tiếng. Em hãy chỉ ra nguyên nhân và đề xuất bộ 3 từ khóa tinh chỉnh giúp tìm riêng: (a) đặc điểm loài Sao la, (b) hình ảnh Sao la, (c) khu bảo tồn Sao la ở Việt Nam.","a":"- Nguyên nhân: Từ “Sao” là từ đa nghĩa và quá ngắn nên máy tìm kiếm hiểu sang ngôi sao vũ trụ hoặc ngôi sao ca nhạc.\n- Bộ 3 từ khóa tinh chỉnh chính xác:\n + (a) Tìm đặc điểm: “Động vật quý hiếm Sao la Việt Nam”.\n + (b) Tìm hình ảnh: Gõ “Con Sao la trường sơn” rồi chọn thẻ Hình ảnh (Images).\n + (c) Tìm nơi bảo tồn: “Khu bảo tồn Sao la ở Việt Nam”."},{"i":77,"b":"Bài 5","c":4,"l":4,"s":"Cuối học kì 1, thư mục “HOCTAP_NAM_LOP_4” của bạn Lan có tới 20 tệp tin gồm các bài trình chiếu (.pptx), các tranh vẽ (.png) và các ảnh sưu tầm (.jpg) của hai môn Tin học và Tự nhiên xã hội nằm lẫn lộn. Em hãy thiết kế cây thư mục con gọn gàng và nêu quy trình sắp xếp lại 20 tệp đó mà không làm mất tệp nào.","a":"- Thiết kế cây thư mục con bên trong “HOCTAP_NAM_LOP_4” bằng lệnh New folder và Rename:\n + Tạo 2 thư mục môn học: “Mon_Tin_hoc” và “Mon_Tu_nhien_xa_hoi”.\n + Trong mỗi môn tạo 2 thư mục con: “Bai_trinh_chieu” và “Hinh_anh_minh_hoa”.\n- Quy trình sắp xếp an toàn: Đóng tất cả các tệp đang mở -> xem kĩ tên từng tệp -> dùng cặp lệnh Cut và Paste di chuyển từng tệp .pptx vào thư mục “Bai_trinh_chieu” và các tệp .png, .jpg vào thư mục “Hinh_anh_minh_hoa” của đúng môn học tương ứng (không dùng Delete để tránh xóa nhầm)."},{"i":78,"b":"Bài 6","c":5,"l":4,"s":"Bố vừa mua máy tính mới cho hai anh em học tập. Anh của Minh bảo: “Mình chỉ cần cài hệ điều hành xong rồi cứ lên mạng tìm các gói phần mềm văn phòng, đồ họa đã bẻ khóa sẵn cài vào là đỡ tốn tiền của bố”. Dựa trên kiến thức Bài 6, em hãy đưa ra lời khuyên thuyết phục anh và gợi ý giải pháp thay thế hợp pháp.","a":"- Lời khuyên thuyết phục: Không nên cài các bản bẻ khóa lậu vì đó là hành động xâm phạm quyền tác giả trái pháp luật, không tôn trọng công sức người viết phần mềm; hơn nữa tệp bẻ khóa rất hay bị tin tặc gài mã độc làm chậm máy, hỏng máy mới mua và lộ mật khẩu của bố mẹ.\n- Giải pháp thay thế hợp pháp, tiết kiệm: Sử dụng các phần mềm miễn phí hoặc mã nguồn mở uy tín được tác giả cho phép (như LibreOffice, Google Slides trực tuyến, Paint, GIMP, Scratch, UniKey) hoặc nhờ bố mua gói bản quyền dành cho học sinh – giáo dục."},{"i":79,"b":"Bài 7","c":6,"l":4,"s":"Khi chuẩn bị thuyết trình bài PowerPoint ở phòng Tin học, bạn Khang đã lưu tệp “An_toan_giao_thong.pptx” vào USB nhưng lại quên không lưu các bức ảnh gốc đi kèm hay kiểm tra phông chữ. Em hãy giải thích: Ảnh đã chèn bằng lệnh Insert -> Pictures vào trang chiếu có bị mất khi mang tệp .pptx sang máy khác không, và Khang cần kiểm tra những gì trước khi nhấn F5 thuyết trình?","a":"- Ảnh đã chèn trực tiếp vào trang chiếu bằng lệnh Insert -> Pictures và đã chọn File -> Save thì bức ảnh được nhúng lưu sẵn bên trong tệp “An_toan_giao_thong.pptx”, nên khi mang tệp sang máy tính phòng Tin học ảnh vẫn hiển thị đầy đủ.\n- Trước khi thuyết trình chính thức, Khang nên: Copy tệp từ USB sang ổ đĩa máy tính phòng học -> mở tệp kiểm tra xem phông chữ tiếng Việt có bị lỗi không (nên dùng phông chuẩn có sẵn trên mọi máy như Times New Roman, Arial) -> nhấn F5 chạy thử qua các trang rồi nhấn Esc để sẵn sàng trình bày tự tin."},{"i":80,"b":"Bài 8","c":7,"l":4,"s":"Nhận xét và đề xuất cách chỉnh sửa một trang chiếu đang mắc 4 lỗi trình bày sau đây của bạn cùng bàn: (1) Nền trang chiếu màu xanh dương đậm nhưng chữ lại màu tím than; (2) Tiêu đề trang cỡ chữ 16 nhỏ hơn cả chữ nội dung cỡ 28; (3) Chép nguyên văn cả trang sách dài đặc chữ không tách ý; (4) Không có hình ảnh minh họa.","a":"Em góp ý giúp bạn chỉnh sửa từng lỗi trên thẻ Home và Insert như sau:\n1. Khắc phục độ tương phản màu sắc: Bôi đen văn bản, dùng Font Color đổi chữ sang màu trắng hoặc vàng tươi để nổi bật rõ trên nền xanh dương đậm.\n2. Phân cấp rõ tiêu đề và nội dung: Chỉnh tiêu đề lên cỡ chữ lớn 36–40, in đậm (B) để thu hút sự chú ý; chữ nội dung để cỡ 24–28.\n3. Rút gọn văn bản: Tóm tắt trang sách thành 3–4 cụm từ khóa ngắn gọn nhất và dùng nút Bullets tạo danh sách gạch đầu dòng.\n4. Tăng tính trực quan: Dùng thẻ Insert -> Pictures chèn 1 bức ảnh minh họa rõ nét đặt cân đối bên cạnh phần chữ."}]},"5":{"cs":[{"n":"Bài 1: Em có thể làm gì với máy tính?","b":["Máy tính là công cụ đa năng giúp em học tập, giải trí, tìm kiếm, trao đổi thông tin và hợp tác với bạn bè.","Nhờ các phần mềm ứng dụng, em có thể tạo ra nhiều sản phẩm số hữu ích như: văn bản, bài trình chiếu, bức tranh vẽ trên máy tính, chương trình trò chơi đơn giản.","Sử dụng máy tính hợp lí, đúng mục đích giúp nâng cao hiệu quả học tập và rèn luyện tư duy sáng tạo."]},{"n":"Bài 2: Tìm kiếm thông tin trên website","b":["Có hai cách phổ biến để tìm thông tin trên một website: tìm theo danh mục (chuyên mục/thanh trình đơn) hoặc nhập từ khóa vào ô tìm kiếm (thường có biểu tượng kính lúp).","Tìm theo danh mục phù hợp khi em muốn duyệt xem các bài viết thuộc cùng một chủ đề có sẵn trên trang web.","Sử dụng ô tìm kiếm trên website giúp tìm nhanh các bài viết, hình ảnh, video chứa từ khóa cụ thể mà không cần mở từng mục."]},{"n":"Bài 3: Tìm kiếm thông tin trong giải quyết vấn đề","b":["Quy trình tìm kiếm thông tin giải quyết vấn đề gồm: Xác định rõ thông tin cần tìm -> Chọn từ khóa ngắn gọn, sát nội dung -> Thực hiện tìm kiếm -> Đánh giá, chọn lọc thông tin phù hợp.","Từ khóa càng cụ thể, sát với vấn đề cần giải quyết thì kết quả tìm kiếm càng chính xác và tiết kiệm thời gian.","Khi làm việc nhóm, các thành viên cần phân công tìm kiếm, chia sẻ và cùng kiểm chứng thông tin để hoàn thành nhiệm vụ chung."]},{"n":"Bài 4: Cây thư mục","b":["Cây thư mục có cấu trúc phân cấp hợp lí (thư mục gốc, thư mục mẹ, thư mục con) giúp lưu trữ tệp khoa học, gọn gàng và dễ quản lí.","Cần đặt tên tệp và thư mục ngắn gọn, rõ ràng, gợi nhớ đúng nội dung bên trong (tránh đặt tên tùy tiện như New folder 1, Bai123).","Công cụ Search (ô tìm kiếm ở góc trên bên phải cửa sổ File Explorer) giúp tìm nhanh tệp hoặc thư mục theo tên khi có nhiều thư mục lồng nhau."]},{"n":"Bài 5: Bản quyền nội dung thông tin","b":["Bản quyền nội dung thông tin (quyền tác giả) bảo vệ quyền của người sáng tạo ra tác phẩm (bài viết, bức ảnh, bản nhạc, video, phần mềm...).","Hành vi vi phạm bản quyền: tự ý sao chép, chỉnh sửa, mạo danh tác giả hoặc phát tán tác phẩm của người khác khi chưa được phép.","Tôn trọng bản quyền: xin phép tác giả khi cần thiết và luôn ghi rõ nguồn trích dẫn, tên tác giả khi sử dụng thông tin, hình ảnh của người khác."]},{"n":"Bài 6: Định dạng kí tự và bố trí hình ảnh trong văn bản","b":["Định dạng kí tự gồm chọn phông chữ (Font), cỡ chữ (Font Size), kiểu chữ đậm (B), nghiêng (I), gạch chân (U) và màu chữ (Font Color) để làm nổi bật nội dung.","4 kiểu căn lề đoạn văn bản trong Word: Align Left (căn lề trái), Center (căn giữa), Align Right (căn lề phải), Justify (căn thẳng hai lề).","Công cụ Layout Options ( hoặc Wrap Text) giúp bố trí hình ảnh hài hòa với văn bản: In Line with Text (cùng dòng với chữ), Square / Tight (chữ bao quanh ảnh), Top and Bottom (chữ ở trên và dưới ảnh)."]},{"n":"Bài 7: Thực hành soạn thảo văn bản","b":["Kết hợp thành thạo kĩ năng gõ tiếng Việt có dấu, sao chép, di chuyển, xóa, sửa lỗi chính tả để hoàn thiện văn bản nhiều đoạn.","Trình bày tiêu đề căn giữa, chữ đậm, cỡ chữ lớn hơn nội dung; các đoạn văn căn thẳng hai lề (Justify) và chèn hình minh họa ở vị trí hợp lí.","Lưu tệp văn bản vào đúng thư mục học tập với tên tệp gợi nhớ nội dung trước khi đóng phần mềm."]},{"n":"Bài 8A: Làm quen với phần mềm đồ họa","b":["Phần mềm đồ họa Paint trên máy tính cung cấp các công cụ vẽ và chỉnh sửa hình ảnh trực quan trên trang vẽ.","Nhóm công cụ chính trong thẻ Home: Pencil (bút chì vẽ tự do), Brushes (cọ vẽ nhiều nét), Fill with color (xô sơn tô màu vùng khép kín), Text (chữ A viết chữ), Eraser (cục tẩy), Shapes (các hình mẫu có sẵn).","Hộp màu gồm Color 1 (màu nét vẽ / màu tô chính khi nháy nút trái chuột) và Color 2 (màu nền / màu khi dùng cục tẩy Eraser)."]}],"q":[{"i":1,"b":"Bài 1","c":0,"l":1,"s":"Phần mềm nào dưới đây giúp học sinh tạo ra sản phẩm số là một bức tranh vẽ đầy màu sắc?","o":["Unikey","File Explorer","Windows Calculator","Microsoft Paint"],"a":3,"k":1},{"i":2,"b":"Bài 1","c":0,"l":1,"s":"Hoạt động nào sau đây thể hiện việc sử dụng máy tính phục vụ học tập?","o":["Chơi trò chơi điện tử liên tục nhiều giờ không nghỉ","Gõ mạnh tay lên bàn phím để tạo tiếng kêu vui tai","Tra cứu từ điển tiếng Anh và luyện giải toán trên mạng","Tự ý xóa các tệp hệ thống trong ổ đĩa C của phòng máy"],"a":2,"k":2},{"i":3,"b":"Bài 1","c":0,"l":1,"s":"Tệp văn bản bài thơ do em gõ và trình bày trên phần mềm Word được gọi là gì?","o":["Sản phẩm số","Thiết bị phần cứng","Mạng không dây","Bộ vi xử lí"],"a":0,"k":1},{"i":4,"b":"Bài 1","c":0,"l":1,"s":"Để tạo bài trình chiếu có hình ảnh và hiệu ứng sinh động báo cáo trước lớp, em sử dụng phần mềm nào?","o":["PowerPoint","Recycle Bin","Paint","Task Manager"],"a":0,"k":1},{"i":5,"b":"Bài 1","c":0,"l":1,"s":"Khi ngồi làm việc với máy tính, thói quen nào giúp bảo vệ sức khỏe đôi mắt và cột sống của em?","o":["Ngồi thẳng lưng, giữ khoảng cách mắt tới màn hình từ 50 cm đến 80 cm","Cúi sát mặt cách màn hình khoảng 10 cm để nhìn chữ rõ hơn","Nằm nghiêng trên ghế khi gõ bàn phím bằng một tay","Tắt hết đèn trong phòng tố ăn đã lưu hôm qua, lí do hợp lí nhất là gì?","o":["Ô Search chỉ hoạt động vào buổi sáng khi có kết nối máy in","Tệp văn bản Word không bao giờ hiển thị trong cửa sổ File Explorer","Phạm vi tìm kiếm đang giới hạn trong thư mục MON_TOAN trong khi tệp bài văn lưu ở thư mục MON_TIENG_VIET","Công cụ Search của Windows không tìm được các tệp có dấu gạch dưới"],"a":2,"k":2},{"i":49,"b":"Bài 5","c":4,"l":2,"s":"Bạn Hùng tự sáng tác một đoạn truyện ngắn đăng lên diễn đàn học sinh. Bạn Dũng thấy hay nên chép về trang cá nhân, sửa tên tác giả thành tên Dũng. Hành động của Dũng vi phạm điều gì?","o":["Là hành động đáng khen vì giúp bài viết có thêm nhiều bản sao","Chỉ vi phạm quy tắc gõ dấu câu trong soạn thảo văn bản","Vi phạm quyền tác giả vì mạo danh người sáng tạo và tự ý sao chép khi chưa xin phép","Không vi phạm gì vì thông tin trên Internet là tài sản riêng của người đọc"],"a":2,"k":1},{"i":50,"b":"Bài 5","c":4,"l":2,"s":"Trường hợp nào dưới đây thể hiện đúng văn hóa tôn trọng bản quyền trong học tập?","o":["Dùng công cụ Eraser trong Paint xóa dòng tên họa sĩ ở góc tranh rồi đem đi in báo tường","Quay lén toàn bộ bộ phim chiếu rạp bằng điện thoại rồi đăng lên mạng cho bạn xem","Sử dụng hình ảnh miễn phí bản quyền hoặc ghi đầy đủ tên tác giả, nguồn trích dẫn dưới ảnh minh họa","Sao chép nguyên bài văn đạt giải của bạn lớp bên cạnh để nộp làm bài dự thi của mình"],"a":2,"k":2},{"i":51,"b":"Bài 6","c":5,"l":2,"s":"Sau khi chèn ảnh vào văn bản Word, bạn Ngọc kéo thả chuột để di chuyển ảnh sang góc phải đoạn văn nhưng ảnh rất khó dịch chuyển tự do vì đang ở chế độ In Line with Text. Ngọc nên đổi sang chế độ nào?","o":["Chọn Layout Options rồi chuyển sang chế độ Square hoặc Tight","Bôi đen đoạn văn rồi nhấn nút Align Left nhiều lần","Nhấn phím Caps Lock trên bàn phím rồi kéo lại ảnh","Đổi cỡ chữ của văn bản xuống còn 8 pt"],"a":0,"k":2},{"i":52,"b":"Bài 6","c":5,"l":2,"s":"Trong một thông báo của lớp, dòng chữ 'Hà Nội, ngày 20 tháng 11 năm 2026' ở góc bên phải phía cuối văn bản phù hợp nhất với kiểu căn lề và kiểu chữ nào?","o":["Chế độ bố trí ảnh Top and Bottom","Căn lề phải (Align Right) và chữ in nghiêng (Italic)","Căn lề trái (Align Left) và cỡ chữ lớn gấp đôi tiêu đề","Căn thẳng hai lề (Justify) và chữ gạch chân đậm"],"a":1,"k":1},{"i":53,"b":"Bài 7","c":6,"l":2,"s":"Khi gõ xong bài giới thiệu 'Biển đảo Việt Nam' dài 3 đoạn văn, bạn Châu thấy mép bên phải của các dòng chữ lồi lõm không đều nhau gây kém đẹp mắt. Thao tác nào khắc phục nhanh nhất?","o":["Xóa bớt các từ ở cuối mỗi câu cho ngắn bằng nhau","Chọn cả 3 đoạn văn nội dung rồi nháy nút lệnh Justify (căn thẳng hai lề)","Ngồi gõ thêm nhiều dấu cách vào đầu mỗi dòng cho đến khi bằng nhau","Nhấn phím Enter ở cuối mỗi dòng trên màn hình"],"a":1,"k":1},{"i":54,"b":"Bài 7","c":6,"l":2,"s":"Trong quá trình hoàn thiện văn bản nhiều đoạn có chèn ảnh, trình tự thao tác nào dưới đây hợp lí và tiết kiệm thời gian nhất?","o":["Vừa gõ mỗi từ vừa đổi phông chữ và đóng mở phần mềm liên tục","Chèn thật nhiều ảnh phủ kín trang -> Đổi màu từng chữ cái một -> Cuối cùng mới nghĩ nội dung cần gõ","In văn bản trắng ra giấy trước rồi mới bắt đầu gõ nội dung trên máy","Gõ đầy đủ nội dung chính xác -> Định dạng kí tự, căn lề đoạn văn -> Chèn và bố trí ảnh hài hòa -> Lưu tệp"],"a":3,"k":1},{"i":55,"b":"Bài 8A","c":7,"l":2,"s":"Trong phần mềm Paint, ô Color 2 đang là màu vàng nhạt. Nếu bạn Bình dùng công cụ Eraser kéo qua ngôi nhà vừa vẽ trên nền trắng thì điều gì sẽ xảy ra?","o":["Vệt tẩy sẽ có màu vàng nhạt thay vì màu trắng vì Eraser tô theo màu của ô Color 2","Ngôi nhà được sao chép thêm một bản mới sang bên cạnh","Vệt tẩy vẫn có màu trắng tinh không phụ thuộc vào ô Color 2","Toàn bộ bức tranh biến mất và cửa sổ Paint tự động đóng lại"],"a":0,"k":1},{"i":56,"b":"Bài 8A","c":7,"l":2,"s":"Để vẽ nhanh bức tranh chiếc thuyền buồm gồm các hình tam giác, hình thang cân đối và các con sóng cong mềm mại trong Paint, em nên ưu tiên kết hợp nhóm công cụ nào?","o":["Chỉ dùng công cụ Text gõ các dấu gạch ngang xếp thành hình con thuyền","Các hình mẫu Polygon, Triangle, Curve trong nhóm Shapes kết hợp Fill with color để tô màu","Dùng công cụ Magnifier phóng to trang giấy mà không chọn công cụ vẽ","Chỉ dùng duy nhất công cụ Eraser để tạo hình trên trang giấy trắng"],"a":1,"k":1}],"e":[{"i":57,"b":"Bài 1","c":0,"l":2,"s":"Em hãy kể tên 4 sản phẩm số tiêu biểu mà học sinh lớp 5 có thể tự tạo ra trên máy tính và nêu tên phần mềm tương ứng để tạo mỗi sản phẩm đó.","a":"4 sản phẩm số tiêu biểu và phần mềm tương ứng gồm: (1) Văn bản bài thơ, tờ báo tường điện tử — tạo bằng phần mềm soạn thảo Microsoft Word; (2) Bài trình chiếu thuyết trình chủ đề học tập — tạo bằng phần mềm Microsoft PowerPoint; (3) Bức tranh vẽ phong cảnh, biển báo — tạo bằng phần mềm đồ họa Microsoft Paint; (4) Chương trình hoạt hình hoặc trò chơi đơn giản — tạo bằng phần mềm lập trình trực quan Scratch."},{"i":58,"b":"Bài 2","c":1,"l":2,"s":"Khi truy cập vào một website học tập trực tuyến, làm thế nào để em nhận biết nhanh vị trí của ô tìm kiếm và thanh danh mục? Khi nào nên dùng mỗi cách?","a":"Thanh danh mục thường nằm ngang phía đầu trang (hoặc dọc bên trái) liệt kê các chuyên mục lớn (Toán, Tiếng Việt, Tin học...), phù hợp khi muốn duyệt xem các bài học theo chủ đề. Ô tìm kiếm thường là khung hình chữ nhật có biểu tượng chiếc kính lúp ở góc trên trang web, phù hợp khi em đã biết từ khóa hoặc tên bài cụ thể cần tra cứu ngay."},{"i":59,"b":"Bài 3","c":2,"l":2,"s":"Vì sao trong quá trình tìm kiếm thông tin để giải quyết vấn đề, việc lựa chọn từ khóa phù hợp lại quyết định hiệu quả tìm kiếm? Hãy lấy 1 ví dụ minh họa.","a":"Từ khóa phù hợp (ngắn gọn, chứa đúng danh từ/cụm từ cốt lõi của vấn đề) giúp máy tìm kiếm lọc bỏ hàng triệu trang web không liên quan và trả về đúng thông tin cần thiết. Ví dụ: Muốn tìm hiểu cách làm đèn lồng giấy dịp Trung thu, gõ từ khóa 'cách làm đèn lồng giấy Trung thu' sẽ cho hướng dẫn chi tiết, chính xác hơn nhiều so với chỉ gõ từ chung chung 'Trung thu' hoặc 'đồ chơi'."},{"i":60,"b":"Bài 4","c":3,"l":2,"s":"Thế nào là một cây thư mục được thiết kế hợp lí? Em hãy giải thích vì sao không nên lưu mọi tệp bài tập lẫn lộn trong cùng một thư mục duy nhất.","a":"Cây thư mục hợp lí là cây thư mục được phân chia theo tầng bậc rõ ràng (theo năm học -> môn học -> dạng bài/chủ đề) và có tên thư mục ngắn gọn, gợi nhớ đúng nội dung. Nếu lưu mọi tệp lẫn lộn trong một thư mục duy nhất, khi số lượng tệp lên tới hàng chục, hàng trăm tệp sẽ gây rối mắt, dễ nhầm lẫn, xóa nhầm và rất tốn thời gian tìm kiếm."},{"i":61,"b":"Bài 5","c":4,"l":2,"s":"Em hiểu thế nào là bản quyền nội dung thông tin? Hãy nêu 2 việc nên làm và 2 việc không được làm để tôn trọng bản quyền khi học tập trong môi trường số.","a":"Bản quyền nội dung thông tin là quyền của tác giả/chủ sở hữu đối với tác phẩm tinh thần do họ sáng tạo ra (bài viết, tranh ảnh, âm nhạc, phần mềm...). Hai việc nên làm: (1) Ghi rõ tên tác giả và nguồn gốc khi trích dẫn văn bản, hình ảnh; (2) Xin phép tác giả trước khi sử dụng hoặc chia sẻ lại tác phẩm có bản quyền. Hai việc không được làm: (1) Sao chép bài viết, tranh vẽ của người khác rồi nhận là của mình; (2) Tải, cài đặt và phát tán phần mềm bẻ khóa trái phép."},{"i":62,"b":"Bài 6","c":5,"l":2,"s":"Em hãy nêu sự khác nhau giữa chế độ bố trí ảnh 'In Line with Text', 'Square' và 'Top and Bottom' trong phần mềm soạn thảo Word.","a":"- In Line with Text: Ảnh được xem như một kí tự lớn nằm ngay trên cùng dòng với văn bản, khó kéo thả tự do sang các góc. - Square: Các dòng văn bản tự động dàn đều bao xung quanh bốn cạnh khung hình chữ nhật của bức ảnh, dễ dàng di chuyển ảnh tới vị trí mong muốn. - Top and Bottom: Văn bản chỉ nằm ở các dòng phía trên và phía dưới bức ảnh, khoảng trống hai bên trái/phải của ảnh không có chữ."},{"i":63,"b":"Bài 7","c":6,"l":2,"s":"Khi trình bày một văn bản gồm tiêu đề và nhiều đoạn văn trên Word, em cần kết hợp định dạng kí tự và căn lề đoạn văn như thế nào để trang văn bản cân đối, dễ đọc?","a":"- Phần tiêu đề: Chọn phông chữ rõ ràng (như Times New Roman), cỡ chữ lớn hơn nội dung (14–16 pt), kiểu chữ in đậm (B), màu sắc trang nhã và căn giữa trang (Center). - Phần nội dung các đoạn văn: Thống nhất một phông chữ, cỡ chữ vừa phải (13–14 pt), căn thẳng hai lề (Justify), lùi đầu dòng mỗi đoạn hợp lí và kiểm tra sạch lỗi chính tả tiếng Việt."},{"i":64,"b":"Bài 8A","c":7,"l":2,"s":"Em hãy trình bày vai trò của hai ô màu Color 1 và Color 2 trong phần mềm đồ họa Paint. Làm thế nào để xóa một chi tiết vẽ thừa trên nền tranh màu trắng mà không để lại vệt màu lạ?","a":"Trong Paint: Ô Color 1 quy định màu nét vẽ chính, màu viền hình mẫu và màu tô khi sử dụng chuột trái; ô Color 2 quy định màu nền của hình mẫu và màu của cục tẩy (Eraser). Để xóa chi tiết thừa trên nền trắng không để lại vệt màu lạ, trước khi dùng Eraser em cần nháy chọn ô Color 2 rồi chọn đúng ô màu trắng trong bảng màu."},{"i":65,"b":"Bài 1","c":0,"l":3,"s":"Lớp 5C1 tổ chức buổi sinh hoạt chủ điểm 'An toàn giao thông'. Em hãy đề xuất 2 sản phẩm số khác nhau có thể làm trên máy tính để phục vụ buổi sinh hoạt và nêu rõ công cụ thực hiện.","a":"Đề xuất 2 sản phẩm số thiết thực: (1) Bộ tranh cổ động các biển báo giao thông đường bộ (biển cấm đi ngược chiều, biển dành cho người đi bộ) vẽ bằng phần mềm đồ họa Paint (sử dụng Shapes, Fill with color, Text); (2) Tờ rơi hoặc bản quy tắc '5 điều học sinh cần nhớ khi tham gia giao thông' trình bày có chèn ảnh minh họa trên phần mềm soạn thảo Microsoft Word."},{"i":66,"b":"Bài 2","c":1,"l":3,"s":"Em cần tìm đọc các bài hướng dẫn thí nghiệm vui và tìm bài viết cụ thể có tên 'Sự tuần hoàn của nước' trên một website Khoa học thiếu nhi. Em sẽ áp dụng hai cách tìm kiếm trên website đó như thế nào?","a":"- Với nhu cầu xem các bài thí nghiệm vui nói chung: Em quan sát thanh danh mục trên đầu website và nháy chuột vào chuyên mục 'Thí nghiệm vui' (hoặc 'Khám phá khoa học') để duyệt danh sách bài viết. - Với bài viết cụ thể 'Sự tuần hoàn của nước': Em nháy chuột vào ô tìm kiếm (biểu tượng kính lúp) của website, gõ cụm từ 'Sự tuần hoàn của nước' rồi nhấn Enter để mở thẳng bài viết đó."},{"i":67,"b":"Bài 3","c":2,"l":3,"s":"Cô giáo giao nhiệm vụ cho nhóm em tìm thông tin chuẩn bị bài giới thiệu ngắn về 'Di sản thiên nhiên thế giới Vườn quốc gia Phong Nha - Kẻ Bàng'. Em hãy lập kế hoạch 4 bước tìm kiếm thông tin cho nhóm.","a":"Kế hoạch 4 bước của nhóm: - Bước 1 (Xác định thông tin cần tìm): Vị trí địa lí (tỉnh Quảng Bình), đặc điểm hang động nổi bật, năm được UNESCO công nhận và ý nghĩa bảo tồn. - Bước 2 (Chọn từ khóa): 'Vườn quốc gia Phong Nha Kẻ Bàng di sản thiên nhiên', 'đặc điểm Phong Nha Kẻ Bàng'. - Bước 3 (Tìm kiếm & phân công): Mở trình duyệt, tra cứu trên máy tìm kiếm và chia mỗi bạn phụ trách tóm tắt một ý. - Bước 4 (Đánh giá & tổng hợp): Kiểm chứng thông tin từ cổng thông tin du lịch/giáo dục uy tín, ghi lại nguồn trích dẫn và ghép thành bài hoàn chỉnh."},{"i":68,"b":"Bài 4","c":3,"l":3,"s":"Bạn Lan lưu các tệp sau trong máy tính: 'Bai_hat_Quoc_ca.mp3', 'Tap_lam_van_ta_cay_bang.docx', 'Tranh_ngoi_nha.png', 'Bai_toan_ti_so_phan_tram.docx'. Em hãy vẽ sơ đồ cây thư mục dưới thư mục gốc GIA_TAI_HOC_TAP để sắp xếp 4 tệp trên vào đúng ngăn hợp lí.","a":"Sơ đồ cây thư mục hợp lí:\nGIA_TAI_HOC_TAP\n├── AM_NHAC\n│ └── Bai_hat_Quoc_ca.mp3\n├── TIENG_VIET\n│ └── Tap_lam_van_ta_cay_bang.docx\n├── TOAN\n│ └── Bai_toan_ti_so_phan_tram.docx\n└── TIN_HOC_PAINT\n └── Tranh_ngoi_nha.png\nCách sắp xếp này phân loại rõ theo từng môn học và đặt tên gợi nhớ giúp Lan mở đúng tệp ngay lập tức."},{"i":69,"b":"Bài 5","c":4,"l":3,"s":"Tình huống: Bạn Khôi tìm thấy một bức tranh vẽ chú bộ đội hải quân rất đẹp trên mạng nên muốn tải về làm bài dự thi 'Em vẽ ước mơ của em' cấp trường và ghi tên người vẽ là Khôi. Nếu là bạn cùng bàn, em sẽ khuyên Khôi như thế nào?","a":"Em sẽ khuyên Khôi tuyệt đối không được lấy tranh của người khác trên mạng ghi tên mình đem đi dự thi, vì đó là hành vi gian lận trong thi cử và vi phạm nghiêm trọng bản quyền tác giả. Em sẽ hướng dẫn Khôi chỉ xem bức tranh đó để tham khảo ý tưởng màu sắc, sau đó tự tay mở phần mềm Paint sáng tạo bức tranh của riêng mình — vừa trung thực, vừa đáng tự hào."},{"i":70,"b":"Bài 6","c":5,"l":3,"s":"Em đang soạn văn bản giới thiệu 'Món ăn truyền thống bánh chưng ngày Tết' gồm 1 tiêu đề, 2 đoạn văn và 1 tấm ảnh chiếc bánh chưng. Em hãy nêu cụ thể các bước chèn ảnh và bố trí để tấm ảnh nằm gọn ở góc bên trái của đoạn văn thứ nhất, các dòng chữ bao quanh bên phải bức ảnh.","a":"Các bước thực hiện trong Word: - Bước 1: Đặt con trỏ soạn thảo tại đầu đoạn văn thứ nhất, chọn thẻ Insert -> nháy nút Pictures -> chọn tệp ảnh chiếc bánh chưng trong máy tính -> nhấn Insert. - Bước 2: Nháy chọn bức ảnh vừa chèn, kéo điểm nút tròn ở góc ảnh để thu nhỏ kích thước vừa phải. - Bước 3: Nháy vào biểu tượng Layout Options cạnh góc phải trên bức ảnh (hoặc thẻ Picture Format -> Wrap Text) -> chọn kiểu Square. - Bước 4: Kéo thả bức ảnh đặt sát lề trái của đoạn văn thứ nhất để các dòng chữ tự động bao gọn bên phải ảnh."},{"i":71,"b":"Bài 7","c":6,"l":3,"s":"Khi kiểm tra tệp văn bản 'Noi_quy_phong_Tin_hoc.docx' của một bạn học sinh, em phát hiện: tiêu đề đang căn trái chữ nhỏ bằng nội dung, có từ gõ sai dấu cách 'phòng máy ,trường em', và chưa lưu bản sửa mới. Em hãy nêu các bước chỉnh sửa hoàn thiện tệp văn bản đó.","a":"Các bước chỉnh sửa hoàn thiện: - Bước 1: Sửa lỗi gõ dấu câu và khoảng trắng thừa thành 'phòng máy, trường em' (chỉ để 1 dấu cách giữa các từ, dấu phẩy sát từ đứng trước). - Bước 2: Bôi đen dòng tiêu đề, chọn nút Center (căn giữa), bật chữ đậm (B), tăng cỡ chữ lên 15–16 pt và chọn màu chữ nổi bật. - Bước 3: Bôi đen các mục nội dung, chọn căn thẳng hai lề (Justify) và thống nhất phông chữ Times New Roman 13–14 pt. - Bước 4: Nhấn Ctrl + S để lưu lại toàn bộ thay đổi vào tệp 'Noi_quy_phong_Tin_hoc.docx'."},{"i":72,"b":"Bài 8A","c":7,"l":3,"s":"Em hãy mô tả quy trình các bước sử dụng phần mềm Paint để vẽ biển báo 'Cấm đi ngược chiều' (hình tròn nền đỏ tươi, ở giữa có dải hình chữ nhật nằm ngang màu trắng) và lưu tệp với tên gợi nhớ.","a":"Quy trình thực hiện trong Paint: - Bước 1: Chọn công cụ Oval trong nhóm Shapes, chọn Color 1 là màu đỏ, nhấn giữ phím Shift và kéo thả chuột để vẽ một hình tròn thật đều. - Bước 2: Chọn công cụ Fill with color (xô sơn), nháy chuột trái vào bên trong hình tròn để tô kín nền màu đỏ tươi. - Bước 3: Chọn công cụ Rectangle (hình chữ nhật), đổi cả Color 1 và Color 2 sang màu trắng (hoặc vẽ viền trắng rồi tô trắng), kéo vẽ một hình chữ nhật nằm ngang cân đối ở chính giữa hình tròn đỏ. - Bước 4: Nhấn File -> Save, chọn thư mục học tập và đặt tên tệp 'Bien_cam_di_nguoc_chieu.png'."},{"i":73,"b":"Bài 1","c":0,"l":4,"s":"Có ý kiến cho rằng: 'Học sinh tiểu học dùng máy tính càng nhiều giờ mỗi ngày thì càng học giỏi'. Em có đồng tình với ý kiến đó không? Hãy giải thích và đề xuất quy tắc sử dụng máy tính thông minh, cân bằng cho học sinh lớp 5.","a":"Em không đồng tình với ý kiến đó. Máy tính là công cụ đa năng rất hữu ích, nhưng hiệu quả phụ thuộc vào mục đích và cách sử dụng hợp lí chứ không phải số giờ ngồi trước màn hình; lạm dụng quá lâu sẽ gây mỏi mắt, cong vẹo cột sống và giảm thời gian vận động, giao tiếp thực tế. Quy tắc sử dụng thông minh: Xác định rõ mục tiêu học tập trước khi mở máy; mỗi lần dùng khoảng 30–40 phút rồi nghỉ giải lao nhìn xa 5–10 phút; kết hợp hài hòa giữa tạo sản phẩm số với đọc sách giấy và rèn luyện thể thao."},{"i":74,"b":"Bài 2","c":1,"l":4,"s":"Bạn Minh truy cập Cổng thông tin của một thư viện thiếu nhi trực tuyến để vừa tìm cuốn truyện 'Dế Mèn phiêu lưu kí', vừa muốn xem thêm các cuốn sách mới thuộc thể loại 'Khoa học vũ trụ'. Em hãy hướng dẫn Minh phối hợp linh hoạt cả hai công cụ trên website để hoàn thành nhanh nhất.","a":"Hướng dẫn phối hợp hiệu quả hai công cụ: - Nhiệm vụ 1 (đã biết chính xác tên tác phẩm): Minh nhập ngay cụm từ 'Dế Mèn phiêu lưu kí' vào ô tìm kiếm (biểu tượng kính lúp) trên đầu trang thư viện rồi nhấn Enter để mở thẳng trang thông tin cuốn truyện. - Nhiệm vụ 2 (muốn khám phá nhiều đầu sách cùng thể loại): Minh nháy chuột vào thanh danh mục 'Thể loại sách' -> chọn chuyên mục 'Khoa học vũ trụ' để xem trọn bộ các đầu sách mới được phân loại sẵn."},{"i":75,"b":"Bài 3","c":2,"l":4,"s":"Nhóm em cần làm cẩm nang số 'Phòng tránh đuối nước mùa hè cho học sinh'. Hãy: (a) Xác định 3 nội dung cốt lõi cần tìm; (b) Viết 3 từ khóa tìm kiếm tương ứng; (c) Nêu 2 tiêu chí để nhóm kiểm tra xem thông tin tìm được trên mạng có đáng tin cậy hay không.","a":"- (a) Ba nội dung cốt lõi: Nguyên nhân gây đuối nước ở trẻ em; Các quy tắc an toàn khi đi bơi và gần sông hồ; Cách xử lí, kêu gọi cứu hộ đúng cách khi gặp người đuối nước. - (b) Ba từ khóa tương ứng: 'nguyên nhân đuối nước trẻ em', 'quy tắc an toàn phòng tránh đuối nước học sinh', 'xử lí đúng cách khi gặp người đuối nước'. - (c) Hai tiêu chí đánh giá độ tin cậy: Ưu tiên bài viết từ cơ quan y tế, giáo dục, báo chính thống (Bộ Giáo dục, Bộ Y tế, UNICEF, báo Thiếu niên...); kiểm chứng chéo nội dung hướng dẫn giữa ít nhất 2 nguồn uy tín (ví dụ tuyệt đối không tự nhảy xuống cứu khi chưa biết cứu hộ mà phải hô hoán người lớn và ném phao/sào)."},{"i":76,"b":"Bài 4","c":3,"l":4,"s":"Máy tính dùng chung của Câu lạc bộ Tin học có 2 khối lớp (Khối 4 và Khối 5), mỗi khối đều thực hiện 2 dự án: 'Báo tường số' và 'Tranh vẽ Paint'. Em hãy thiết kế cây thư mục tối ưu (không bị trùng lẫn tệp giữa hai khối), quy ước cách đặt tên tệp cho từng học sinh và hướng dẫn cô phụ trách tìm nhanh mọi tệp tranh vẽ .png của cả câu lạc bộ.","a":"- Sơ đồ cây thư mục 3 cấp tối ưu:\nCLB_TIN_HOC_UNIGO\n├── KHOI_4\n│ ├── BAO_TUONG_SO\n│ └── TRANH_VE_PAINT\n└── KHOI_5\n ├── BAO_TUONG_SO\n └── TRANH_VE_PAINT\n- Quy ước đặt tên tệp gợi nhớ: <Lop>_<HoTenKhongDau>_<ChuDe> (ví dụ: 5C1_NguyenMinhAn_TruongEm.png). - Cách tìm nhanh toàn bộ tệp tranh .png: Mở thư mục gốc CLB_TIN_HOC_UNIGO trong File Explorer, nháy vào ô Search góc trên bên phải và gõ *.png (hoặc .png) rồi nhấn Enter để liệt kê đầy đủ các bức tranh của cả hai khối."},{"i":77,"b":"Bài 5","c":4,"l":4,"s":"Trong dự án làm tập san lớp, bạn A nói: 'Cứ lấy bài thơ và tranh minh họa trên mạng ghép vào, xóa tên tác giả đi vì tập san chỉ lưu hành nội bộ trong lớp chứ không đem bán nên không vi phạm bản quyền'. Em hãy phân tích điểm sai trong suy nghĩ của bạn A và nêu giải pháp đúng cho lớp.","a":"Suy nghĩ của bạn A là sai vì: Quyền nhân thân của tác giả (quyền được đứng tên trên tác phẩm và bảo vệ sự toàn vẹn của tác phẩm) luôn được pháp luật và đạo đức tôn trọng dù sử dụng vì mục đích thương mại hay học tập nội bộ; việc cố tình xóa tên tác giả là hành vi xâm phạm bản quyền và thiếu trung thực. Giải pháp đúng cho lớp: Khuyến khích các bạn tự sáng tác thơ và tự vẽ tranh bằng Paint; đối với những bài thơ, hình ảnh sưu tầm bổ trợ, bắt buộc giữ nguyên tên tác giả và thêm mục 'Nguồn tài liệu & hình ảnh trích dẫn' rõ ràng ở cuối mỗi trang tập san."},{"i":78,"b":"Bài 6","c":5,"l":4,"s":"Em cần thiết kế một trang 'Thư mời tham dự Ngày hội STEM lớp 5C1' trên Word có chèn 1 logo nhỏ ở góc trên bên trái ngang hàng với tên trường và 1 ảnh poster lớn nằm giữa hai đoạn nội dung chính. Em sẽ chọn chế độ bố trí ảnh (Layout Options) và căn lề văn bản cho từng phần như thế nào để trang thư mời chuyên nghiệp nhất?","a":"- Với logo nhỏ ở góc trên bên trái: Chèn logo, chọn chế độ Square, thu nhỏ vừa vặn và đặt bên trái dòng tên trường để dòng chữ tên trường nằm gọn bên phải logo mà không bị đẩy lệch hàng. - Với tiêu đề 'THƯ MỜI NGÀY HỘI STEM': Chọn chữ in hoa đậm (B), cỡ 16 pt, màu xanh đậm và căn giữa (Center). - Với ảnh poster lớn ở giữa: Chọn chế độ Top and Bottom và đặt căn giữa trang để văn bản giới thiệu nằm phía trên ảnh và thông tin thời gian, địa điểm nằm phía dưới ảnh rõ ràng. - Với các đoạn văn nội dung: Căn thẳng hai lề (Justify), dòng 'Ban cán sự lớp 5C1' ở cuối căn phải (Align Right) in nghiêng."},{"i":79,"b":"Bài 7","c":6,"l":4,"s":"Em được giao biên tập lại một tệp văn bản dài 2 trang do ba bạn trong nhóm gõ ghép lại, hiện đang gặp 3 vấn đề: mỗi đoạn một phông chữ và cỡ chữ khác nhau; hai bức ảnh bị chồng đè lên chữ làm mất nội dung; tệp đang lưu tạm ở thư mục Downloads với tên 'Doc1.docx'. Hãy trình bày quy trình chuẩn hóa toàn diện tệp văn bản này.","a":"Quy trình chuẩn hóa 4 bước: - Bước 1 (Đồng bộ định dạng văn bản): Nhấn Ctrl + A chọn toàn bộ văn bản, đổi thống nhất về phông Times New Roman cỡ 13–14 pt, chọn căn thẳng hai lề (Justify); sau đó chọn riêng dòng tiêu đề chính để căn giữa (Center), in đậm cỡ 16 pt. - Bước 2 (Xử lí ảnh đè lên chữ): Nháy chọn từng bức ảnh đang ở chế độ In Front of Text, mở Layout Options đổi sang chế độ Square hoặc Top and Bottom để dòng chữ tự động dạt ra hiển thị đầy đủ, thu chỉnh kích thước ảnh cân đối. - Bước 3 (Rà soát chính tả & nguồn): Kiểm tra lỗi gõ tiếng Việt, dấu câu và bổ sung dòng ghi nguồn tác giả dưới ảnh minh họa. - Bước 4 (Lưu chuẩn cây thư mục): Chọn File -> Save As, điều hướng về đúng thư mục dự án của nhóm trong ổ D: và đặt tên gợi nhớ (ví dụ: Bao_cao_Nhom1_Lop5C1.docx)."},{"i":80,"b":"Bài 8A","c":7,"l":4,"s":"Em muốn kết hợp phần mềm Paint và phần mềm Word để tự tạo sản phẩm số 'Sơ đồ cây thư mục học tập kèm bài hướng dẫn cho học sinh lớp 5'. Em hãy trình bày cách phối hợp hai phần mềm này từ khâu vẽ sơ đồ trong Paint đến khâu hoàn thiện trang hướng dẫn trong Word.","a":"Cách phối hợp hiệu quả Paint và Word: - Giai đoạn 1 trên Paint: Mở Paint, dùng công cụ Rounded Rectangle (hình chữ nhật bo góc) và Line/Arrow trong Shapes để vẽ khung sơ đồ cây thư mục; dùng Fill with color tô màu phân biệt thư mục gốc và thư mục con; dùng công cụ Text gõ nhãn tên các thư mục tiếng Việt rõ ràng; lưu thành tệp ảnh So_do_cay_thu_muc.png. - Giai đoạn 2 trên Word: Mở Word, gõ tiêu đề căn giữa và các bước hướng dẫn tạo cây thư mục căn thẳng hai lề (Justify); dùng Insert -> Pictures chèn tệp ảnh So_do_cay_thu_muc.png vừa vẽ vào giữa bài, chọn Layout Options -> Top and Bottom để sơ đồ hiển thị to, rõ nét ngay dưới phần lí thuyết; lưu thành tệp hoàn chỉnh Huong_dan_cay_thu_muc_5C1.docx."}]},"6":{"cs":[{"n":"Bài 1: Thông tin và dữ liệu","b":["Thông tin là những gì đem lại hiểu biết cho con người về thế giới xung quanh và về chính bản thân mình.","Dữ liệu là hình thức thể hiện của thông tin (dạng chữ và số, dạng hình ảnh, dạng âm thanh) được ghi lên vật mang tin.","Vật mang tin là phương tiện dùng để lưu trữ và truyền tải dữ liệu (trang giấy, biển báo, đĩa quang, thẻ nhớ USB, ổ cứng...). Thông tin có vai trò quyết định đến sự lựa chọn và hành động đúng đắn của con người."]},{"n":"Bài 2: Xử lí thông tin","b":["Quá trình xử lí thông tin gồm 4 hoạt động cơ bản: Thu nhận thông tin -> Lưu trữ thông tin -> Xử lí thông tin -> Truyền (trao đổi) thông tin.","Trong máy tính điện tử: Thiết bị vào (bàn phím, chuột, micro, máy quét) thu nhận dữ liệu; Bộ nhớ (RAM, ổ cứng, USB) lưu trữ dữ liệu; Bộ xử lí trung tâm (CPU) tính toán và điều khiển xử lí; Thiết bị ra (màn hình, loa, máy in, máy chiếu) xuất thông tin ra.","Máy tính là công cụ xử lí thông tin hiệu quả nhờ tốc độ tính toán cực nhanh, độ chính xác cao, dung lượng lưu trữ lớn và làm việc bền bỉ."]},{"n":"Bài 3: Thông tin trong máy tính","b":["Mọi dữ liệu trong máy tính (văn bản, số, hình ảnh, âm thanh, video) đều được biểu diễn bằng dãy bit chỉ gồm hai kí hiệu 0 và 1 (hệ nhị phân).","Bit (viết tắt của binary digit) là đơn vị nhỏ nhất dùng để đo dung lượng thông tin; 1 Byte (B) = 8 bit.","Các đơn vị đo dung lượng thông tin lớn hơn theo thứ tự tăng dần: Byte (B) < Kilobyte (KB) < Megabyte (MB) < Gigabyte (GB) < Terabyte (TB), mỗi đơn vị gấp xấp xỉ 1000 lần (chính xác theo nhị phân là 1024 lần) đơn vị đứng liền trước."]},{"n":"Bài 4: Mạng máy tính","b":["Mạng máy tính là hai hay nhiều máy tính và các thiết bị số được kết nối với nhau để truyền dữ liệu, chia sẻ thông tin và dùng chung thiết bị (như máy in mạng, ổ cứng mạng).","Ba thành phần cơ bản của mạng máy tính: (1) Thiết bị đầu cuối (máy tính cá nhân, điện thoại thông minh, máy tính bảng, máy in); (2) Thiết bị kết nối (dây cáp mạng, sóng Wi-Fi, bộ chuyển mạch Switch, bộ định tuyến Router, điểm truy cập không dây Access Point); (3) Phần mềm mạng (hệ điều hành mạng, trình duyệt, ứng dụng truyền tin)."]},{"n":"Bài 5: Internet","b":["Internet là mạng liên kết các mạng máy tính trên khắp thế giới. Người dùng kết nối Internet thông qua nhà cung cấp dịch vụ Internet (ISP - Internet Service Provider).","Bốn đặc điểm chính của Internet: Tính toàn cầu, Tính tương tác, Tính dễ tiếp cận, Tính không chủ sở hữu. Ngoài ra còn có các đặc điểm: tính cập nhật, tính lưu trữ, tính đa dạng và tính ẩn danh.","Internet mang lại nhiều lợi ích thiết thực: học tập trực tuyến, tra cứu tri thức, trao đổi thư điện tử, hội họp từ xa, thương mại điện tử và giải trí."]},{"n":"Bài 6: Mạng thông tin toàn cầu","b":["Siêu văn bản (Hypertext) là văn bản tích hợp nhiều dạng dữ liệu (chữ, ảnh, âm thanh, video) và chứa các siêu liên kết (Hyperlink - khi trỏ chuột vào biến thành hình bàn tay) dẫn tới trang khác.","Trang web là một siêu văn bản trên Internet có địa chỉ truy cập (URL); Website là tập hợp các trang web liên quan có chung địa chỉ gốc; Trang chủ (Homepage) là trang mở ra đầu tiên khi truy cập website.","World Wide Web (WWW) là hệ thống các website liên kết với nhau trên Internet (Internet là hạ tầng mạng vật lí toàn cầu, còn WWW là một dịch vụ chạy trên Internet). Trình duyệt web (Chrome, Edge, Firefox, Cốc Cốc, Safari) giúp truy cập trang web và đánh dấu trang yêu thích (Bookmark)."]},{"n":"Bài 7: Tìm kiếm thông tin trên Internet","b":["Máy tìm kiếm (Search Engine như Google, Bing, Yahoo...) là công cụ hỗ trợ tìm kiếm thông tin trên Internet theo yêu cầu người dùng thông qua từ khóa.","Mẹo thu hẹp phạm vi tìm kiếm: Đặt cụm từ khóa trong cặp dấu ngoặc kép “...” để máy tìm kiếm chỉ trả về các trang chứa chính xác nguyên cụm từ đó theo đúng thứ tự.","Có thể lọc kết quả tìm kiếm theo định dạng chuyên biệt: Tất cả, Hình ảnh, Video, Tin tức... để lấy đúng dạng tư liệu cần dùng."]},{"n":"Bài 8: Thư điện tử","b":["Thư điện tử (Email) là dịch vụ chuyển và nhận thư qua mạng máy tính với ưu điểm vượt trội so với thư truyền thống: chi phí thấp, thời gian chuyển gần như tức thời, gửi đồng thời cho nhiều người và đính kèm được nhiều dạng tệp số.","Cấu trúc địa chỉ thư điện tử chuẩn: <tên_đăng_nhập>@<tên_máy_chủ_hộp_thư> (ví dụ: hoctap.lop6a1@gmail.com), không chứa dấu cách và là duy nhất trên toàn cầu.","Các thành phần chính khi soạn thư: Ô To (địa chỉ người nhận), ô Subject (chủ đề tóm tắt nội dung thư), phần nội dung thư và biểu tượng kẹp giấy Attach (đính kèm tệp tin)."]}],"q":[{"i":1,"b":"Bài 1","c":0,"l":1,"s":"Ba dạng dữ liệu cơ bản thường gặp trong cuộc sống và trong máy tính là gì?","o":["Dạng giấy in, dạng bảng đen, dạng đĩa từ","Dạng cáp đồng, dạng cáp quang, dạng sóng vô tuyến","Dạng chữ và số, dạng hình ảnh, dạng âm thanh","Dạng bàn phím, dạng màn hình, dạng thân máy"],"a":2,"k":1},{"i":2,"b":"Bài 1","c":0,"l":1,"s":"Tiếng trống trường vang lên báo hiệu giờ ra chơi thuộc dạng dữ liệu nào?","o":["Dạng chữ và số","Dạng kí hiệu văn bản","Dạng âm thanh","Dạng hình ảnh tĩnh"],"a":2,"k":1},{"i":3,"b":"Bài 1","c":0,"l":1,"s":"Tấm biển báo giao thông dựng bên lề đường đóng vai trò gì trong mối quan hệ thông tin - dữ liệu?","o":["Vật mang tin","Trình duyệt web","Bộ vi xử lí","Phần mềm mạng"],"a":0,"k":2},{"i":4,"b":"Bài 1","c":0,"l":1,"s":"Những con số điểm kiểm tra được ghi trong sổ điểm của giáo viên được gọi là gì?","o":["Dữ liệu","Thiết bị kết nối","Hệ điều hành","Siêu liên kết"],"a":0,"k":1},{"i":5,"b":"Bài 1","c":0,"l":1,"s":"Vai trò quan trọng nhất của thông tin đối với con người là gì?","o":["Thay thế hoàn toàn nhu cầu ăn uống và nghỉ ngơi hằng ngày","Đem lại hiểu biết và giúp con người đưa ra những lựa chọn, hành động đúng đắn","Tự động sửa chữa các thiết bị điện gia dụng khi bị hỏng","Làm giảm khối lượng của các vật mang tin bằng giấy"],"a":1,"k":2},{"i":6,"b":"Bài 2","c":1,"l":1,"s":"Đối với con người, bộ phận nào đảm nhận vai trò lưu trữ và xử lí thông tin?","o":["Bộ não","Đôi bàn tay","Cổ họng","Đôi bàn chân"],"a":0,"k":1},{"i":7,"b":"
