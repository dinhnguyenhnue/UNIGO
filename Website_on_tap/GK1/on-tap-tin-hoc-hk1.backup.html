<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Tin học cuối học kì 1</title>
<style>
:root{--bg:#F4F8FD;--sf:#FFFFFF;--sb:#EEF3FA;--ln:#D6E0EE;--bd:#64748B;--tx:#0F172A;--mu:#475569;--ac:#2563EB;--ax:#FFFFFF;--as:#E8F0FE;--ok:#047857;--ob:#E7F8F0;--od:#6EE7B7;--er:#B91C1C;--eb:#FEF0F0;--ed:#FCA5A5;--wn:#92400E;--wb:#FEF6E3;--sh:0 1px 2px rgba(15,23,42,.06),0 10px 28px rgba(37,99,235,.08);--hero:linear-gradient(135deg,#DCEAFE 0%,#E3F4FD 60%,#F2FAFF 100%);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1120;--sf:#111B30;--sb:#17233D;--ln:#243452;--bd:#8A9BB8;--tx:#E8EEFB;--mu:#A9B7D0;--ac:#60A5FA;--ax:#0A1120;--as:#16264A;--ok:#6EE7B7;--ob:#06281F;--od:#0F6B4E;--er:#FCA5A5;--eb:#2E1014;--ed:#8F2A33;--wn:#FCD34D;--wb:#2B2008;--sh:0 1px 2px rgba(0,0,0,.4);--hero:linear-gradient(135deg,#13264D 0%,#0F2A44 100%);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1120;--sf:#111B30;--sb:#17233D;--ln:#243452;--bd:#8A9BB8;--tx:#E8EEFB;--mu:#A9B7D0;--ac:#60A5FA;--ax:#0A1120;--as:#16264A;--ok:#6EE7B7;--ob:#06281F;--od:#0F6B4E;--er:#FCA5A5;--eb:#2E1014;--ed:#8F2A33;--wn:#FCD34D;--wb:#2B2008;--sh:0 1px 2px rgba(0,0,0,.4);--hero:linear-gradient(135deg,#13264D 0%,#0F2A44 100%);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:14px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}h1{font-size:clamp(1.55rem,5.5vw,2.1rem);letter-spacing:-.01em}h2{font-size:clamp(1.15rem,3.8vw,1.4rem)}h3{font-size:1.02rem}
p{margin:0;text-wrap:pretty}button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:var(--sh);display:grid;gap:12px}
.hero{background:var(--hero);border:1px solid var(--ln);border-radius:24px;padding:22px 18px;display:grid;gap:12px}
.mu{color:var(--mu);font-size:.92rem}.chip{justify-self:start;background:var(--as);color:var(--ac);border:1px solid var(--ln);border-radius:99px;padding:1px 12px;font-size:.88rem;font-weight:600}
.btn{min-height:48px;padding:9px 20px;border-radius:12px;border:2px solid var(--ac);background:var(--ac);color:var(--ax);font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.98)}.btn.sec{background:transparent;color:var(--ac)}.btn.sm{min-height:44px;padding:6px 14px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bar{height:10px;border-radius:99px;background:var(--sb);border:1px solid var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transform-origin:left;transform:scaleX(0);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;display:grid;gap:6px}.tile b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.pick{display:grid;gap:4px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--ln);background:var(--sf);min-height:84px;box-shadow:var(--sh)}.pick:hover{border-color:var(--ac)}.pick b{font-size:1.25rem}
.opts{display:grid;gap:10px}.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--sf);width:100%}
.opt:hover:not(:disabled){background:var(--as)}.opt .k{flex:none;min-width:30px;height:30px;border-radius:8px;background:var(--sb);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt.ok{border-color:var(--ok);background:var(--ob)}.opt.bad{border-color:var(--er);background:var(--eb)}.opt.off{opacity:.4;text-decoration:line-through}
.tag{margin-left:auto;flex:none;font-size:.82rem;font-weight:700}.ok .tag{color:var(--ok)}.bad .tag{color:var(--er)}
.fb{border:2px solid;border-radius:12px;padding:14px;display:grid;gap:8px}.fb.ok{background:var(--ob);border-color:var(--od)}.fb.bad{background:var(--eb);border-color:var(--ed)}.fb.ok>b{color:var(--ok)}.fb.bad>b{color:var(--er)}
.hint{background:var(--wb);border:2px solid var(--ln);border-radius:12px;padding:12px;color:var(--tx)}
details{border:1px solid var(--ln);border-radius:12px;padding:10px 14px;background:var(--sf)}summary{cursor:pointer;font-weight:600;min-height:32px}details ul{margin:8px 0 0;padding-left:20px}details li{margin:6px 0}
textarea{width:100%;min-height:96px;font:inherit;color:var(--tx);background:var(--sf);border:2px solid var(--bd);border-radius:12px;padding:10px}
.stage{animation:in .26s cubic-bezier(.22,1,.36,1)}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.big{font-size:clamp(2.2rem,10vw,3rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:root{--g1:#C9DEFB;--g2:#D5F2FF;--gd:#F59E0B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#12306A;--g2:#0B3350;--gd:#FBBF24}}
:root[data-theme="dark"]{--g1:#12306A;--g2:#0B3350;--gd:#FBBF24}
body{background:radial-gradient(900px 420px at 90% -8%,var(--g1),transparent 62%),radial-gradient(700px 380px at -8% 6%,var(--g2),transparent 62%),var(--bg);background-attachment:fixed}
.hero{position:relative;overflow:hidden;box-shadow:var(--sh)}.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--ac);opacity:.08}
.hg{display:flex;gap:16px;align-items:center}.hg>.grid{gap:8px;min-width:0;flex:1}
.bot{flex:none;width:72px;height:84px}.bot svg{display:block}.bot.happy{animation:hop .5s}.bot.sad{animation:wob .5s}.bot .an{animation:bl 1.6s infinite}
@keyframes hop{40%{transform:translateY(-12px)}}@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}@keyframes bl{50%{opacity:.35}}
.say{position:relative;margin:0;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:8px 14px;font-weight:600;flex:1}
.say::before{content:"";position:absolute;left:-8px;top:20px;width:12px;height:12px;background:var(--sf);border-left:2px solid var(--ln);border-bottom:2px solid var(--ln);transform:rotate(45deg)}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots i{width:14px;height:14px;border-radius:50%;background:var(--sb);border:2px solid var(--bd)}
.dots i.cur{border-color:var(--ac);background:var(--as);transform:scale(1.25)}.dots i.y{background:var(--ok);border-color:var(--ok)}.dots i.n{background:var(--er);border-color:var(--er)}
.path{display:grid}.node{display:grid;grid-template-columns:56px 1fr;gap:14px;position:relative;padding-bottom:16px}
.node:not(:last-child)::before{content:"";position:absolute;left:26px;top:56px;bottom:0;width:4px;border-radius:2px;background:var(--ln)}
.pin{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.2rem;border:3px solid var(--bd);background:var(--sf);z-index:1}
.pin.go{border-color:var(--ac);background:var(--as);color:var(--ac);animation:pul 1.8s infinite}.pin.st{border-color:#D97706;background:var(--gd);color:#3B2300}@keyframes pul{50%{transform:scale(1.08)}}
.nc{display:grid;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;box-shadow:var(--sh);transition:transform .15s}.nc:hover,.pick:hover{transform:translateY(-2px)}
.nc .btn{justify-self:start}.stars{color:var(--gd);letter-spacing:3px;font-size:1.15rem;margin:0}.stars.big{font-size:2.2rem}
.pick{transition:transform .15s}.pick .num{font-size:1.7rem;font-weight:800;color:var(--ac)}
.opt.ok{animation:pop .35s}.opt.bad{animation:shk .3s}@keyframes pop{50%{transform:scale(1.025)}}@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.cf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.9s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(560deg)}}
@media (max-width:420px){.bot{width:56px;height:66px}.bot svg{width:56px;height:66px}}
</style>
</head>
<body>
<main id="app"></main>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script>
(()=>{"use strict";
const D={"1":{"cs":[{"n":"Chủ đề 1: Làm quen với máy tính, các bộ phận và tư thế an toàn","b":["Máy tính giúp em học tập, vẽ tranh, nghe nhạc, xem video bổ ích và liên lạc với người thân.","Máy tính để bàn có 4 bộ phận chính: Màn hình (hiển thị hình ảnh, chữ viết), Thân máy (bộ não xử lý của máy tính), Bàn phím (gõ chữ và số), Chuột máy tính (điều khiển con trỏ chọn đối tượng).","Nội quy phòng Tin học: Đi nhẹ, nói khẽ, ngồi đúng chỗ, không mang đồ ăn thức uống vào phòng máy, bật và tắt máy tính đúng hướng dẫn của thầy cô.","Tư thế ngồi đúng và an toàn: Ngồi thẳng lưng, hai vai thả lỏng, mắt cách màn hình từ 50 cm đến 80 cm, không dùng tay ướt chạm vào ổ điện hay dây điện."]},{"n":"Chủ đề 2: Kỹ năng sử dụng chuột máy tính","b":["Cách cầm chuột đúng: Đặt bàn tay phải lên chuột, ngón trỏ đặt lên nút trái chuột, ngón giữa đặt lên nút phải chuột, các ngón còn lại giữ hai bên thân chuột.","Di chuyển chuột: Giữ và trượt nhẹ chuột trên mặt phẳng để mũi tên (con trỏ chuột) di chuyển trên màn hình.","Nhấp chuột (Click): Nhấn nhanh một lần nút trái chuột rồi thả ngón tay ra để chọn biểu tượng.","Nhấp đúp chuột (Double-click): Nhấn nhanh hai lần liên tiếp nút trái chuột để mở chương trình.","Kéo – thả chuột (Drag and Drop): Nhấn và giữ nút trái chuột vào đối tượng, di chuyển đến vị trí mới rồi thả ngón tay ra."]},{"n":"Chủ đề 3: Bàn phím, gõ từ đơn giản và tạo sản phẩm số đầu tiên","b":["Trên bàn phím có các phím chữ cái (từ A đến Z) và các phím số (từ 0 đến 9) giúp em nhập chữ và số vào máy tính.","Các phím đặc biệt em cần nhớ: Phím Cách (Space – phím dài nhất ở hàng dưới cùng) dùng tạo khoảng trắng giữa hai từ; phím Enter dùng xuống dòng; phím Backspace dùng xóa ký tự ngay bên trái con trỏ; phím Shift giữ kèm phím chữ để gõ chữ in hoa.","Khi tạo sản phẩm số đầu tiên (như bức tranh vẽ hoặc dòng chữ tên em), em cần nhấn nút Lưu (Save) để cất giữ bài làm vào máy tính."]},{"n":"Chủ đề 4: Thông tin quanh em, máy tính làm việc theo lệnh và chia nhỏ công việc","b":["Thông tin quanh em có 3 dạng quen thuộc: Dạng chữ (tên bài học, biển báo chữ), dạng hình ảnh (bức tranh, đèn giao thông, biển báo hình vẽ) và dạng âm thanh (tiếng trống trường, tiếng còi xe, tiếng chim hót).","Máy tính không tự suy nghĩ như con người mà làm việc chính xác theo từng lệnh do con người đưa vào (như nhấp chuột mở bài vẽ, nhấn phím gõ chữ).","Một công việc lớn thường gồm nhiều bước nhỏ thực hiện theo đúng thứ tự từ bước đầu đến bước cuối (ví dụ: Đánh răng, rửa tay, chuẩn bị cặp sách đi học)."]},{"n":"Chủ đề 5: Chỉ đường trong mê cung, sửa lỗi và làm quen lập trình trực quan","b":["Để chỉ đường cho nhân vật hoặc Robot đi đến đích, em ghép các lệnh di chuyển (Lên trên 1 ô, Xuống dưới 1 ô, Sang trái 1 ô, Sang phải 1 ô) theo đúng thứ tự từng bước.","Khi đi trong mê cung, nhân vật chỉ được đi vào các ô trống và phải tránh các ô có chướng ngại vật (như Đá cản, bức tường).","Sửa lỗi đường đi (gỡ lỗi): Nếu nhân vật đi sai hướng hoặc chạm vật cản, em bình tĩnh tìm đúng bước lệnh bị sai và thay bằng lệnh đúng.","Lập trình trực quan: Em dùng chuột kéo – thả và ghép các khối lệnh màu sắc lại với nhau thành một chuỗi lệnh hoàn chỉnh để điều khiển nhân vật."]}],"q":[{"i":1,"b":"Bài 1","c":0,"l":1,"s":"Thiết bị nào sau đây giúp em học vẽ tranh, gõ chữ và xem bài giảng điện tử?","o":["Cái chổi quét nhà","Chiếc cặp sách vải","Máy tính","Hộp bút chì gỗ"],"a":2,"k":0},{"i":2,"b":"Bài 1","c":0,"l":1,"s":"Khi bước vào phòng Tin học, em cần thực hiện điều gì đầu tiên?","o":["Chạy thật nhanh giành chiếc máy tính ở đầu bàn","Bật tất cả công tắc điện có trong phòng học","Đi nhẹ, nói khẽ và ngồi đúng vị trí được phân công","Đặt chai nước lọc mở nắp lên trên bàn phím"],"a":2,"k":2},{"i":3,"b":"Bài 1","c":0,"l":1,"s":"Đồ vật nào sau đây em KHÔNG được mang vào bàn máy tính trong phòng Tin học?","o":["Đồ ăn vặt và ly nước ngọt","Chiếc bút chì và cục tẩy","Thẻ học sinh của trường","Quyển vở ghi bài môn Tin học"],"a":0,"k":2},{"i":4,"b":"Bài 1","c":0,"l":1,"s":"Muốn tắt máy tính đúng cách khi hết giờ năm lần liên tiếp vào cái giỏ","Nhấn phím Backspace trên bàn phím để đẩy quả táo vào giỏ"],"a":0,"k":4},{"i":45,"b":"Bài 7","c":2,"l":2,"s":"Bạn Hà định gõ từ “HOA” nhưng lại gõ nhầm thành “HOÁ” có dư chữ K ở cuối thành “HOAK”. Con trỏ đang ở ngay sau chữ K, Hà nhấn phím nào một lần để xóa chữ K?","o":["Phím Backspace","Phím Enter","Phím Shift","Phím Space"],"a":0,"k":1},{"i":46,"b":"Bài 8","c":2,"l":2,"s":"Khi gõ cụm từ “LOP 1A1” không dấu, bạn Bình quên nhấn phím Space nên màn hình hiện ra kết quả nào?","o":["LOP 1A1","lop 1a1","LOP1A1","1A1 LOP"],"a":2,"k":1},{"i":47,"b":"Bài 9","c":2,"l":2,"s":"Nếu em vẽ xong bức tranh ngôi nhà rất đẹp nhưng tắt phần mềm ngay mà KHÔNG nhấn Lưu (Save), chuyện gì sẽ xảy ra?","o":["Bức tranh tự động gửi sang máy tính của bạn bên cạnh","Màn hình nền tự động đổi thành bức tranh ngôi nhà","Máy tính vẫn tự động in bức tranh ra giấy trắng","Bức tranh vừa vẽ sẽ bị mất và không mở lại được nữa"],"a":3,"k":2},{"i":48,"b":"Bài 10","c":2,"l":2,"s":"Để gõ tên mình bên dưới bức tranh vừa vẽ trong phần mềm học tập, em cần kết hợp hai thiết bị nào?","o":["Chỉ nhấn nút bật nguồn trên thân máy tính hai lần","Dùng chuột chọn công cụ viết chữ rồi dùng bàn phím gõ tên","Dùng cục tẩy chì chà nhẹ lên mặt bàn phím máy tính","Chỉ dùng loa máy tính và dây nguồn của màn hình"],"a":1,"k":1},{"i":49,"b":"Bài 12","c":3,"l":2,"s":"Khi xem một đoạn phim hoạt hình có nhân vật ca hát và có dòng phụ đề tên bài hát ở dưới, em nhận được những dạng thông tin nào?","o":["Chỉ có duy nhất thông tin dạng chữ viết","Cả dạng chữ, dạng hình ảnh và dạng âm thanh","Không có bất kỳ dạng thông tin nào","Chỉ có duy nhất thông tin dạng âm thanh"],"a":1,"k":0},{"i":50,"b":"Bài 12","c":3,"l":2,"s":"Đèn tín hiệu giao thông ở ngã tư chuyển sang màu đỏ báo hiệu các xe dừng lại. Tín hiệu màu đỏ đó thuộc dạng thông tin nào?","o":["Dạng hình ảnh","Dạng âm thanh","Dạng chữ viết dài","Dạng tiếng trống"],"a":0,"k":0},{"i":51,"b":"Bài 13","c":3,"l":2,"s":"Vì sao khi em gõ phím chữ “M” mà trên màn hình lại hiện ra chữ “N”?","o":["Vì máy tính hôm nay bị mệt nên tự ý đổi chữ cái của em","Vì ngón tay em đã nhấn nhầm vào phím chữ N nên máy làm đúng theo lệnh phím N","Vì chuột máy tính đặt quá gần bàn phím của em","Vì màn hình máy tính không biết hiển thị chữ cái M"],"a":1,"k":1},{"i":52,"b":"Bài 14","c":3,"l":2,"s":"Khi mặc giày đi học, nếu em xỏ giày buộc dây xong xuôi rồi mới nhớ chưa đi tất (vớ), điều đó cho thấy điều gì?","o":["Đi tất bên ngoài chiếc giày sẽ giúp chạy nhanh hơn","Không cần chia việc đi giày thành các bước nhỏ","Làm bước nào trước cũng cho kết quả giống hệt nhau","Thứ tự thực hiện các bước bị ngược nên phải tháo giày làm lại"],"a":3,"k":2},{"i":53,"b":"Bài 15","c":4,"l":2,"s":"Chú ong đang ở một ô vuông. Sau khi thực hiện chuỗi lệnh: “Sang phải 1 ô -> Sang phải 1 ô -> Đi lên 1 ô”, chú ong đã đi tổng cộng mấy ô?","o":["5 ô","1 ô","3 ô","2 ô"],"a":2,"k":0},{"i":55,"b":"Bài 17","c":4,"l":2,"s":"Đích đến nằm ngay bên phải chú thỏ 2 ô trống, nhưng chuỗi lệnh đang là: “Sang phải 1 ô -> Sang trái 1 ô”. Em sửa lệnh thứ hai thành gì để thỏ tới đích?","o":["Xóa cả hai lệnh để chú thỏ đứng yên tại chỗ","Đổi lệnh “Sang trái 1 ô” thành lệnh “Đi lên 1 ô”","Đổi lệnh “Sang trái 1 ô” thành lệnh “Sang phải 1 ô”","Đổi lệnh “Sang trái 1 ô” thành lệnh “Đi xuống 1 ô”"],"a":2,"k":0},{"i":56,"b":"Bài 19","c":4,"l":2,"s":"Trước khi nhấn nút chạy toàn bộ chuỗi lệnh dài để đưa Robot vượt mê cung, em nên làm gì để hạn chế sai sót?","o":["Dùng ngón tay dò thử từng bước trên lưới ô vuông xem có vướng vật cản không","Chỉ ghép toàn bộ các khối lệnh đi sang trái liên tiếp","Nhắm mắt lại và ghép thật nhiều khối lệnh bất kỳ vào chương trình","Xóa hết khối lệnh bắt đầu để chương trình ngắn gọn hơn"],"a":0,"k":0}],"e":[{"i":57,"b":"Bài 2","c":0,"l":2,"s":"Em hãy kể tên 4 bộ phận chính của một bộ máy tính để bàn và cho biết bộ phận nào dùng để hiển thị hình ảnh cho em xem.","a":"4 bộ phận chính của máy tính để bàn gồm: Màn hình, Thân máy, Bàn phím và Chuột máy tính. Trong đó, Màn hình là bộ phận dùng để hiển thị hình ảnh và chữ viết cho em quan sát."},{"i":58,"b":"Bài 3","c":0,"l":2,"s":"Em hãy nêu 2 quy tắc về tư thế ngồi đúng và giữ an toàn khi học tập với máy tính.","a":"(1) Ngồi thẳng lưng, hai vai thả lỏng, mắt cách màn hình khoảng 50 cm đến 80 cm. (2) Không dùng tay ướt chạm vào thiết bị điện, không tự ý rút dây nguồn và không mang đồ ăn, nước uống vào bàn máy tính."},{"i":59,"b":"Bài 4","c":1,"l":2,"s":"Em hãy phân biệt sự khác nhau giữa thao tác “Nhấp chuột” và thao tác “Nhấp đúp chuột”.","a":"- Nhấp chuột (Click): Nhấn nhanh một lần nút trái chuột rồi thả tay ra (thường dùng để chọn một biểu tượng hoặc nút lệnh). - Nhấp đúp chuột (Double-click): Nhấn nhanh hai lần liên tiếp nút trái chuột rồi thả tay ra (thường dùng để mở một chương trình ngoài màn hình nền)."},{"i":60,"b":"Bài 5","c":1,"l":2,"s":"Em hãy mô tả các bước thực hiện thao tác “Kéo – thả chuột” để di chuyển một bức ảnh nhỏ trên màn hình sang vị trí mới.","a":"Gồm 3 bước: Bước 1: Di chuyển con trỏ chuột đặt lên bức ảnh cần chuyển. Bước 2: Nhấn và giữ nguyên nút trái chuột, từ từ kéo bức ảnh đến vị trí mới. Bước 3: Thả ngón tay khỏi nút trái chuột để đặt bức ảnh xuống."},{"i":61,"b":"Bài 7","c":2,"l":2,"s":"Khi gõ chữ trên máy tính, phím Enter và phím Backspace giúp ích gì cho em?","a":"- Phím Enter giúp em đưa con trỏ soạn thảo xuống dòng mới (hoặc đồng ý thực hiện một lệnh). - Phím Backspace giúp em xóa bỏ chữ cái hoặc con số bị gõ sai nằm ngay bên trái con trỏ soạn thảo."},{"i":62,"b":"Bài 12","c":3,"l":2,"s":"Em hãy lấy mỗi loại 1 ví dụ gần gũi ở trường học cho: thông tin dạng chữ, thông tin dạng hình ảnh và thông tin dạng âm thanh.","a":"- Thông tin dạng chữ: Dòng chữ bảng tên lớp “Lớp 1A1” (hoặc nội quy lớp học). - Thông tin dạng hình ảnh: Biển báo bỏ rác vào thùng có hình vẽ minh họa (hoặc tranh treo tường). - Thông tin dạng âm thanh: Tiếng trống trường báo giờ ra chơi (hoặc giọng cô giáo giảng bài)."},{"i":63,"b":"Bài 13","c":3,"l":2,"s":"Em hiểu thế nào về câu nói: “Máy tính làm việc theo lệnh của con người”? Hãy nêu 1 ví dụ minh họa.","a":"Câu nói đó có nghĩa là máy tính không tự ý làm việc mà chỉ thực hiện đúng những thao tác do con người ra lệnh. Ví dụ: Khi em nhấp chuột chọn nút Lưu (Save), máy tính nhận lệnh và lưu bức tranh của em lại."},{"i":64,"b":"Bài 18","c":4,"l":2,"s":"Trong bài học Làm quen lập trình trực quan, việc ghép các khối lệnh giống với trò chơi quen thuộc nào của em và giúp nhân vật làm được gì?","a":"Việc ghép các khối lệnh giống như trò chơi xếp hình Lego lắp các mảnh ghép khớp vào nhau. Khi ghép đúng thứ tự thành chuỗi lệnh, nhân vật trên màn hình sẽ di chuyển hoặc thực hiện nhiệm vụ theo đúng ý muốn của em."},{"i":65,"b":"Bài 1","c":0,"l":3,"s":"Giờ thực hành Tin học, bạn ngồi cạnh định lấy hộp sữa tươi đặt ngay lên bàn phím máy tính để vừa uống vừa gõ chữ. Em sẽ khuyên bạn như thế nào?","a":"Em sẽ nhẹ nhàng khuyên bạn cất hộp sữa vào cặp hoặc để khu vực quy định bên ngoài bàn máy, vì nếu sữa đổ vào bàn phím hay thân máy sẽ làm hỏng thiết bị và có thể gây chập điện rất nguy hiểm."},{"i":66,"b":"Bài 8","c":2,"l":3,"s":"Em muốn gõ dòng chữ không dấu “EM HOC LOP 1” mà chữ cái đầu tiên viết hoa hoặc cả dòng viết hoa bằng phím Shift. Em hãy nêu cách gõ khoảng cách giữa các từ và cách gõ số 1.","a":"- Để viết hoa chữ cái, em nhấn giữ phím Shift đồng thời gõ phím chữ cái tương ứng. - Giữa các từ EM, HOC, LOP, 1 em nhấn phím Cách (Space) đúng 1 lần để tạo khoảng trắng. - Cuối câu em nhấn phím số 1 ở hàng phím số trên bàn phím."},{"i":67,"b":"Bài 9","c":2,"l":3,"s":"Em hãy nêu trình tự 3 bước cơ bản để tạo và cất giữ sản phẩm tranh vẽ đầu tiên của em trên máy tính.","a":"Bước 1: Nhấp đúp chuột vào biểu tượng phần mềm vẽ để mở công cụ. Bước 2: Dùng chuột chọn nét bút, hình mẫu và màu sắc để vẽ bức tranh theo ý tưởng (có thể gõ thêm tên em). Bước 3: Nhấp chuột vào nút Lưu (Save) để lưu sản phẩm vào máy tính."},{"i":68,"b":"Bài 14","c":3,"l":3,"s":"Em hãy chia công việc “Rửa tay sạch bằng xà phòng” thành 4 bước nhỏ theo đúng thứ tự từ đầu đến cuối.","a":"Bước 1: Làm ướt hai bàn tay dưới vòi nước sạch. Bước 2: Lấy xà phòng vào lòng bàn tay và xoa đều các mặt tay, kẽ ngón tay. Bước 3: Rửa sạch hết bọt xà phòng dưới vòi nước và khóa vòi nước lại. Bước 4: Lau khô hai bàn tay bằng khăn sạch."},{"i":69,"b":"Bài 14","c":3,"l":3,"s":"Các bước chuẩn bị cặp sách buổi tối trước khi đi học bị viết lộn xộn: (A) Đóng nắp cặp sách gọn gàng; (B) Xem thời khóa biểu ngày mai; (C) Xếp đủ sách vở và hộp bút vào cặp. Em hãy sắp xếp lại theo thứ tự đúng.","a":"Thứ tự đúng để không bị quên sách vở là: Bước (B) Xem thời khóa biểu ngày mai -> Bước (C) Xếp đủ sách vở và hộp bút vào cặp -> Bước (A) Đóng nắp cặp sách gọn gàng."},{"i":70,"b":"Bài 15","c":4,"l":3,"s":"Trên lưới ô vuông không có vật cản, chú Rùa đang ở ô xuất phát. Ô lá rau nằm cách chú Rùa 2 ô về phía bên phải và 1 ô về phía dưới. Em hãy viết chuỗi lệnh đưa chú Rùa đến ô lá rau.","a":"Chuỗi lệnh đúng gồm 3 bước: Bước 1: Sang phải 1 ô -> Bước 2: Sang phải 1 ô -> Bước 3: Đi xuống 1 ô (Hoặc học sinh có thể viết: Đi xuống 1 ô -> Sang phải 1 ô -> Sang phải 1 ô cũng hoàn toàn chính xác)."},{"i":71,"b":"Bài 16","c":4,"l":3,"s":"Chú Thỏ cần đi đến củ cà rốt ở cách 2 ô bên phải, nhưng ô ngay bên phải chú Thỏ có một tảng đá chặn đường (các ô hàng dưới đều trống). Em hãy viết chuỗi lệnh giúp chú Thỏ đi vòng qua tảng đá để lấy cà rốt.","a":"Chuỗi lệnh đi vòng qua tảng đá gồm 4 bước: Bước 1: Đi xuống 1 ô -> Bước 2: Sang phải 1 ô -> Bước 3: Sang phải 1 ô -> Bước 4: Đi lên 1 ô."},{"i":72,"b":"Bài 10","c":2,"l":3,"s":"Khi gõ tên lớp, bạn Nam gõ nhầm thành “1A12” (bị thừa số 2 ở cuối). Sau đó bạn muốn xuống dòng để gõ tên mình là “NAM”. Em hãy chỉ giúp bạn các phím cần bấm theo thứ tự.","a":"Thứ tự các phím bạn Nam cần bấm là: (1) Bấm phím Backspace 1 lần để xóa số 2 bị thừa; (2) Bấm phím Enter 1 lần để xuống dòng mới; (3) Giữ phím Shift và lần lượt gõ các phím chữ N, A, M."},{"i":73,"b":"Bài 17","c":4,"l":4,"s":"Trên hàng ngang gồm 4 ô liên tiếp (Ô 1 -> Ô 2 -> Ô 3 -> Ô 4), Robot ở Ô 1 và Ngôi sao ở Ô 4. Bạn Khoa ghép chuỗi lệnh: “Sang phải 1 ô -> Sang phải 1 ô -> Đi xuống 1 ô”. Em hãy chỉ ra bước lệnh bị sai và sửa lại chuỗi lệnh cho đúng.","a":"- Bước lệnh bị sai là lệnh thứ 3 (“Đi xuống 1 ô”) làm Robot chệch khỏi hàng ngang ở Ô 3 thay vì tiến vào Ô 4. - Chuỗi lệnh sửa lại đúng là: Sang phải 1 ô -> Sang phải 1 ô -> Sang phải 1 ô."},{"i":74,"b":"Bài 16","c":4,"l":4,"s":"Từ ô Xuất phát đến ô Kho báu có hai con đường hợp lệ không vướng vật cản: Đường thứ nhất dài 4 bước lệnh, Đường thứ hai dài 8 bước lệnh đi vòng quanh. Nếu là người lập trình cho Robot, em chọn đường nào? Vì sao?","a":"Em chọn Đường thứ nhất (dài 4 bước lệnh). Vì cả hai đường đều an toàn tới đích nhưng đường 4 bước ngắn gọn hơn, giúp Robot đi nhanh hơn, tiết kiệm năng lượng và ít bị nhầm lẫn khi ghép khối lệnh."},{"i":75,"b":"Bài 19","c":4,"l":4,"s":"Robot đi từ ô A theo chuỗi 4 lệnh: “Đi lên 1 ô -> Sang phải 1 ô -> Đi xuống 1 ô -> Sang trái 1 ô”. Hỏi sau khi thực hiện hết 4 lệnh đó, Robot đang đứng ở đâu? Giải thích ngắn gọn.","a":"Sau khi thực hiện hết 4 lệnh, Robot quay trở về đứng đúng tại ô A ban đầu. Giải thích: Robot đi lên 1 ô rồi lại xuống 1 ô, sang phải 1 ô rồi lại sang trái 1 ô (đi thành 1 vòng hình vuông nhỏ khép kín)."},{"i":76,"b":"Bài 15","c":4,"l":4,"s":"Robot đã đi từ Nhà đến Trường theo chuỗi 3 lệnh: “Sang phải 1 ô -> Sang phải 1 ô -> Đi lên 1 ô”. Tan học, muốn Robot đi từ Trường quay ngược về Nhà theo đúng con đường cũ, em cần viết chuỗi 3 lệnh nào?","a":"Để đi ngược lại đúng con đường cũ từ Trường về Nhà, em đảo ngược thứ tự và hướng đi thành chuỗi 3 lệnh: Đi xuống 1 ô -> Sang trái 1 ô -> Sang trái 1 ô."},{"i":77,"b":"Bài 12","c":3,"l":4,"s":"Cô giáo muốn làm một tấm bảng nhắc nhở các bạn nhỏ lớp 1 (có cả những bạn mới học đánh vần chậm) biết “Bỏ rác đúng nơi quy định” ngay tại sân trường. Theo em, nên dùng dạng thông tin nào trên tấm bảng để bạn nào nhìn vào cũng hiểu ngay?","a":"Nên kết hợp cả thông tin dạng hình ảnh (hình vẽ bạn nhỏ bỏ rác vào thùng rõ ràng, màu sắc tươi sáng) kèm dòng chữ ngắn gọn. Vì hình ảnh trực quan giúp các bạn đọc chữ còn chậm vẫn hiểu ngay việc cần làm chỉ qua một ánh nhìn."},{"i":78,"b":"Bài 18","c":4,"l":4,"s":"Trong phần mềm lập trình trực quan, bạn Mai kéo đủ 4 khối lệnh di chuyển ra màn hình nhưng để 4 khối lệnh nằm rời rạc xa nhau, không ghép dính dưới khối lệnh “Khi bấm Lá cờ xanh”. Khi bấm Lá cờ xanh chuyện gì xảy ra và Mai cần sửa thế nào?","a":"- Khi bấm Lá cờ xanh, nhân vật sẽ đứng yên không thực hiện 4 lệnh di chuyển vì các khối lệnh bị rời khỏi khối bắt đầu. - Cách sửa: Mai dùng thao tác kéo – thả chuột ghép lần lượt 4 khối lệnh dính khít nối tiếp ngay bên dưới khối “Khi bấm Lá cờ xanh”."},{"i":79,"b":"Bài 17","c":4,"l":4,"s":"Trên lưới 3x3 (hàng 1 trên cùng, hàng 3 dưới cùng; cột 1 bên trái, cột 3 bên phải), Robot ở góc trên trái (hàng 1, cột 1), Đích ở góc dưới phải (hàng 3, cột 3). Ô chính giữa lưới (hàng 2, cột 2) có ĐÁ CẢN. Em hãy viết 2 chuỗi lệnh KHÁC NHAU (mỗi chuỗi 4 bước) đều đưa Robot tới Đích an toàn.","a":"- Cách 1 (đi men theo cạnh trên rồi xuống cạnh phải): Sang phải 1 ô -> Sang phải 1 ô -> Đi xuống 1 ô -> Đi xuống 1 ô. - Cách 2 (đi men theo cạnh trái rồi sang cạnh dưới): Đi xuống 1 ô -> Đi xuống 1 ô -> Sang phải 1 ô -> Sang phải 1 ô."},{"i":80,"b":"Bài 19","c":4,"l":4,"s":"Em hãy tự thiết kế một trò chơi nhỏ “Robot tưới cây” dài 3 bước lệnh trên sân trường: nêu rõ vị trí xuất phát của Robot, vị trí bồn hoa, 1 vật cản cần tránh và viết chuỗi 3 lệnh hoàn chỉnh.","a":"Ví dụ thiết kế hợp lệ: Robot xuất phát ở Cổng lớp (ô 1,1); ghế đá cản đường ở ngay bên phải (ô 1,2); bồn hoa cần tưới nằm ở ô (2,3). Chuỗi 3 lệnh điều khiển Robot: Bước 1: Đi xuống 1 ô (tới ô 2,1) -> Bước 2: Sang phải 1 ô (tới ô 2,2) -> Bước 3: Sang phải 1 ô (tới bồn hoa ở ô 2,3 để tưới cây)."}]},"2":{"cs":[{"n":"Chủ đề 1: Kỹ năng chuột, bàn phím gõ câu ngắn và chuyển đổi ứng dụng","b":["Nhà sáng tạo số lớp 2 tuân thủ nội quy phòng máy, ngồi đúng tư thế và sử dụng máy tính văn minh, an toàn.","Nâng cấp kỹ năng chuột: Thực hiện chính xác các thao tác chọn (Click), mở nhanh (Double-click), mở bảng chọn tắt (nhấp nút phải chuột) và kéo – thả đối tượng đúng vị trí.","Bàn phím và gõ câu ngắn: Phối hợp phím chữ, phím số với phím Cách (Space), phím Xuống dòng (Enter), phím Xóa (Backspace), phím Chữ hoa (Shift/Caps Lock) để gõ câu ngắn rõ ràng.","Quản lý cửa sổ ứng dụng: Biết mở ứng dụng học tập, thu nhỏ cửa sổ (nút dấu trừ -), phóng to, chuyển đổi qua lại giữa các ứng dụng trên thanh tác vụ (Taskbar) và đóng ứng dụng (nút dấu X) sau khi lưu bài."]},{"n":"Chủ đề 2: Tệp, thư mục và tổ chức lưu trữ sản phẩm số","b":["Tệp (File) là sản phẩm số được tạo ra và lưu trên máy tính, ví dụ: tệp tranh vẽ (.png, .jpg), tệp bài soạn thảo văn bản (.docx), tệp âm thanh, tệp chương trình.","Thư mục (Folder) giống như ngăn cặp sách hoặc ngăn tủ trên máy tính, dùng để chứa các tệp và các thư mục con giúp sắp xếp gọn gàng, dễ tìm kiếm.","Quy tắc đặt tên và lưu sản phẩm: Đặt tên tệp, tên thư mục ngắn gọn, rõ nghĩa, gợi nhớ đúng nội dung bài làm (ví dụ: Ngoi_truong_em, Tho_tang_me) và chọn đúng thư mục trước khi nhấn Save.","Khi cất sản phẩm đúng thư mục theo chủ đề (như thư mục TRANH_VE, thư mục BAI_SOAN), em có thể tìm và mở lại bài làm rất nhanh chóng."]},{"n":"Chủ đề 3: Thông tin, dữ liệu và quá trình thu nhận – xử lý thông tin","b":["Thông tin là những điều em biết, hiểu được về thế giới xung quanh; khi thông tin được ghi lại bằng chữ viết, con số, hình vẽ, âm thanh trong máy tính thì gọi là dữ liệu.","Các dạng thông tin quen thuộc: Dạng chữ, dạng hình ảnh, dạng âm thanh và dạng video (kết hợp cả hình ảnh chuyển động, âm thanh và chữ).","Quá trình xử lý thông tin gồm 3 bước liên tiếp: Đầu vào (tiếp nhận thông tin) -> Xử lý (suy nghĩ, tính toán hoặc máy tính xử lý) -> Kết quả / Đầu ra (hành động, câu trả lời hoặc hiển thị ra màn hình, loa)."]},{"n":"Chủ đề 4: Chia nhiệm vụ thành nhiều bước và thuật toán bằng lời, bằng hình","b":["Phân rã nhiệm vụ: Chia một công việc lớn thành các bước nhỏ, đơn giản, rõ ràng để dễ thực hiện và không bỏ sót việc.","Thuật toán là một dãy các bước hướng dẫn rõ ràng, sắp xếp theo đúng trình tự từ đầu đến cuối để giải quyết một nhiệm vụ cụ thể.","Em có thể mô tả thuật toán bằng lời (liệt kê Bước 1, Bước 2, Bước 3...) hoặc bằng sơ đồ hình vẽ nối tiếp nhau bằng các mũi tên chỉ hướng."]},{"n":"Chủ đề 5: Lập trình trực quan với chuỗi lệnh, lặp lại hành động và chạy thử sửa lỗi","b":["Trong lập trình trực quan, các khối lệnh ghép nối tiếp nhau tạo thành chuỗi lệnh; máy tính thực hiện lần lượt từng lệnh từ trên xuống dưới.","Lặp lại một hành động: Khi một lệnh hoặc nhóm lệnh giống hệt nhau được thực hiện nhiều lần liên tiếp, ta dùng khối lệnh “Lặp lại ... lần” để chương trình ngắn gọn, dễ đọc.","Chạy thử và sửa lỗi (Debugging): Luôn chạy thử chương trình để kiểm tra kết quả; nếu nhân vật làm chưa đúng yêu cầu, ta dò từng bước để phát hiện lệnh sai (sai hướng, sai số bước, thiếu lệnh) và sửa lại."]}],"q":[{"i":1,"b":"Bài 1","c":0,"l":1,"s":"Thói quen nào sau đây thể hiện em là một “Nhà sáng tạo số” văn minh trong phòng Tin học?","o":["Tự ý xóa các bài vẽ lưu sẵn của bạn lớp khác","Vẽ bậy bằng bút mực lên màn hình và bàn phím máy tính","Giữ gìn máy tính sạch sẽ, làm bài nghiêm túc và tắt máy đúng cách","Đập mạnh chuột máy tính xuống bàn khi chờ máy mở"],"a":2,"k":0},{"i":2,"b":"Bài 1","c":0,"l":1,"s":"Khi ngồi làm việc với máy tính, hai bàn chân của em nên đặt như thế nào cho đúng tư thế?","o":["Gác chân lên cạnh bàn phím máy tính","Đặt ngay ngắn trên sàn nhà hoặc giá để chân","Đung đưa đá mạnh vào dây điện dưới gầm bàn","Co cả hai chân lên mặt ghế xoay"],"a":1,"k":0},{"i":3,"b":"Bài 2","c":0,"l":1,"s":"Thao tác nhấp nút phải chuột một lần vào đối tượng trên màn hình thường dùng để làm gì?","o":["Tăng độ sáng của bóng đèn trong lớp học","Mở bảng chọn tắt chứa các lệnh thao tác nhanh","Gõ chữ cái in hoa vào trang văn bản","Tắt ngay lập tức nguồn điện của cả phòng máy"],"a":1,"k":1},{"i":4,"b":"Bài 2","c":0,"l":1,"s":"Để mở nhanh một thư mục đang nằm trên màn hình nền (Desktop), em dùng thao tác chuột nào?","o":["Lăn con lăn giữa của chuột lên xuống liên tục","Nhấp đúp nút trái chuột vào biểu tượng thư mục đó","Trượt chuột đi vòng quanh màn hình nền ba vòng","Nhấn giữ nút phải chuột và kéo ra góc màn hình"],"a":1,"k":1},{"i":5,"b":"Bài 2","c":0,"l":1,"s":"Con lăn nhỏ nằm ở giữa nút trái và nút phải của chuột máy tính giúp em làm gì?","o":["Đổi màu sắc của vỏ màn hình máy tính","Cuộn trang văn bản hoặc trang hình ảnh lên và xuống","Bật loa phát nhạc tự động của trường học","Xóa sạch toàn bộ các tệp có trong ổ đĩa"],"a":1,"k":0},{"i":6,"b":"Bài 3","c":0,"l":1,"s":"Khi gõ câu ngắn “Em yêu trường UNIGO.”, sau từ cuối cùng em nhấn phím dấu nào để kết thúc câu?","o":["Phím dấu cộng (+)","Phím mũi tên trái","Phím dấu chấm (.)","Phím dấu bằng (=)"],"a":2,"k":2},{"i":7,"b":"Bài 3","c":0,"l":1,"s":"Phím nào trên bàn phím khi bật sáng đèn sẽ giúp em gõ liên tiếp nhiều chữ cái IN HOA mà không cần giữ phím Shift?","o":["Phím Enter","Phím Space","Phím Backspace","Phím Caps Lock"],"a":3,"k":2},{"i":8,"b":"Bài 3","c":0,"l":1,"s":"Khi gõ một câu văn ngắn, giữa hai từ liên tiếp nhau em cần gõ mấy dấu cách (Space)?","o":["10 dấu cách liên tiếp","5 dấu cách liên tiếp","Không gõ dấu cách nào","Đúng 1 dấu cách"],"a":3,"k":2},{"i":9,"b":"Bài 4","c":0,"l":1,"s":"Ở góc trên bên phải cửa sổ ứng dụng, nút có hình dấu trừ (-) dùng để làm gì?","o":["Đổi tên tệp bài làm thành tên khác","Thu nhỏ cửa sổ ứng dụng xuống thanh tác vụ bên dưới","In bài làm của em ra máy in màu","Xóa vĩnh viễn phần mềm đó khỏi máy tính"],"a":1,"k":3},{"i":10,"b":"Bài 4","c":0,"l":1,"s":"Thanh nằm ngang ở cạnh dưới cùng của màn hình Windows, nơi hiển thị các ứng dụng đang mở gọi là gì?","o":["Khung viền nhựa màn hình","Dây kết nối mạng","Thanh dấu cách bàn phím","Thanh tác vụ (Taskbar)"],"a":3,"k":3},{"i":11,"b":"Bài 5","c":1,"l":1,"s":"Sản phẩm số nào sau đây KHÔNG phải là một tệp lưu trong máy tính?","o":[" tấm thiệp chúc mừng trên máy tính” gồm: (1) Lưu tệp thiệp vào thư mục; (2) Mở phần mềm vẽ và vẽ khung hoa; (3) Gõ lời chúc tốt đẹp lên thiệp. Thứ tự hợp lý nhất là gì?","o":["(3) -> (1) -> (2)","(1) -> (2) -> (3)","(1) -> (3) -> (2)","(2) -> (3) -> (1)"],"a":3,"k":1},{"i":51,"b":"Bài 16","c":3,"l":2,"s":"Thuật toán điều khiển Robot lấy sách gồm: “Bước 1: Tiến thẳng 3 ô -> Bước 2: Rẽ phải -> Bước 3: Tiến thẳng 1 ô -> Bước 4: Nhặt quyển sách”. Nếu bỏ quên Bước 2 thì chuyện gì xảy ra?","o":["Quyển sách tự động di chuyển đến chỗ Robot","Robot tự động lùi về ô xuất phát ban đầu","Robot đi thẳng tổng cộng 4 ô lệch khỏi vị trí quyển sách","Robot vẫn nhặt trúng quyển sách nhanh hơn ban đầu"],"a":2,"k":1},{"i":52,"b":"Bài 17","c":4,"l":2,"s":"Chú Cún thực hiện chuỗi lệnh: “Đi tới 2 ô -> Nói 'Gâu gâu!' -> Đi tới 3 ô”. Hỏi chú Cún nói 'Gâu gâu!' vào thời điểm nào?","o":["Nói liên tục ở từng ô vuông trên suốt đường đi","Chỉ sau khi đã đi hết cả 5 ô đường thẳng","Sau khi đi được 2 ô đầu tiên và trước khi đi tiếp 3 ô sau","Ngay trước khi bắt đầu bước đi ô đầu tiên"],"a":2,"k":0},{"i":54,"b":"Bài 18","c":4,"l":2,"s":"Chuỗi hành động của Robot là: “Vỗ tay -> Nhảy cao -> Vỗ tay -> Nhảy cao -> Vỗ tay -> Nhảy cao”. Ta viết gọn chuỗi này bằng khối lệnh lặp như thế nào?","o":["Lặp lại 3 lần [ Đứng yên -> Ngồi xuống ]","Lặp lại 6 lần [ Vỗ tay -> Nhảy cao ]","Lặp lại 3 lần [ Vỗ tay -> Nhảy cao ]","Lặp lại 2 lần [ Vỗ tay -> Vỗ tay ]"],"a":2,"k":1},{"i":55,"b":"Bài 19","c":4,"l":2,"s":"Kho báu cách Robot 4 ô về phía trước, nhưng chương trình đang viết: “Lặp lại 3 lần [ Tiến thẳng 1 ô ]”. Lỗi của chương trình này là gì và sửa thế nào?","o":["Thừa 2 bước tiến; sửa số lần lặp từ 3 lần thành 1 lần","Không có lỗi nào vì Robot tự nhảy thêm 1 ô cuối","Sai hướng đi; đổi lệnh Tiến thẳng thành lệnh Đi lùi","Thiếu 1 bước tiến; sửa số lần lặp từ 3 lần thành 4 lần"],"a":3,"k":2},{"i":56,"b":"Bài 19","c":4,"l":2,"s":"Bạn Châu lập trình cho nhân vật Cá Vàng bơi sang phải 5 bước rồi kêu “Ủn ỉn” như chú lợn con. Đây là lỗi ở khối lệnh nào?","o":["Lỗi chọn nhầm tệp âm thanh phát ra không phù hợp với nhân vật Cá Vàng","Lỗi dùng sai số bước di chuyển sang bên phải","Lỗi đặt tên thư mục lưu bài quá ngắn gọn","Lỗi chưa bật màn hình máy tính trước khi chạy bài"],"a":0,"k":2}],"e":[{"i":57,"b":"Bài 4","c":0,"l":2,"s":"Em hãy nêu sự khác nhau về kết quả khi nhấp chuột vào nút dấu trừ (-) và nút dấu nhân (X) ở góc trên bên phải cửa sổ ứng dụng.","a":"- Nhấp nút dấu trừ (-): Cửa sổ ứng dụng chỉ tạm thu nhỏ xuống thanh tác vụ (Taskbar), bài làm vẫn đang mở và nhấp lại là hiện lên. - Nhấp nút dấu nhân (X): Đóng hẳn cửa sổ và thoát khỏi ứng dụng đó (nên cần lưu bài trước khi đóng)."},{"i":58,"b":"Bài 5","c":1,"l":2,"s":"Tệp (File) trên máy tính là gì? Em hãy kể tên 2 loại tệp sản phẩm số mà học sinh lớp 2 thường tạo ra.","a":"Tệp là sản phẩm số được tạo ra từ các phần mềm và lưu trữ trong máy tính. Hai loại tệp quen thuộc với học sinh lớp 2 là: tệp tranh vẽ hình ảnh (ví dụ: Ngoi_nha.png) và tệp bài soạn thảo văn bản (ví dụ: Bai_tho.docx)."},{"i":59,"b":"Bài 6","c":1,"l":2,"s":"Vì sao người ta thường ví Thư mục (Folder) trên máy tính giống như các ngăn trong chiếc cặp sách đi học của em?","a":"Vì cũng giống như các ngăn cặp giúp phân loại sách Toán, vở Tiếng Việt, hộp bút riêng biệt cho gọn gàng, Thư mục trên máy tính dùng để cất giữ và phân loại các tệp theo từng môn học hoặc chủ đề giúp dễ quản lý và tìm kiếm nhanh."},{"i":60,"b":"Bài 7","c":1,"l":2,"s":"Em hãy nêu 2 quy tắc quan trọng khi đặt tên và lưu sản phẩm số vào máy tính.","a":"(1) Đặt tên tệp ngắn gọn, rõ nghĩa, đúng nội dung bài làm và không chứa các ký tự bị cấm như / \\ : * ? \" < > |. (2) Chọn đúng thư mục cần lưu trước khi nhấn nút Save để không bị thất lạc bài."},{"i":61,"b":"Bài 12","c":2,"l":2,"s":"Em hãy phân biệt “Thông tin” và “Dữ liệu” qua ví dụ tấm biển ghi dòng chữ: “Thư viện mở cửa lúc 8 giờ sáng”.","a":"- Dữ liệu: Là các chữ cái và con số “Thư viện mở cửa lúc 8 giờ sáng” được viết trên tấm biển. - Thông tin: Là sự hiểu biết của em sau khi đọc dòng chữ đó (biết được thời gian thư viện bắt đầu mở cửa để đến mượn sách đúng giờ)."},{"i":62,"b":"Bài 13","c":2,"l":2,"s":"Kể tên 4 dạng thông tin cơ bản mà em đã học ở lớp 2 và cho biết dạng nào sinh động nhất khi muốn ghi lại cả cảnh buổi lễ chào cờ lẫn tiếng hát Quốc ca.","a":"4 dạng thông tin cơ bản gồm: Dạng chữ, dạng hình ảnh, dạng âm thanh và dạng video. Để ghi lại sinh động cả hình ảnh lễ chào cờ và âm thanh tiếng hát Quốc ca, em chọn dạng video."},{"i":63,"b":"Bài 16","c":3,"l":2,"s":"Thuật toán là gì? Có những cách nào quen thuộc để em trình bày một thuật toán cho bạn cùng lớp hiểu?","a":"Thuật toán là một dãy các bước hướng dẫn rõ ràng, theo đúng thứ tự từ đầu đến cuối để giải quyết một nhiệm vụ. Em có thể trình bày thuật toán bằng lời (liệt kê Bước 1, Bước 2...) hoặc bằng sơ đồ hình vẽ có mũi tên nối tiếp nhau."},{"i":64,"b":"Bài 18","c":4,"l":2,"s":"Khi nào em nên sử dụng khối lệnh “Lặp lại” trong lập trình trực quan? Cho 1 ví dụ ngắn gọn.","a":"Em nên dùng khối lệnh “Lặp lại” khi nhân vật cần thực hiện cùng một hành động (hoặc cùng một nhóm lệnh giống hệt nhau) nhiều lần liên tiếp. Ví dụ: Thay vì ghép 4 khối “Vỗ tay”, em dùng khối “Lặp lại 4 lần [ Vỗ tay ]”."},{"i":65,"b":"Bài 9","c":1,"l":3,"s":"Đầu học kì, em muốn tổ chức góc học tập trên máy tính thật ngăn nắp cho 3 môn: Tin học, Mỹ thuật (vẽ máy) và Tiếng Việt. Em hãy vẽ hoặc mô tả cây thư mục hợp lý của riêng em.","a":"Em tạo 1 thư mục gốc mang tên em (ví dụ: HOC_TAP_LOP_2_AN). Bên trong thư mục gốc đó, em tạo 3 thư mục con riêng biệt là: TIN_HOC, MY_THUAT và TIENG_VIET để lưu sản phẩm tương ứng của từng môn."},{"i":66,"b":"Bài 3","c":0,"l":3,"s":"Em cần gõ câu văn ngắn: “Lớp 2A1 đoàn kết.” rồi xuống dòng gõ tên mình. Em hãy nêu cách dùng các phím Shift, Space, dấu chấm và Enter khi thực hiện.","a":"- Giữ phím Shift + L để viết hoa chữ L đầu câu và Shift + A để viết hoa chữ A trong 2A1. - Nhấn phím Space (dấu cách) đúng 1 lần giữa các từ. - Cuối câu nhấn phím dấu chấm (.), sau đó nhấn phím Enter để xuống dòng mới gõ tên mình."},{"i":67,"b":"Bài 14","c":2,"l":3,"s":"Trời đang nắng bỗng kéo mây đen và có tiếng sấm rền. Mẹ bảo Nam chạy ra sân cất quần áo khô vào nhà. Em hãy xác định Đầu vào, Xử lý và Kết quả (Đầu ra) của bạn Nam.","a":"- Đầu vào: Mắt thấy mây đen, tai nghe tiếng sấm và lời mẹ dặn. - Xử lý: Bộ não Nam hiểu trời sắp mưa to, cần thu quần áo ngay kẻo ướt. - Kết quả (Đầu ra): Nam nhanh nhẹn chạy ra sân gom quần áo khô mang vào nhà."},{"i":68,"b":"Bài 15","c":3,"l":3,"s":"Em hãy phân rã nhiệm vụ “Trồng và tưới một chậu cây nhỏ” thành 4 bước nhỏ rõ ràng theo đúng trình tự.","a":"Bước 1: Cho đất tơi xốp vào chậu và đào một hốc nhỏ ở giữa. Bước 2: Đặt bầu cây con thẳng đứng vào giữa hốc đất. Bước 3: Lấp đất nhẹ nhàng quanh gốc cây cho chắc chắn. Bước 4: Dùng bình tưới một lượng nước vừa đủ làm ẩm đất."},{"i":69,"b":"Bài 16","c":3,"l":3,"s":"Hãy viết thuật toán bằng lời (từng bước từ đầu đến cuối) hướng dẫn một bạn mới biết cách “Tạo thư mục TRANH_VE và lưu bức tranh Hoa_sen.png vào đúng thư mục đó”.","a":"Bước 1: Mở ổ đĩa học tập, chọn lệnh New Folder và đặt tên thư mục là TRANH_VE. Bước 2: Mở phần mềm Paint và vẽ bức tranh hoa sen. Bước 3: Nhấn nút Save (hoặc Ctrl + S), tìm nhấp đúp mở thư mục TRANH_VE. Bước 4: Gõ tên tệp là Hoa_sen rồi nhấn nút Save hoàn tất."},{"i":70,"b":"Bài 17","c":4,"l":3,"s":"Trên sân khấu lập trình, chú Mèo đang đứng bên trái quả bóng 3 bước. Em hãy viết chuỗi lệnh từ lúc bấm Lá cờ xanh để chú Mèo đi tới quả bóng, sút bóng (phát tiếng “Bốp”) và nói “Vào rồi!”.","a":"Chuỗi lệnh theo thứ tự từ trên xuống: Bước 1: Khi nhấn vào Lá cờ xanh -> Bước 2: Đi sang phải 3 bước (hoặc ghép 3 khối Sang phải 1 bước) -> Bước 3: Phát âm thanh “Bốp” -> Bước 4: Nói “Vào rồi!” trong 2 giây."},{"i":71,"b":"Bài 18","c":4,"l":3,"s":"Để vẽ một hình tam giác đều trên sân chơi, Robot thực hiện chuỗi lệnh dài sau: “Đi thẳng 5 bước -> Quay phải 1 góc -> Đi thẳng 5 bước -> Quay phải 1 góc -> Đi thẳng 5 bước -> Quay phải 1 góc”. Em hãy viết gọn lại chuỗi lệnh này bằng khối Lặp lại.","a":"Ta thấy cặp 2 lệnh [Đi thẳng 5 bước -> Quay phải 1 góc] được lặp đi lặp lại đúng 3 lần liên tiếp. Vậy chuỗi lệnh rút gọn là: Lặp lại 3 lần [ Đi thẳng 5 bước -> Quay phải 1 góc ]."},{"i":72,"b":"Bài 13","c":2,"l":3,"s":"Nhóm của em làm bài giới thiệu về “An toàn giao thông trước cổng trường”. Hãy nêu cách chọn dạng thông tin phù hợp cho từng việc: (a) Tên tiêu đề bài; (b) Minh họa cách đội mũ bảo hiểm cài quai đúng; (c) Ghi lại cảnh học sinh xếp hàng ra về trật tự.","a":"- Ý (a) Tên tiêu đề bài: Chọn thông tin dạng chữ to, rõ ràng. - Ý (b) Minh họa cài quai mũ bảo hiểm: Chọn thông tin dạng hình ảnh chụp/vẽ các bước. - Ý (c) Cảnh xếp hàng ra về trật tự: Chọn thông tin dạng video sinh động."},{"i":73,"b":"Bài 19","c":4,"l":4,"s":"Trên lưới ô vuông, Kho báu nằm ở vị trí đi thẳng 3 ô rồi rẽ phải đi tiếp 2 ô. Bạn Huy viết chương trình: “Bước 1: Khi bấm Lá cờ xanh -> Bước 2: Lặp lại 3 lần [ Đi thẳng 1 ô -> Rẽ phải ] -> Bước 3: Đi thẳng 2 ô”. Hãy tìm lỗi sai ở Bước 2 và sửa lại cho đúng.","a":"- Lỗi sai ở Bước 2: Lệnh “Rẽ phải” bị đặt nhầm vào BÊN TRONG vòng lặp 3 lần khiến cứ đi 1 ô Robot lại rẽ phải ngay (đi thành vòng tròn chứ không tiến thẳng 3 ô). - Cách sửa đúng: Đưa lệnh “Rẽ phải” ra ngoài vòng lặp -> Bước 2: Lặp lại 3 lần [ Đi thẳng 1 ô ] -> Bước 3: Rẽ phải -> Bước 4: Lặp lại 2 lần [ Đi thẳng 1 ô ]."},{"i":74,"b":"Bài 18","c":4,"l":4,"s":"Đường đi của Robot có dạng bậc cầu thang gồm 3 bậc giống nhau: mỗi bậc phải “Đi lên 1 ô” rồi “Sang phải 1 ô” để tới đích trên đỉnh cầu thang. Em hãy viết chương trình ngắn gọn nhất dùng khối lệnh Lặp lại để đưa Robot lên đỉnh cầu thang.","a":"Vì mỗi bậc thang đều gồm đúng cặp lệnh [Đi lên 1 ô -> Sang phải 1 ô] và có 3 bậc liên tiếp, chương trình ngắn gọn nhất là: Bước 1: Khi nhấn vào Lá cờ xanh -> Bước 2: Lặp lại 3 lần [ Đi lên 1 ô -> Sang phải 1 ô ]."},{"i":75,"b":"Bài 10","c":1,"l":4,"s":"Máy tính lớp học dùng chung cho hai lớp 2A1 và 2C1. Hôm trước bạn Minh lớp 2A1 lưu tệp “Bai_ve.png” ngay ngoài màn hình nền, hôm nay bạn Minh lớp 2C1 cũng lưu tệp tên “Bai_ve.png” ra màn hình nền và bấm Ghi đè (Replace). Chuyện gì đã xảy ra và làm sao để hai lớp không bao giờ bị mất bài của nhau?","a":"- Hậu quả: Bài vẽ cũ của bạn Minh lớp 2A1 đã bị ghi đè mất đi. - Giải pháp triệt để: Tạo hai thư mục riêng LOP_2A1 và LOP_2C1 trong ổ đĩa học tập; mỗi học sinh lưu vào đúng thư mục lớp mình và gắn thêm họ tên vào tên tệp (ví dụ: Bai_ve_Nguyen_Minh_2A1.png)."},{"i":76,"b":"Bài 16","c":3,"l":4,"s":"Cho thuật toán kiểm tra cặp sách trước khi đến trường gồm: Bước 1: Mở cặp sách và lấy thời khóa biểu hôm nay ra xem -> Bước 2: Kiểm tra từng quyển sách, vở xem đã đủ môn chưa -> Bước 3: Nếu thiếu môn nào thì lấy bổ sung ngay vào cặp -> Bước 4: Kiểm tra hộp bút và đóng cặp lại. Điều gì xảy ra nếu bỏ qua Bước 3?","a":"Nếu bỏ qua Bước 3, dù ở Bước 2 em đã phát hiện ra bị thiếu sách vở nhưng em lại đóng cặp đi học luôn mà không lấy bổ sung, dẫn đến lên lớp vẫn không có sách vở để học bài môn đó."},{"i":77,"b":"Bài 19","c":4,"l":4,"s":"Nhân vật Chú Chó đang quay mặt sang bên phải. Sau khi chạy chương trình: “Lặp lại 2 lần [ Đi thẳng 2 ô -> Quay ngược 180 độ ]”, chú Chó đang đứng cách vị trí xuất phát mấy ô và quay mặt về hướng nào? Giải thích.","a":"Chú Chó đứng cách vị trí xuất phát 0 ô (quay về đúng vị trí ban đầu) và quay mặt về hướng bên phải như lúc đầu. Giải thích: Lần lặp 1 chú đi sang phải 2 ô rồi quay mặt sang trái; Lần lặp 2 chú đi ngược sang trái 2 ô về chỗ cũ rồi quay 180 độ lại hướng sang phải."},{"i":78,"b":"Bài 14","c":2,"l":4,"s":"Em hãy so sánh điểm giống nhau giữa quá trình xử lý thông tin của Con người (khi giải bài Toán đố) và của Máy tính (khi chạy chương trình tính tổng) theo mô hình 3 thành phần.","a":"Điểm giống nhau là cả con người và máy tính đều thực hiện qua 3 bước: (1) Đầu vào: Tiếp nhận đề bài / dữ liệu đưa vào; (2) Xử lý: Bộ não con người suy nghĩ tính toán tương ứng với thân máy (CPU) xử lý theo lệnh; (3) Kết quả (Đầu ra): Viết/nói đáp số tương ứng với máy tính hiển thị kết quả lên màn hình."},{"i":79,"b":"Bài 18","c":4,"l":4,"s":"Robot cần nhặt 3 ngôi sao nằm thẳng hàng ở các ô thứ 2, ô thứ 4 và ô thứ 6 trước mặt (mỗi ngôi sao cách nhau đúng 2 ô, Robot xuất phát ở ô 0). Em hãy thiết kế chuỗi lệnh dùng vòng lặp để Robot đi nhặt hết cả 3 ngôi sao.","a":"Mỗi lần nhặt 1 ngôi sao, Robot đều thực hiện giống nhau: tiến thẳng 2 ô rồi nhặt sao. Vậy chuỗi lệnh tối ưu là: Bước 1: Khi nhấn Lá cờ xanh -> Bước 2: Lặp lại 3 lần [ Đi thẳng 1 ô -> Đi thẳng 1 ô -> Nhặt ngôi sao ] (hoặc Lặp lại 3 lần [ Đi thẳng 2 ô -> Nhặt ngôi sao ])."},{"i":80,"b":"Bài 19","c":4,"l":4,"s":"Em hãy tự sáng tạo kịch bản ngắn 4 bước cho nhân vật “Chú Ong Chăm Chỉ” đi hút mật 2 bông hoa nằm cách đều nhau 3 bước chân rồi mang mật về tổ reo vui, trong đó có sử dụng ít nhất 1 khối lệnh Lặp lại.","a":"Kịch bản thuật toán & chuỗi lệnh hợp lệ: Bước 1: Khi nhấn vào Lá cờ xanh (Chú Ong ở vạch xuất phát). Bước 2: Lặp lại 2 lần [ Bay thẳng 3 bước -> Hút mật hoa trong 1 giây ]. Bước 3: Bay tiếp 2 bước về tới Tổ ong. Bước 4: Phát âm thanh vui nhộn và nói “Tổ ong đầy mật ngọt rồi!”."}]},"3":{"cs":[{"n":"Bài 1: Thông tin và quyết định","b":["Con người thu nhận thông tin từ thế giới xung quanh thông qua năm giác quan: thị giác (mắt nhìn), thính giác (tai nghe), khứu giác (mũi ngửi), vị giác (lưỡi nếm) và xúc giác (da cảm nhận nóng, lạnh, cứng, mềm).","Thông tin thu nhận được giúp con người hiểu biết và đưa ra quyết định phù hợp (ví dụ: thấy đèn giao thông màu đỏ thì dừng lại; nghe tiếng trống trường thì vào lớp).","Khi thông tin thay đổi thì quyết định của con người cũng có thể thay đổi theo để phù hợp với hoàn cảnh thực tế."]},{"n":"Bài 2: Xử lí thông tin","b":["Quá trình xử lí thông tin gồm đúng 3 thành phần nối tiếp nhau: Thông tin vào -> Xử lí -> Thông tin ra.","Ở con người: Các giác quan thu nhận thông tin vào; bộ não thực hiện xử lí thông tin (suy nghĩ, tính toán, cân nhắc); lời nói, chữ viết hoặc hành động/quyết định là thông tin ra.","Ở máy tính: Bàn phím, chuột thu nhận thông tin vào; thân máy tính đảm nhiệm xử lí thông tin; màn hình, loa đưa thông tin ra cho con người biết."]},{"n":"Bài 3: Máy tính và em","b":["Máy tính để bàn gồm 4 bộ phận cơ bản: màn hình (hiển thị kết quả), thân máy (chứa bộ phận xử lí thông tin), bàn phím (gửi tín hiệu chữ, số vào máy) và chuột (điều khiển con trỏ chọn đối tượng trên màn hình).","Một số loại máy tính thông dụng khác: máy tính xách tay (nhỏ gọn, gấp lại được, bàn phím gắn liền thân máy và có vùng cảm ứng chuột), máy tính bảng và điện thoại thông minh.","Máy tính bảng và điện thoại thông minh có màn hình cảm ứng gắn liền với thân máy; người dùng chạm ngón tay trực tiếp lên màn hình và gõ chữ bằng bàn phím ảo hiển thị trên màn hình."]},{"n":"Bài 4: Làm việc với máy tính","b":["Tư thế ngồi đúng khi làm việc với máy tính: lưng thẳng, vai thả lỏng, mắt hướng ngang tầm màn hình và giữ khoảng cách từ mắt đến màn hình khoảng 50 cm đến 80 cm, tay đặt ngang tầm bàn phím.","Đặt máy tính ở nơi khô ráo, thoáng mát, đủ ánh sáng nhưng không để ánh sáng chiếu thẳng vào màn hình hoặc chiếu trực tiếp vào mắt; nên đứng dậy vận động, thư giãn mắt sau khoảng 30 phút sử dụng.","Quy tắc an toàn về điện và tắt máy đúng cách: không chạm tay ướt vào dây điện, ổ cắm điện; không tự ý rút phích cắm khi máy đang chạy; tắt máy tính bằng thao tác chọn nút Start -> Power -> Shut down."]},{"n":"Bài 5: Sử dụng bàn phím","b":["Khu vực chính của bàn phím gồm 5 hàng phím tính từ trên xuống dưới: hàng phím số, hàng phím trên, hàng phím cơ sở, hàng phím dưới và hàng phím dưới cùng chứa phím cách (Spacebar – phím dài nhất trên bàn phím).","Trên hàng phím cơ sở có hai phím có gai là phím F và phím J giúp định vị ngón tay trỏ mà không cần nhìn xuống bàn phím.","Cách đặt tay xuất phát trên hàng phím cơ sở: tay trái đặt nhẹ lên các phím A, S, D, F (ngón trỏ ở phím F); tay phải đặt nhẹ lên các phím J, K, L, ; (ngón trỏ ở phím J); hai ngón cái đặt trên phím cách. Gõ bàn phím đúng cách giúp gõ nhanh hơn, chính xác hơn và bảo vệ sức khỏe."]},{"n":"Bài 6: Khám phá thông tin trên Internet","b":["Internet là kho thông tin khổng lồ giúp em học tập, đọc truyện thiếu nhi, xem tin tức, nghe bài hát, xem video bổ ích và tìm hiểu thế giới xung quanh.","Để truy cập và xem thông tin trên các trang web, em sử dụng phần mềm trình duyệt web (như Google Chrome, Microsoft Edge, Cốc Cốc, Mozilla Firefox).","Không phải mọi thông tin trên Internet đều phù hợp với học sinh tiểu học; khi vô tình gặp hình ảnh, video đáng sợ hoặc thông tin xấu, không phù hợp lứa tuổi, em cần đóng trang web và hỏi ý kiến bố mẹ, thầy cô giáo."]},{"n":"Bài 7: Sắp xếp để dễ tìm","b":["Phân loại là chia các đồ vật hoặc thông tin có chung đặc điểm vào cùng một nhóm theo tiêu chí nhất định (như theo môn học, loại sách, màu sắc, kích thước, công dụng).","Sắp xếp đồ vật và thông tin một cách hợp lí, ngăn nắp giúp không gian gọn gàng và tìm kiếm được thứ mình cần nhanh chóng, tiết kiệm thời gian.","Khi số lượng đồ vật nhiều, ta có thể phân loại thành nhiều cấp (nhóm lớn chia nhỏ thành các ngăn con, hộp con có dán nhãn tên rõ ràng) để càng dễ tìm hơn."]}],"q":[{"i":1,"b":"Bài 1","c":0,"l":1,"s":"Khi đọc chữ và xem tranh minh họa trong cuốn sách Tin học 3, em thu nhận thông tin bằng giác quan nào?","o":["Khứu giác (mũi)","Thị giác (mắt)","Thính giác (tai)","Vị giác (lưỡi)"],"a":1,"k":0},{"i":2,"b":"Bài 1","c":0,"l":1,"s":"Ngửi thấy mùi thơm của món phở mẹ đang nấu trong bếp là em đã thu nhận thông tin qua bộ phận nào?","o":["Mắt (thị giác)","Da tay (xúc giác)","Tai (thính giác)","Mũi (khứu giác)"],"a":3,"k":0},{"i":3,"b":"Bài 1","c":0,"l":1,"s":"Nếm thử miếng cam thấy có vị ngọt mát là thông tin thu nhận được nhờ giác quan nào?","o":["Thị giác (mắt)","Khứu giác (mũi)","Vị giác (lưỡi)","Thính giác (tai)"],"a":2,"k":0},{"i":4,"b":"Bài 1","c":0,"l":1,"s":"Chạm tay vào cốc nước đá thấy lạnh là thông tin thu nhận được qua giác quan nào của cơ thể?","o":["Vị giác (lưỡi)","Khứu giác (mũi)","Xúc giác (làn da)","Thị giác (mắt)"],"a":2,"k":0},{"i":5,"b":"Bài 1","c":0,"l":1,"s":"Thông tin thu nhận được hằng ngày có vai trò gì đối với con người?","o":["Khiến con người không cần suy nghĩ trước khi hành động","Giúp con người hiểu biết và đưa ra các quyết định phù hợp","Làm con người quên hết các công việc cần làm trong ngày","Thay thế hoàn toàn việc ăn uống và nghỉ ngơi của cơ thể"],"a":1,"k":1},{"i":6,"b":"Bài 1","c":0,"l":1,"s":"Nghe tiếng trống trường báo hiệu hết giờ ra chơi, quyết định đúng của học sinh là gì?","o":["Lấy cặp sách đi thẳng về nhà nghỉ ngơi","Tiếp tục ở lại sân trường đá cầu thêm một tiết","Chạy ra cổng trường mua đồ ăn vặt","Nhanh chóng xếp hàng đi vào lớp học"],"a":3,"k":1},{"i":7,"b":"Bài 2","c":1,"l":1,"s":"Trong mô hình xử lí thông tin ở SGK Tin học 3, thành phần đứng ở giữa “Thông tin vào” và “Thông tin ra” là gì?","o":["Trang trí","Sao chép","Xử lí","Đóng gói"],"a":2,"k":0},{"i":8,"b":"Bài 2","c":1,"l":1,"s":"Thông tin mà con người hoặc máy tính tiếp nhận được để đưa vào xử lí được gọi là gì?","o":["Thông tin vào","Thông tin ra","Phần mềm trò chơi","Bàn phím cơ sở"],"a":0,"k":2},{"i":9,"b":"Bài 2","c":1,"l":1,"s":"Kết quả thu được sau khi bộ não con người hoặc thân máy tính xử lí xong thông tin được gọi là gì?","o":["Thông tin ra","Nguồn điện vào","Tín hiệu mạng","Thông tin vào"],"a":0,"k":1},{"i":10,"b":"Bài 2","c":1,"l":1,"s":"Khi máy tính phát bản nhạc thiếu nhi qua loa, âm thanh bài hát đó là thành phần nào của quá trình xử lí thông tin?","o":["Bộ phận xử lí","Thông tin ra","Thông tin vào","Dây nguồn điện"],"a":1,"k":0},{"i":11,"b":"Bài 2","c":1,"l":1,"s":"Thiết bị nào của máy tính để bàn thường dùng để tiếp nhận thông tin vào từ thao tác gõ chữ của em?","o":["Máy in","Loa ngoài","Màn hình","Bàn phím"],"a":3,"k":2},{"i":12,"b":"Bài 2","c":1,"l":1,"s":"Máy tính là công cụ hiệu quả giúp con người thực hiện công việc gì với thông tin?","o":["Thu nhận, lưu trữ và xử lí thông tin nhanh chóng, chính xác","Tự động nấu chín thức ăn mà không cần thiết bị nhà :50,"b":"Bài 5","c":4,"l":2,"s":"Sau khi vươn ngón tay từ hàng phím cơ sở lên hàng phím trên để gõ chữ E hoặc chữ I xong, ngón tay cần làm gì tiếp theo?","o":["Nhấc cả hai bàn tay ra khỏi bàn phím đặt xuống mặt bàn","Đổi ngón tay cái lên gõ tiếp các phím chữ cái ở hàng trên","Giữ nguyên ngón tay nằm luôn ở hàng phím số phía trên cùng","Đưa ngón tay trở về ngay vị trí xuất phát trên hàng phím cơ sở"],"a":3,"k":2},{"i":51,"b":"Bài 5","c":4,"l":2,"s":"Bạn Khoa muốn gõ cụm từ “TIN HOC 3” có khoảng trống giữa các từ. Phím nào giúp Khoa tạo ra khoảng trống giữa từ “TIN” và từ “HOC”?","o":["Phím cách (Spacebar)","Phím có gai F","Phím có gai J","Phím chữ Z"],"a":0,"k":2},{"i":52,"b":"Bài 6","c":5,"l":2,"s":"Khi truy cập Internet để tìm hiểu về loài voi cho bài học Tự nhiên và Xã hội, trang web nào dưới đây phù hợp và an toàn với học sinh lớp 3?","o":["Trang thông tin khoa học thiếu nhi giới thiệu đời sống các loài động vật","Cửa sổ bật lên thông báo máy tính trúng giải thưởng một tỉ đồng","Trang web yêu cầu nộp tiền thẻ cào mới cho xem ảnh con voi","Trang trò chơi trực tuyến dành cho người lớn có cảnh bạo lực"],"a":0,"k":0},{"i":53,"b":"Bài 6","c":5,"l":2,"s":"Vì sao học sinh lớp 3 không nên tự ý cung cấp họ tên, trường lớp, địa chỉ nhà riêng và số điện thoại của bố mẹ lên các trang web lạ trên Internet?","o":["Vì trình duyệt web không cho phép gõ chữ tiếng Việt có dấu","Vì gõ tên trường học sẽ làm màn hình máy tính tự động tắt nguồn","Vì kẻ xấu có thể lợi dụng thông tin cá nhân gây mất an toàn cho em và gia đình","Vì máy tính chỉ lưu được các con số chứ không lưu được địa chỉ nhà"],"a":2,"k":2},{"i":54,"b":"Bài 7","c":6,"l":2,"s":"Trong siêu thị có hàng nghìn mặt hàng nhưng mẹ của Bình vẫn tìm mua được hộp sữa tươi và bó rau cải chỉ trong vài phút. Nguyên nhân chính là gì?","o":["Nhân viên siêu thị giấu tất cả hàng hóa vào kho kín không trưng bày","Mọi mặt hàng trong siêu thị đều có cùng một màu sắc giống hệt nhau","Các mặt hàng trong siêu thị đã được phân loại và xếp vào từng quầy hàng có biển chỉ dẫn rõ ràng","Siêu thị chỉ bán đúng hai mặt hàng là sữa tươi và rau cải"],"a":2,"k":2},{"i":55,"b":"Bài 7","c":6,"l":2,"s":"Bác thủ thư muốn sắp xếp 100 quyển sách giáo khoa của khối Tiểu học sao cho học sinh lớp nào đến cũng tìm được ngay sách của lớp mình. Tiêu chí phân loại cấp 1 hợp lí nhất là gì?","o":["Xếp xen kẽ cứ một quyển Toán lớp 1 lại đến một quyển Tin học lớp 5","Phân loại thành 5 ngăn theo từng khối lớp: Lớp 1, Lớp 2, Lớp 3, Lớp 4, Lớp 5","Phân loại theo quyển nào bìa hơi cũ và quyển nào bìa mới tinh","Xếp chồng tất cả 100 quyển thành một cột cao duy nhất giữa phòng"],"a":1,"k":0},{"i":56,"b":"Bài 7","c":6,"l":2,"s":"Sau khi chia sách giáo khoa theo từng khối lớp (cấp 1), trong ngăn “Lớp 3” bác thủ thư chia nhỏ tiếp thành các tập “Toán”, “Tiếng Việt”, “Tin học” (cấp 2). Cách chia nhiều cấp như vậy có ưu điểm gì?","o":["Làm số lượng sách trong thư viện giảm đi một nửa","Chỉ có tác dụng trang trí chứ không giúp ích cho việc tìm sách","Thu hẹp phạm vi cần tìm theo từng bước, giúp lấy đúng quyển sách nhanh hơn nữa","Bắt buộc người đọc phải xem hết sách Lớp 1 rồi mới được xem sách Lớp 3"],"a":2,"k":2}],"e":[{"i":57,"b":"Bài 1","c":0,"l":2,"s":"Em hãy kể tên năm giác quan của con người và nêu một ví dụ thực tế cho thấy thông tin thu nhận được giúp em đưa ra quyết định đúng đắn.","a":"Năm giác quan của con người là: thị giác (mắt), thính giác (tai), khứu giác (mũi), vị giác (lưỡi) và xúc giác (da). Ví dụ: Buổi sáng đi học, mắt em nhìn thấy bầu trời nhiều mây đen sắp mưa (thông tin) nên em quyết định mang theo áo mưa trong cặp sách."},{"i":58,"b":"Bài 2","c":1,"l":2,"s":"Em hãy vẽ hoặc viết lại sơ đồ 3 thành phần của quá trình xử lí thông tin và cho biết bộ phận nào xử lí thông tin ở con người, bộ phận nào xử lí thông tin ở máy tính để bàn.","a":"Sơ đồ 3 thành phần: Thông tin vào -> Xử lí -> Thông tin ra. Ở con người, bộ não thực hiện việc xử lí thông tin; ở máy tính để bàn, thân máy tính thực hiện việc xử lí thông tin."},{"i":59,"b":"Bài 3","c":2,"l":2,"s":"Em hãy nêu tên 4 bộ phận cơ bản của máy tính để bàn và chức năng chính của từng bộ phận.","a":"Bốn bộ phận cơ bản gồm: (1) Màn hình: hiển thị kết quả làm việc của máy tính (chữ, hình ảnh, video); (2) Thân máy: chứa bộ phận quan trọng xử lí thông tin và điều khiển máy tính; (3) Bàn phím: dùng để gõ chữ, số gửi tín hiệu vào máy tính; (4) Chuột: giúp điều khiển con trỏ chọn và mở các đối tượng trên màn hình."},{"i":60,"b":"Bài 3","c":2,"l":2,"s":"Máy tính bảng và điện thoại thông minh khác máy tính để bàn ở cách điều khiển và nhập thông tin như thế nào?","a":"Máy tính để bàn có màn hình, thân máy, bàn phím, chuột tách rời; còn máy tính bảng và điện thoại thông minh có màn hình cảm ứng gắn liền với thân máy, người dùng điều khiển bằng cách chạm ngón tay trực tiếp lên màn hình và nhập chữ bằng bàn phím ảo hiện trên màn hình."},{"i":61,"b":"Bài 4","c":3,"l":2,"s":"Em hãy trình bày các yêu cầu về tư thế ngồi đúng khi làm việc với máy tính để bảo vệ cột sống và đôi mắt.","a":"Khi ngồi làm việc với máy tính cần: ngồi thẳng lưng, vai thả lỏng tự nhiên; mắt hướng ngang tầm màn hình và cách màn hình khoảng từ 50 cm đến 80 cm; hai tay đặt ngang tầm bàn phím, chuột đặt bên tay phải vừa tầm với."},{"i":62,"b":"Bài 5","c":4,"l":2,"s":"Khu vực chính của bàn phím gồm những hàng phím nào? Vì sao hàng phím cơ sở lại có vai trò quan trọng nhất khi luyện gõ bàn phím?","a":"Khu vực chính của bàn phím gồm 5 hàng phím: hàng phím số, hàng phím trên, hàng phím cơ sở, hàng phím dưới và hàng phím dưới cùng chứa phím cách. Hàng phím cơ sở quan trọng nhất vì có hai phím có gai F và J làm mốc định vị, là nơi đặt 8 ngón tay xuất phát (A, S, D, F và J, K, L, ;) và mọi ngón tay sau khi gõ phím khác đều quay về hàng phím cơ sở."},{"i":63,"b":"Bài 6","c":5,"l":2,"s":"Trình duyệt web dùng để làm gì? Em hãy kể tên ít nhất 3 phần mềm trình duyệt web thông dụng mà em biết.","a":"Trình duyệt web là phần mềm giúp con người truy cập và xem nội dung các trang web trên Internet. Ba trình duyệt web thông dụng là: Google Chrome, Microsoft Edge và Cốc Cốc (ngoài ra còn có Mozilla Firefox, Safari)."},{"i":64,"b":"Bài 7","c":6,"l":2,"s":"Vì sao chúng ta cần phân loại và sắp xếp đồ vật hợp lí trong cuộc sống hằng ngày? Hãy nêu một ví dụ minh họa tại lớp học của em.","a":"Phân loại và sắp xếp đồ vật hợp lí giúp không gian ngăn nắp, đẹp mắt và tìm được đồ vật cần dùng nhanh chóng, không tốn thời gian lục tìm. Ví dụ tại lớp học: Tủ đồ dùng của lớp chia riêng ngăn đựng phấn viết bảng, ngăn đựng khăn lau bảng và ngăn đựng vở bài tập theo từng tổ."},{"i":65,"b":"Bài 1","c":0,"l":3,"s":"Khi đi qua ngã tư cùng mẹ, em thấy đèn dành cho người đi bộ đang có màu xanh nhưng đồng thời nghe tiếng còi hụ lớn của xe cứu hỏa đang lao tới. Em thu nhận thông tin qua những giác quan nào và em sẽ quyết định làm gì?","a":"Em thu nhận thông tin qua thị giác (mắt nhìn thấy đèn xanh cho người đi bộ và thấy xe cứu hỏa) và thính giác (tai nghe tiếng còi xe cứu hỏa). Quyết định đúng: Em đứng lại trên vạch an toàn cùng mẹ để nhường đường cho xe cứu hỏa đi qua hết rồi mới sang đường."},{"i":66,"b":"Bài 2","c":1,"l":3,"s":"Bạn Lan mở phần mềm vẽ tranh trên máy tính, dùng chuột kéo thả để vẽ hình ngôi nhà rồi nhìn thấy bức tranh ngôi nhà hiện lên trên màn hình. Em hãy chỉ ra Thông tin vào, bộ phận Xử lí và Thông tin ra trong hoạt động này.","a":"- Thông tin vào: Các thao tác di chuyển, kéo thả chuột chọn nét vẽ và màu sắc của bạn Lan.\n- Bộ phận xử lí: Thân máy tính tiếp nhận tín hiệu chuột và xử lí lệnh vẽ.\n- Thông tin ra: Hình ảnh bức tranh ngôi nhà hiển thị trên màn hình máy tính."},{"i":67,"b":"Bài 3","c":2,"l":3,"s":"Gia đình em cần một thiết bị đặt cố định ở góc học tập có màn hình rộng để em học trực tuyến và bố làm việc, đồng thời mẹ cần một thiết bị nhỏ bỏ túi để gọi điện và nhắn tin khi đi làm. Em hãy tư vấn chọn loại thiết bị phù hợp cho từng nhu cầu.","a":"- Ở góc học tập cố định của gia đình: Chọn máy tính để bàn (hoặc máy tính xách tay đặt trên bàn) vì có màn hình rộng, bàn phím và chuột rời giúp học tập, làm việc thuận tiện.\n- Nhu cầu bỏ túi mang đi làm của mẹ: Chọn điện thoại thông minh vì rất nhỏ gọn, có màn hình cảm ứng và nghe gọi, nhắn tin mọi lúc mọi nơi."},{"i":68,"b":"Bài 4","c":3,"l":3,"s":"Cuối tiết thực hành Tin học, bạn Tuấn định nhấn nút tắt màn hình rồi đứng dậy về luôn vì tưởng như vậy là máy tính đã tắt hẳn. Em hãy giải thích cho bạn Tuấn hiểu và hướng dẫn bạn tắt máy đúng cách.","a":"Nhấn nút tắt màn hình chỉ làm màn hình tối đi chứ thân máy tính vẫn đang chạy tốn điện và dễ hỏng máy nếu ngắt điện phòng máy. Cách tắt máy tính đúng chuẩn: Nháy chuột vào nút Start ở góc dưới bên trái màn hình -> chọn biểu tượng Power -> chọn lệnh Shut down và đợi máy tắt hoàn toàn."},{"i":69,"b":"Bài 5","c":4,"l":3,"s":"Em cần gõ từ “FJDK SLA;” trên hàng phím cơ sở bằng 10 ngón tay. Em hãy cho biết từng kí tự trong từ này được gõ bởi ngón tay nào của bàn tay nào.","a":"- Với nhóm “FJDK”: F (ngón trỏ tay trái), J (ngón trỏ tay phải), D (ngón giữa tay trái), K (ngón giữa tay phải).\n- Khoảng trắng ở giữa: Gõ phím cách (Spacebar) bằng ngón cái.\n- Với nhóm “SLA;”: S (ngón áp út tay trái), L (ngón áp út tay phải), A (ngón út tay trái), ; (ngón út tay phải)."},{"i":70,"b":"Bài 5","c":4,"l":3,"s":"Bạn Minh nói rằng: “Gõ bằng hai ngón trỏ nhìn bàn phím vừa dễ vừa nhanh hơn đặt 10 ngón tay lên hàng phím cơ sở”. Em có đồng ý với ý kiến của Minh không? Vì sao?","a":"Em không đồng ý với Minh. Lúc mới tập, gõ 2 ngón có vẻ dễ quen nhưng phải cúi nhìn bàn phím liên tục làm mỏi cổ, mỏi mắt và gõ chậm, dễ nhầm. Khi kiên trì rèn luyện đặt 10 ngón tay trên hàng phím cơ sở, mỗi ngón phụ trách vùng phím riêng nên về lâu dài sẽ gõ rất nhanh, chính xác mà mắt vẫn nhìn thẳng màn hình."},{"i":71,"b":"Bài 6","c":5,"l":3,"s":"Khi đang dùng trình duyệt Google Chrome tìm bài thơ về mái trường, trên màn hình bỗng hiện ra một khung hình nhấp nháy ghi: “Nhấn vào đây để nhận quà miễn phí, hãy nhập số điện thoại của mẹ!”. Em sẽ xử lí như thế nào?","a":"Em tuyệt đối không nhấn vào khung quảng cáo đó và không nhập số điện thoại hay bất kì thông tin cá nhân nào của gia đình. Em đóng ngay cửa sổ lạ đó lại và gọi bố mẹ hoặc thầy cô giáo đến kiểm tra, hướng dẫn trang web học tập an toàn."},{"i":72,"b":"Bài 7","c":6,"l":3,"s":"Em có các bài kiểm tra và phiếu bài tập đã làm của 3 môn Toán, Tiếng Việt, Tin học từ đầu năm đến nay để chung trong cặp nên rất hay bị nhăn và khó tìm. Em hãy nêu cách dùng bìa sơ-mi (túi đựng tài liệu) để sắp xếp chúng thật khoa học.","a":"Em chuẩn bị 3 túi bìa sơ-mi khác màu (hoặc dán nhãn tên rõ ràng bên ngoài): Túi 1 ghi “Môn Toán”, Túi 2 ghi “Môn Tiếng Việt”, Túi 3 ghi “Môn Tin học”. Trong mỗi túi, em xếp các phiếu bài tập và bài kiểm tra theo thứ tự tuần từ đầu năm đến tuần mới nhất để giữ phẳng phiu và cần tờ nào là mở đúng túi môn đó lấy được ngay."},{"i":73,"b":"Bài 1","c":0,"l":4,"s":"Ban đầu lớp 3A1 dự định tổ chức kéo co ngoài sân trường vào tiết Sinh hoạt cuối tuần. Nhưng trước giờ ra sân 10 phút, thầy tổng phụ trách thông báo sân trường đang ướt trơn sau cơn mưa rào. Em hãy phân tích sự thay đổi thông tin và đề xuất quyết định mới an toàn cho cả lớp.","a":"- Thông tin ban đầu: Thời tiết bình thường -> Quyết định dự kiến là ra sân chơi kéo co.\n- Thông tin mới thay đổi: Sân trường bị ướt và trơn trượt sau cơn mưa rào (nguy cơ ngã chấn thương).\n- Quyết định mới phù hợp: Chuyển sang tổ chức trò chơi tập thể an toàn ngay trong phòng học (như đố vui kiến thức, hát nối từ) và đợi tuần sau sân khô ráo mới thi kéo co."},{"i":74,"b":"Bài 2","c":1,"l":4,"s":"Hãy so sánh quá trình xử lí thông tin của bác tài xế khi lái xe gặp biển báo “Trường học – Đi chậm” và quá trình xử lí thông tin của máy giặt tự động khi mẹ chọn chế độ “Giặt nhanh” rồi bấm nút Khởi động.","a":"- Điểm giống nhau: Cả hai đều tuân theo mô hình 3 thành phần (Thông tin vào -> Xử lí -> Thông tin ra).\n- Ở bác tài xế (con người): Thông tin vào là hình ảnh biển báo thu qua mắt -> Bộ não xử lí nhận biết phía trước có học sinh qua đường -> Thông tin ra là hành động giảm tốc độ xe an toàn.\n- Ở máy giặt (máy móc điều khiển tự động): Thông tin vào là nút lệnh “Giặt nhanh” -> Bộ vi xử lí bên trong máy tính toán thời gian, lượng nước -> Thông tin ra là lồng giặt quay, xả nước và báo chuông khi giặt xong."},{"i":75,"b":"Bài 3","c":2,"l":4,"s":"Tại quầy tra cứu thông tin của bảo tàng lịch sử, người ta đặt một màn hình lớn treo trên giá đỡ, không hề có chuột hay bàn phím rời nhưng khách tham quan vẫn chọn xem được ảnh và video các hiện vật. Theo em đó là loại màn hình gì và quá trình vào – xử lí – ra diễn ra thế nào khi em chạm tay chọn một bức ảnh?","a":"- Đó là thiết bị máy tính dùng màn hình cảm ứng (tương tự máy tính bảng cỡ lớn).\n- Khi em chạm ngón tay vào bức ảnh nhỏ: Vị trí chạm tay trên màn hình cảm ứng là Thông tin vào -> Bộ phận xử lí bên trong thân máy giải mã yêu cầu mở ảnh -> Bức ảnh phóng to kèm lời thuyết minh hiện ra trên màn hình và phát qua loa là Thông tin ra."},{"i":76,"b":"Bài 4","c":3,"l":4,"s":"Em hãy thiết kế một “Bảng 4 quy tắc vàng góc học tập máy tính an toàn tại nhà” ngắn gọn, dễ nhớ để dán cạnh bàn học giúp em và em nhỏ trong nhà luôn thực hiện đúng.","a":"Bảng 4 quy tắc vàng tại góc máy tính:\n1. Ngồi chuẩn dáng đẹp: Lưng thẳng, mắt cách màn hình 50 – 80 cm, phòng đủ ánh sáng.\n2. Nghỉ mắt đúng giờ: Cứ 30 phút đứng dậy vươn vai, nhìn xa thư giãn mắt.\n3. An toàn điện – nước: Không để đồ uống cạnh máy, tuyệt đối không chạm tay ướt vào ổ điện.\n4. Tắt máy lịch sự: Luôn lưu bài và chọn Start -> Power -> Shut down, không rút điện đột ngột."},{"i":77,"b":"Bài 5","c":4,"l":4,"s":"Giả sử trong phòng tối hoặc khi nhắm mắt kiểm tra, làm thế nào em đặt đúng cả 10 ngón tay lên vị trí xuất phát của khu vực chính bàn phím mà không nhìn bàn phím? Hãy mô tả từng bước cách dò phím thông minh của em.","a":"Các bước định vị không cần nhìn:\n- Bước 1: Đưa nhẹ hai ngón tay trỏ lướt trên khu vực giữa bàn phím để tìm hai phím có gờ gai nhỏ nổi lên: ngón trỏ trái dừng ở phím F, ngón trỏ phải dừng ở phím J (giữa F và J sẽ cách đúng hai phím G, H).\n- Bước 2: Xếp lần lượt ba ngón còn lại của tay trái sang bên trái phím F (ngón giữa ở D, áp út ở S, út ở A) và ba ngón còn lại của tay phải sang bên phải phím J (ngón giữa ở K, áp út ở L, út ở ;).\n- Bước 3: Đặt nhẹ hai ngón cái xuống phím dài nhất ngay hàng dưới cùng là phím cách (Spacebar)."},{"i":78,"b":"Bài 6","c":5,"l":4,"s":"Em của bạn Hà mới học lớp 1 thường mượn máy tính bảng xem video hoạt hình trên Internet. Đôi khi trang web tự động chuyển sang các video có trò đùa nguy hiểm bắt chước theo. Hà nên tư vấn cho bố mẹ và hướng dẫn em nhỏ quy tắc sử dụng Internet như thế nào?","a":"- Với em nhỏ: Dặn em chỉ xem các kênh hoạt hình giáo dục đã được bố mẹ mở sẵn; nếu thấy video có hành động nguy hiểm, đáng sợ thì tuyệt đối không làm theo mà phải dừng xem và gọi ngay bố mẹ hoặc anh/chị.\n- Với bố mẹ: Đề nghị bố mẹ ngồi cạnh đồng hành, cài đặt chế độ an toàn dành cho trẻ em trên trình duyệt/ứng dụng và giới hạn thời gian xem hợp lí (không quá 30 phút mỗi lần)."},{"i":79,"b":"Bài 7","c":6,"l":4,"s":"Tủ thuốc gia đình có nhiều loại: Băng cá nhân, Bông y tế, Nước muối rửa mắt, Thuốc hạ sốt người lớn, Siro ho trẻ em, Nhiệt kế điện tử. Em hãy giúp bố mẹ phân loại tủ thuốc thành các ngăn hợp lí kèm lưu ý an toàn để khi cần sơ cứu là tìm thấy ngay.","a":"Em đề xuất chia tủ thuốc gia đình thành 3 ngăn có dán nhãn to, rõ ràng:\n- Ngăn 1 – Dụng cụ y tế & Sơ cứu ngoài da: Băng cá nhân, Bông y tế, Nhiệt kế điện tử, Nước muối rửa mắt.\n- Ngăn 2 – Thuốc dành cho trẻ em: Siro ho trẻ em (ghi rõ liều dùng bên ngoài).\n- Ngăn 3 – Thuốc dành cho người lớn: Thuốc hạ sốt người lớn.\nLưu ý an toàn: Đặt tủ thuốc trên cao ngoài tầm tự lấy của em bé nhỏ, trẻ em chỉ lấy thuốc khi có sự hướng dẫn trực tiếp của bố mẹ."},{"i":80,"b":"Bài 7","c":6,"l":4,"s":"Câu lạc bộ Đọc sách lớp 3C1 quyên góp được 40 cuốn sách gồm truyện lịch sử Việt Nam, truyện cổ tích thế giới, sách đố vui Toán học và sách khám phá khoa học. Nếu chỉ có 2 kệ gỗ và mỗi kệ có 2 ngăn, em sẽ tổ chức phân loại 2 cấp và dán nhãn thế nào để các bạn mượn và trả sách không bao giờ bị nhầm chỗ?","a":"Em tổ chức phân loại 2 cấp theo kệ (nhóm lớn) và ngăn (nhóm con):\n- Kệ 1 dán nhãn “KỆ TRUYỆN ĐỌC”:\n + Ngăn 1A: Truyện lịch sử Việt Nam (dán tem màu đỏ ở gáy sách).\n + Ngăn 1B: Truyện cổ tích thế giới (dán tem màu vàng ở gáy sách).\n- Kệ 2 dán nhãn “KỆ KHOA HỌC & TOÁN VUI”:\n + Ngăn 2A: Sách đố vui Toán học (dán tem màu xanh dương ở gáy sách).\n + Ngăn 2B: Sách khám phá khoa học (dán tem màu xanh lá ở gáy sách).\nNhờ cả nhãn ngăn lẫn tem màu trên gáy sách, các bạn vừa tìm mượn cực nhanh vừa xếp trả đúng vị trí ban đầu."}]},"4":{"cs":[{"n":"Bài 1: Phần cứng và phần mềm máy tính","b":["Phần cứng là các thiết bị vật lí bên trong và bên ngoài máy tính mà ta có thể nhìn thấy, chạm tay vào được (như thân máy, màn hình, bàn phím, chuột, loa, máy in, ổ cứng, thẻ nhớ USB).","Phần mềm là các chương trình hướng dẫn, điều khiển máy tính thực hiện công việc, không thể chạm tay vào được (như hệ điều hành Windows, trình duyệt Google Chrome, phần mềm trình chiếu PowerPoint, Word, Paint, UniKey).","Mối quan hệ phụ thuộc: Phần cứng và phần mềm gắn bó chặt chẽ; không có phần cứng thì phần mềm không có môi trường để chạy, không có phần mềm thì phần cứng chỉ là khối thiết bị không hoạt động được. Cần thao tác đúng cách (tắt máy bằng lệnh Shut down, tránh va đập, tránh ẩm ướt, không tự ý xóa tệp hệ thống) để bảo vệ máy tính."]},{"n":"Bài 2: Gõ bàn phím đúng cách","b":["Luôn đặt các ngón tay xuất phát trên hàng phím cơ sở (A, S, D, F và J, K, L, ;), vươn ngón tay lên gõ phím ở hàng phím số rồi đưa ngay ngón tay trở về hàng phím cơ sở.","Phân công ngón tay gõ hàng phím số: Tay trái gồm ngón út (phím 1), ngón áp út (phím 2), ngón giữa (phím 3), ngón trỏ (phím 4 và phím 5); Tay phải gồm ngón trỏ (phím 6 và phím 7), ngón giữa (phím 8), ngón áp út (phím 9), ngón út (phím 0).","Trên phím có hai kí hiệu: gõ bình thường được kí hiệu dưới; nhấn giữ phím Shift (bằng ngón út của tay kia) đồng thời gõ phím đó để được kí hiệu trên (ví dụ: Shift + 2 gõ @, Shift + 5 gõ %). Gõ bàn phím đúng cách giúp tăng tốc độ, chính xác và bảo vệ sức khỏe tay, mắt."]},{"n":"Bài 3: Thông tin trên trang web","b":["Trên trang web thường có nhiều dạng thông tin phong phú: văn bản (chữ, số), hình ảnh, âm thanh, video và các siêu liên kết (hyperlink).","Siêu liên kết là thành phần đặc biệt trên trang web dẫn tới một trang web khác hoặc vị trí khác; khi di chuyển con trỏ chuột vào siêu liên kết, con trỏ chuột chuyển thành hình bàn tay chỉ ngón trỏ.","Xem các trang web không phù hợp lứa tuổi (bạo lực, kinh dị, lừa đảo) gây ảnh hưởng xấu tới tâm lí, mất thời gian học tập và có nguy cơ làm máy tính nhiễm phần mềm độc hại; học sinh tuyệt đối không truy cập và cần báo ngay cho bố mẹ, thầy cô."]},{"n":"Bài 4: Tìm kiếm thông tin trên Internet","b":["Máy tìm kiếm (như Google tại địa chỉ google.com, Bing tại địa chỉ bing.com) là công cụ trên Internet giúp tìm nhanh các trang web, hình ảnh, video chứa thông tin theo yêu cầu.","Từ khóa (keyword) là từ hoặc cụm từ ngắn gọn, sát nội dung cần tìm được nhập vào ô tìm kiếm. Chọn từ khóa càng chính xác thì kết quả trả về càng đúng ý muốn.","Các bước tìm kiếm: Mở trình duyệt web -> Truy cập máy tìm kiếm -> Gõ từ khóa vào ô tìm kiếm và nhấn phím Enter -> Chọn kết quả phù hợp (chọn thẻ Hình ảnh / Images nếu muốn tìm riêng tranh ảnh)."]},{"n":"Bài 5: Thao tác với tệp và thư mục","b":["Năm thao tác cơ bản quản lí tệp và thư mục: Tạo thư mục mới (New folder), Đổi tên (Rename), Sao chép (Copy rồi Paste – tạo thêm bản sao ở thư mục đích, giữ nguyên bản gốc), Di chuyển (Cut rồi Paste – chuyển hẳn sang thư mục đích), Xóa (Delete).","Cần đóng tệp đang mở trước khi thực hiện đổi tên, di chuyển hoặc xóa tệp/thư mục chứa tệp đó.","Thao tác nhầm (xóa nhầm, đổi tên hoặc di chuyển tùy tiện) có thể làm thất lạc bài học, mất dữ liệu quan trọng hoặc làm hỏng phần mềm trên máy tính."]},{"n":"Bài 6: Sử dụng phần mềm khi được phép","b":["Phần mềm máy tính là sản phẩm trí tuệ do tác giả (cá nhân hoặc tổ chức) dày công tạo ra và được pháp luật bảo vệ quyền tác giả.","Phần mềm miễn phí là phần mềm tác giả cho phép mọi người tải về và sử dụng không phải trả tiền (ví dụ: UniKey, Scratch, Google Chrome). Phần mềm không miễn phí (có bản quyền thương mại) chỉ được sử dụng khi đã mua bản quyền hoặc được tác giả cấp phép.","Chỉ sử dụng phần mềm khi được phép là hành vi văn minh, tôn trọng công sức tác giả, tuân thủ pháp luật và giúp máy tính tránh bị nhiễm vi-rút từ các bản bẻ khóa lậu."]},{"n":"Bài 7: Tạo bài trình chiếu","b":["Phần mềm trình chiếu PowerPoint giúp tạo các trang chiếu sinh động phục vụ thuyết trình, học tập. Để gõ tiếng Việt có dấu trên trang chiếu, cần bật phần mềm gõ tiếng Việt (như UniKey với kiểu gõ Telex hoặc VNI).","Các thao tác chính: Thêm trang chiếu mới (thẻ Home -> New Slide), chèn hình ảnh minh họa từ máy tính (thẻ Insert -> Pictures), lưu tệp bài trình chiếu (thẻ File -> Save, phần mở rộng .pptx).","Nhấn phím F5 (hoặc chọn nút Slide Show) để trình chiếu toàn màn hình từ đầu; nhấn phím Esc để thoát khỏi chế độ trình chiếu."]},{"n":"Bài 8: Định dạng văn bản trên trang chiếu","b":["Trước khi định dạng, cần kéo thả chuột bôi đen (chọn) phần văn bản cần thay đổi, sau đó sử dụng các nút lệnh trong nhóm Font và Paragraph trên thẻ Home.","Các nút lệnh định dạng thông dụng: Font (chọn phông chữ), Font Size (chọn cỡ chữ), B – Bold (chữ đậm), I – Italic (chữ nghiêng), U – Underline (chữ gạch chân), Font Color (màu chữ), Bullets (tạo kí hiệu liệt kê đầu dòng).","Nguyên tắc trình bày đẹp, dễ đọc: Chọn cỡ chữ đủ lớn, ngắn gọn theo ý chính và chọn màu chữ tương phản rõ ràng với màu nền trang chiếu (như nền sáng – chữ đậm tối, nền sẫm – chữ sáng màu)."]}],"q":[{"i":1,"b":"Bài 1","c":0,"l":1,"s":"Thiết bị nào sau đây là một phần cứng nằm bên trong thân máy tính dùng để lưu trữ lâu dài hệ điều hành và dữ liệu?","o":["Phần mềm Paint","Ổ đĩa cứng","Trình duyệt Chrome","Chương trình UniKey"],"a":1,"k":0},{"i":2,"b":"Bài 1","c":0,"l":1,"s":"Trong các tên gọi sau đây, tên gọi nào là một phần mềm hệ điều hành thông dụng trên máy tính?","o":["Windows","Bàn phím","Thẻ nhớ USB","Màn hình"],"a":0,"k":1},{"i":3,"b":"Bài 1","c":0,"l":1,"s":"Thiết bị phần cứng nào giúp đưa văn bản, hình ảnh từ máy tính in ra trên mặt giấy?","o":["Chuột quang","Bàn phím","Máy in","Thẻ nhớ"],"a":2,"k":0},{"i":4,"b":"Bài 1","c":0,"l":1,"s":"Phần mềm Paint trên máy tính giúp em thực hiện công việc gì?","o":["Cung cấp nguồn điện cho màn hình sáng lên","Vẽ và tô màu các bức tranh trên máy tính","In tài liệu ra giấy mà không cần máy in","Làm mát thân máy tính thay cho quạt gió"],"a":1,"k":1},{"i":5,"b":"Bài 1","c":0,"l":1,"s":"Vì sao không được va đập mạnh vào thân máy tính hoặc màn hình máy tính khi đang sử dụng?","o":["Vì sẽ làm hư hỏng các linh kiện phần cứng bên trong và làm vỡ màn hình","Vì va đập sẽ làm phần mềm miễn phí tự chuyển thành phần mềm có phí","Vì va đập làm tăng thêm số lượng phím trên bàn phím","Vì va đập làm đổi tên tất cả các trang web trên mạng Internet"],"a":0,"k":0},{"i":6,"b":"Bài 2","c":1,"l":1,"s":"Theo phân công ngón tay gõ hàng phím số, bàn tay trái phụ trách gõ dãy phím số nào?","o":["Các phím số 6, 7, 8, 9, 0","Các phím số 2, 4, 6, 8, 0","Các phím số 1, 2, 3, 4, 5","Các phím số 1, 3, 5, 7, 9"],"a":2,"k":1},{"i":7,"b":"Bài 2","c":1,"l":1,"s":"Theo phân công ngón tay gõ hàng phím số, bàn tay phải phụ trách gõ dãy phím số nào?","o":["Các phím số 6, 7, 8, 9, 0","Các phím số 3, 4, 5, 6, 7","Các phím số 1, 2, 8, 9, 0","Các phím số 1, 2, 3, 4, 5"],"a":0,"k":1},{"i":8,"b":"Bài 2","c":1,"l":1,"s":"Ngón trỏ của bàn tay phải được phân công gõ hai phím số nào trên hàng phím số?","o":["Phím số 6 và phím số 7","Phím số 9 và phím số 0","Phím số 4 và phím số 5","Phím số 8 và phím số 9"],"a":0,"k":1},{"i":9,"b":"Bài 2","c":1,"l":1,"s":"Ngón út của bàn tay phải được phân công gõ phím số nào trên hàng phím số?","o":["Phím số 1","Phím số 5","Phím số 6","Phím số 0"],"a":3,"k":1},{"i":10,"b":"Bài 2","c":1,"
