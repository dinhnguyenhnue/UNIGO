 3","c":2,"l":2,"s":"Bạn Hoa có 4 tệp tin: Bai_hat.mp3 (5 MB), Phim_khoa_hoc.mp4 (1,2 GB), De_cuong.docx (512 KB) và Ghi_chu.txt (900 Byte). Thứ tự các tệp từ dung lượng nhỏ nhất đến lớn nhất là gì?","o":["Ghi_chu.txt -> De_cuong.docx -> Bai_hat.mp3 -> Phim_khoa_hoc.mp4","Ghi_chu.txt -> Bai_hat.mp3 -> De_cuong.docx -> Phim_khoa_hoc.mp4","De_cuong.docx -> Ghi_chu.txt -> Bai_hat.mp3 -> Phim_khoa_hoc.mp4","Phim_khoa_hoc.mp4 -> Bai_hat.mp3 -> De_cuong.docx -> Ghi_chu.txt"],"a":0,"k":2},{"i":47,"b":"Bài 4","c":3,"l":2,"s":"Gia đình bạn Tuấn có 1 máy tính để bàn (nối dây cáp mạng) và 3 chiếc điện thoại thông minh (dùng Wi-Fi) cùng truy cập mạng qua một thiết bị Wi-Fi Router của nhà mạng. Khi dây cáp quang từ ngoài đường vào Router bị đứt, điều gì xảy ra?","o":["Các tệp văn bản lưu sẵn trong ổ cứng máy tính đều biến mất","Các thiết bị trong nhà vẫn thuộc mạng nội bộ nhưng không truy cập được các website ngoài Internet","Màn hình của máy tính để bàn lập tức bị tắt nguồn điện","Điện thoại thông minh không thể mở ứng dụng chụp ảnh ngoại tuyến"],"a":1,"k":1},{"i":48,"b":"Bài 4","c":3,"l":2,"s":"Trong thư viện trường có 5 máy tính tra cứu nhưng chỉ có 1 chiếc máy in laser duy nhất. Giải pháp tiết kiệm chi phí và tiện lợi nhất để cả 5 máy tính đều in được tài liệu trên chiếc máy in đó là gì?","o":["Chụp màn hình tài liệu bằng mắt thường rồi chép tay lại ra giấy","Mỗi lần cần in lại tháo bê chiếc máy in sang cắm trực tiếp vào từng máy tính","Bắt buộc nhà trường phải mua thêm 4 chiếc máy in mới đặt cạnh mỗi máy","Kết nối 5 máy tính và máy in vào cùng mạng LAN rồi thiết lập chia sẻ máy in dùng chung"],"a":3,"k":0},{"i":49,"b":"Bài 5","c":4,"l":2,"s":"Trên mạng xã hội và các diễn đàn Internet, người gửi tin có thể dùng biệt danh thay vì tên thật (tính ẩn danh). Đặc điểm này đòi hỏi học sinh cần lưu ý điều gì khi tiếp nhận thông tin?","o":["Cần cảnh giác, kiểm chứng nguồn gốc thông tin và không dễ dãi tin theo lời rủ rê của người lạ trên mạng","Cung cấp ngay địa chỉ nhà và mật khẩu cho bất kì tài khoản nào nhắn tin làm quen","Tin tưởng tuyệt đối mọi bài viết có nhiều lượt bình luận trên diễn đàn","Dùng biệt danh ẩn danh để viết bình luận thiếu văn hóa trêu chọc người khác"],"a":0,"k":1},{"i":50,"b":"Bài 5","c":4,"l":2,"s":"Một sự kiện thể thao quốc tế vừa kết thúc lúc 20 giờ 00 phút, chỉ 1 phút sau các báo điện tử trên Internet đã đăng tải kết quả và hình ảnh trận đấu cho độc giả toàn thế giới xem. Điều này minh họa đặc điểm nào của thông tin trên Internet?","o":["Tính chỉ phục vụ một khu vực địa lí hẹp","Tính không lưu trữ thông tin cũ","Tính cập nhật nhanh chóng và tính dễ tiếp cận","Tính độc quyền của báo in truyền thống"],"a":2,"k":1},{"i":51,"b":"Bài 6","c":5,"l":2,"s":"Khi đọc bài viết về 'Hệ Mặt Trời' trên bách khoa toàn thư mở Wikipedia, bạn Mai thấy từ 'Sao Hỏa' có màu xanh, khi nháy chuột vào đó trình duyệt lập tức chuyển sang trang bài viết chi tiết về Sao Hỏa. Từ 'Sao Hỏa' đó đóng vai trò gì?","o":["Là một siêu liên kết (Hyperlink) bên trong siêu văn bản","Là địa chỉ thư điện tử của tác giả bài viết","Là tên của trình duyệt web đang cài trên máy tính","Là một thiết bị chuyển mạch vật lí của mạng"],"a":0,"k":0},{"i":52,"b":"Bài 6","c":5,"l":2,"s":"Bạn Quân thường xuyên truy cập cổng học liệu trực tuyến của trường để làm bài tập hằng tuần nhưng địa chỉ URL của trang khá dài và khó nhớ. Tính năng nào của trình duyệt web giúp Quân mở lại trang đó chỉ bằng một cú nháy chuột?","o":["Lưu địa chỉ trang web vào danh sách Đánh dấu trang (Bookmark / Favorites)","Mỗi lần học lại gọi điện hỏi bạn đọc từng chữ cái của địa chỉ URL","Xóa sạch dữ liệu duyệt web sau mỗi phút sử dụng","Chụp ảnh màn hình trang web rồi đặt làm hình nền Desktop"],"a":0,"k":2},{"i":53,"b":"Bài 7","c":6,"l":2,"s":"So sánh hai cách gõ từ khóa trên Google: Cách 1 gõ Chiến thắng Điện Biên Phủ (không có ngoặc kép) và Cách 2 gõ “Chiến thắng Điện Biên Phủ” (có ngoặc kép). Sự khác biệt chính về kết quả là gì?","o":["Cách 1 tìm trên toàn thế giới, còn Cách 2 chỉ tìm các tệp trong ổ đĩa D của máy tính","Cách 2 thu hẹp kết quả, chỉ liệt kê các trang chứa chính xác nguyên cụm từ theo đúng thứ tự","Cách 1 chỉ trả về hình ảnh, còn Cách 2 chỉ trả về các tệp âm thanh","Cách 2 làm máy tìm kiếm báo lỗi cú pháp và không hiển thị trang web nào"],"a":1,"k":1},{"i":54,"b":"Bài 7","c":6,"l":2,"s":"Bạn Vy muốn tìm đề cương ôn tập môn Tin học 6 định dạng tệp PDF để tải về in ra giấy. Từ khóa tìm kiếm nào dưới đây giúp Vy lọc nhanh đúng loại tài liệu mong muốn?","o":["sách giáo khoa các môn cấp hai","cách cài đặt phần mềm đọc tệp","lịch sử phát triển mạng máy tính","“đề cương ôn tập Tin học 6” pdf"],"a":3,"k":2},{"i":55,"b":"Bài 8","c":7,"l":2,"s":"Hai bạn cùng tên là Nguyễn Minh Anh đều đăng kí hộp thư trên dịch vụ Gmail (gmail.com). Hệ thống máy chủ thư điện tử xử lí việc đặt tên đăng nhập như thế nào?","o":["Cho phép hai bạn dùng chung một địa chỉ giống hệt nhau và tự chia đôi thư gửi đến","Từ chối không cho bất kì người nào tên Minh Anh đăng kí thêm hộp thư trên thế giới","Hai tài khoản bắt buộc phải có phần tên đăng nhập trước kí hiệu @ khác nhau vì mỗi địa chỉ email là duy nhất","Đổi kí hiệu @ của bạn thứ hai thành kí hiệu dấu thăng #"],"a":2,"k":1},{"i":56,"b":"Bài 8","c":7,"l":2,"s":"Bạn Đức gửi bài tập về nhà qua email cho cô giáo nhưng để trống hoàn toàn ô Subject, không viết lời chào trong thân thư mà chỉ đính kèm tệp tên bt1.docx. Hạn chế của việc làm này là gì?","o":["Thiếu lịch sự, khiến cô giáo khó nhận biết ngay thư của học sinh nào, lớp nào và dễ bị bộ lọc xếp vào mục thư rác","Làm bức thư không thể truyền qua bộ định tuyến của nhà mạng","Khiến tệp đính kèm bt1.docx tự động tăng dung lượng lên 10 GB","Làm đổi mật khẩu hộp thư của cả người gửi lẫn người nhận"],"a":0,"k":0}],"e":[{"i":57,"b":"Bài 1","c":0,"l":2,"s":"Em hãy phân biệt ba khái niệm: Thông tin, Dữ liệu và Vật mang tin. Cho một ví dụ thực tế trong trường học có chỉ rõ cả ba yếu tố này.","a":"- Thông tin là sự hiểu biết mà con người thu nhận được. - Dữ liệu là hình thức thể hiện của thông tin (chữ, số, hình ảnh, âm thanh) được ghi lại. - Vật mang tin là phương tiện vật chất chứa dữ liệu đó. Ví dụ: Tờ thông báo lịch thi Cuối kì 1 dán trên bảng tin lớp 6A1 -> Vật mang tin là tờ giấy thông báo; Dữ liệu là các dòng chữ và con số ngày giờ thi in trên giấy; Thông tin là sự hiểu biết của học sinh về lịch thi để chủ động ôn tập đúng môn, đúng ngày."},{"i":58,"b":"Bài 2","c":1,"l":2,"s":"Em hãy vẽ hoặc mô tả sơ đồ các bộ phận chức năng của máy tính tương ứng với 4 hoạt động xử lí thông tin của con người.","a":"Tương ứng giữa 4 hoạt động xử lí thông tin của con người và máy tính: (1) Thu nhận thông tin: Ngũ quan của con người <-> Các thiết bị vào của máy tính (bàn phím, chuột, micro, webcam, scanner); (2) Lưu trữ thông tin: Bộ não ghi nhớ / sổ tay <-> Bộ nhớ máy tính (RAM, ổ cứng, USB, đĩa quang); (3) Xử lí thông tin: Bộ não tư duy, tính toán <-> Bộ xử lí trung tâm (CPU); (4) Truyền/xuất thông tin: Lời nói, cử chỉ, chữ viết <-> Các thiết bị ra (màn hình, loa, máy in, máy chiếu) và card mạng."},{"i":59,"b":"Bài 3","c":2,"l":2,"s":"Tại sao máy tính không trực tiếp hiểu chữ cái và âm thanh như con người mà phải biểu diễn mọi dữ liệu thành dãy bit (0 và 1)? Nêu mối quan hệ quy đổi chính xác giữa bit, Byte, KB, MB, GB và TB.","a":"Máy tính hoạt động dựa trên các linh kiện điện tử có hai trạng thái vật lí phân biệt rõ ràng (có điện / không có điện, bật / tắt), tương ứng tự nhiên với hai kí hiệu 1 và 0, giúp lưu trữ và xử lí cực nhanh, ổn định. Mối quan hệ quy đổi chính xác theo hệ nhị phân: 1 Byte = 8 bit; 1 KB = 1024 Byte; 1 MB = 1024 KB; 1 GB = 1024 MB; 1 TB = 1024 GB (trong ước lượng thông thường có thể tính xấp xỉ hệ số 1000)."},{"i":60,"b":"Bài 4","c":3,"l":2,"s":"Mạng máy tính mang lại những lợi ích gì so với các máy tính đơn lẻ? Hãy phân biệt chức năng của Bộ chuyển mạch (Switch) và Bộ định tuyến (Router).","a":"Lợi ích của mạng máy tính: Cho phép trao đổi, chia sẻ dữ liệu cực nhanh giữa nhiều máy tính mà không cần sao chép thủ công qua USB; cho phép dùng chung tài nguyên phần cứng (máy in mạng, ổ cứng lưu trữ chung) giúp tiết kiệm chi phí. Phân biệt: Switch (bộ chuyển mạch) dùng để kết nối nhiều thiết bị đầu cuối trong cùng một mạng nội bộ (LAN); còn Router (bộ định tuyến) dùng để kết nối và dẫn đường gói tin giữa các mạng khác nhau (như nối mạng LAN trường học với mạng Internet qua ISP)."},{"i":61,"b":"Bài 5","c":4,"l":2,"s":"Em hãy giải thích ngắn gọn 4 đặc điểm chính của Internet (tính toàn cầu, tính tương tác, tính dễ tiếp cận, tính không chủ sở hữu).","a":"- Tính toàn cầu: Phủ sóng kết nối hàng tỉ người dùng ở hầu khắp các quốc gia, vùng lãnh thổ trên thế giới. - Tính tương tác: Người dùng không chỉ đọc một chiều mà có thể trao đổi, phản hồi tức thời hai chiều (nhắn tin, gọi video, học trực tuyến). - Tính dễ tiếp cận: Ai cũng có thể dễ dàng kết nối, tìm kiếm, lưu trữ và đăng tải thông tin mọi lúc qua máy tính, điện thoại. - Tính không chủ sở hữu: Internet là mạng liên kết chung của nhân loại, không thuộc quyền sở hữu riêng của bất kì cá nhân hay quốc gia đơn lẻ nào."},{"i":62,"b":"Bài 6","c":5,"l":2,"s":"Em hãy phân biệt rõ các khái niệm: Siêu văn bản, Trang web, Website và Trang chủ. Cho ví dụ minh họa bằng một website giáo dục.","a":"- Siêu văn bản: Tài liệu tích hợp đa phương tiện (văn bản, ảnh, âm thanh, video) và chứa các siêu liên kết tới tài liệu khác. - Trang web: Một siêu văn bản được gán địa chỉ truy cập trên Internet. - Website: Tập hợp nhiều trang web có liên quan gắn chung một địa chỉ tên miền. - Trang chủ (Homepage): Trang web đầu tiên hiện ra khi gõ địa chỉ gốc của website. Ví dụ: Khi truy cập https://moet.gov.vn (Website Bộ GD&ĐT), màn hình mở đầu là Trang chủ, mỗi bản tin giáo dục mở ra bên trong là một Trang web được trình bày dưới dạng Siêu văn bản."},{"i":63,"b":"Bài 7","c":6,"l":2,"s":"Máy tìm kiếm (Search Engine) khác với Trình duyệt web (Web Browser) như thế nào? Vì sao học sinh hay nhầm lẫn Google Chrome với Google Search?","a":"- Trình duyệt web (như Google Chrome, Microsoft Edge, Firefox, Safari) là phần mềm ứng dụng cài trên máy tính/điện thoại dùng để mở và hiển thị mọi trang web. - Máy tìm kiếm (như Google Search tại google.com, Bing tại bing.com) là một hệ thống dịch vụ trên website giúp tra cứu địa chỉ các trang web theo từ khóa. Học sinh hay nhầm vì trình duyệt Google Chrome thường đặt trang chủ mặc định là máy tìm kiếm Google Search và cho phép gõ luôn từ khóa lên thanh địa chỉ."},{"i":64,"b":"Bài 8","c":7,"l":2,"s":"Hãy nêu cấu trúc chung của một địa chỉ thư điện tử, giải thích ý nghĩa từng phần và cho biết vì sao không thể có hai người trên thế giới sở hữu cùng một địa chỉ email giống hệt nhau.","a":"Cấu trúc chung: <tên_đăng_nhập>@<tên_máy_chủ_hộp_thư>. Trong đó: <tên_đăng_nhập> là tên tài khoản do người dùng đăng kí (viết liền không dấu cách); kí hiệu @ (a còng) nghĩa là 'tại'; <tên_máy_chủ_hộp_thư> là tên miền của nhà cung cấp dịch vụ email (như gmail.com, outlook.com, unigo.edu.vn). Không thể có hai địa chỉ giống hệt nhau vì địa chỉ email đóng vai trò định danh duy nhất trên toàn cầu giúp máy chủ định tuyến thư đến đúng hộp thư của người nhận mà không bị gửi nhầm."},{"i":65,"b":"Bài 1","c":0,"l":3,"s":"Tình huống: Bạn Hùng đi tham quan Bảo tàng Dân tộc học, dùng điện thoại chụp ảnh tấm biển giới thiệu nhà Rông Tây Nguyên, ghi âm lời thuyết minh của cô hướng dẫn viên và tối về kể lại những điều thú vị học được cho bố mẹ nghe. Em hãy chỉ ra các dạng dữ liệu, vật mang tin và thông tin trong câu chuyện của Hùng.","a":"- Các dạng dữ liệu: Dữ liệu hình ảnh (bức ảnh chụp tấm biển và nhà Rông), dữ liệu chữ và số (chữ viết trên tấm biển giới thiệu), dữ liệu âm thanh (tệp ghi âm lời cô thuyết minh). - Vật mang tin: Tấm biển giới thiệu tại bảo tàng và bộ nhớ trong chiếc điện thoại của Hùng. - Thông tin: Những hiểu biết sâu sắc về kiến trúc, văn hóa nhà Rông Tây Nguyên mà Hùng tiếp thu được và truyền đạt lại cho bố mẹ."},{"i":66,"b":"Bài 2","c":1,"l":3,"s":"Khi em quét mã QR thanh toán tiền mua sách tại hiệu sách bằng ứng dụng trên điện thoại thông minh, máy tính/điện thoại đã thực hiện lần lượt 4 hoạt động xử lí thông tin như thế nào?","a":"Bốn hoạt động diễn ra tuần tự: - Thu nhận: Camera điện thoại quét hình ảnh mã QR và bàn phím cảm ứng nhận số tiền/mã PIN xác nhận. - Lưu trữ: Bộ nhớ điện thoại lưu tạm dữ liệu mã hóa của cửa hàng và lịch sử giao dịch. - Xử lí: Bộ vi xử lí kiểm tra tính hợp lệ của mã QR, đối chiếu số dư và thực hiện lệnh trừ tiền qua hệ thống ngân hàng. - Truyền/xuất: Điện thoại truyền dữ liệu giao dịch qua mạng tới máy chủ ngân hàng và hiển thị biên lai 'Thanh toán thành công' lên màn hình."},{"i":67,"b":"Bài 3","c":2,"l":3,"s":"Thẻ nhớ máy ảnh của bố em có dung lượng 16 GB, hiện đã sử dụng hết 12 GB. Trong chuyến dã ngoại cuối tuần, em muốn quay thêm một đoạn video kỉ niệm lớp có dung lượng 3500 MB và chụp thêm 200 bức ảnh (mỗi bức ảnh nặng 4 MB). Theo cách tính chính xác nhị phân (1 GB = 1024 MB), thẻ nhớ có đủ chỗ lưu không? Vì sao?","a":"- Dung lượng còn trống của thẻ nhớ: 16 GB - 12 GB = 4 GB = 4 × 1024 MB = 4096 MB. - Dung lượng cần dùng cho 200 bức ảnh: 200 × 4 MB = 800 MB. - Tổng dung lượng cần lưu thêm: 3500 MB + 800 MB = 4300 MB. - So sánh: Vì 4300 MB > 4096 MB (thiếu 4300 - 4096 = 204 MB) nên thẻ nhớ KHÔNG đủ chỗ lưu hết toàn bộ video và 200 bức ảnh đó. Em cần chép bớt dữ liệu cũ sang máy tính hoặc giảm độ phân giải/thời lượng video."},{"i":68,"b":"Bài 4","c":3,"l":3,"s":"Gia đình em vừa lắp đặt đường truyền Internet cáp quang cho ngôi nhà 2 tầng gồm: 1 máy tính để bàn ở phòng làm việc tầng 1, 2 máy tính xách tay và 2 điện thoại thông minh sử dụng ở cả tầng 1 và tầng 2. Em hãy tư vấn các thiết bị kết nối cần thiết để mọi thiết bị đều vào mạng ổn định.","a":"Phương án thiết kế mạng gia đình tối ưu: - Trang bị 1 Modem/Wi-Fi Router chính đặt ở vị trí trung tâm tầng 1 nối với đường cáp quang của nhà mạng ISP. - Dùng 1 sợi dây cáp mạng LAN nối trực tiếp từ cổng LAN của Router vào máy tính để bàn ở tầng 1 để đảm bảo tốc độ ổn định cao nhất. - Tại tầng 2 (nếu sóng Wi-Fi bị tường bê tông cản yếu), lắp thêm 1 Điểm truy cập không dây (Access Point / bộ mở rộng sóng Wi-Fi) nối với Router tầng 1 để 2 máy tính xách tay và 2 điện thoại bắt sóng Wi-Fi mạnh ở cả hai tầng."},{"i":69,"b":"Bài 5","c":4,"l":3,"s":"Bạn Lan ở vùng cao muốn ôn luyện tiếng Anh giao tiếp miễn phí, tra cứu tài liệu dự thi Khoa học kĩ thuật và gửi bài dự thi về Ban tổ chức ở Hà Nội ngay trong ngày. Em hãy nêu cụ thể các dịch vụ/lợi ích của Internet giúp Lan thực hiện cả 3 nhu cầu trên.","a":"Ba lợi ích và dịch vụ Internet giúp Lan thực hiện hiệu quả: (1) Học tập trực tuyến (E-learning): Xem các kênh video dạy phát âm chuẩn của giáo viên bản ngữ, tham gia lớp học/câu lạc bộ tiếng Anh trực tuyến miễn phí; (2) Dịch vụ Web (WWW) & Máy tìm kiếm: Truy cập các thư viện số, bài báo khoa học cập nhật để tra cứu tài liệu làm dự án Khoa học kĩ thuật; (3) Dịch vụ Thư điện tử (Email) / Lưu trữ đám mây: Đính kèm tệp thuyết minh dự án gửi tới hộp thư Ban tổ chức ở Hà Nội chỉ trong vài giây mà không mất thời gian chuyển phát bưu điện."},{"i":70,"b":"Bài 6","c":5,"l":3,"s":"Khi mở trang web Cổng thông tin điện tử Chính phủ (https://chinhphu.vn), em hãy mô tả các thao tác trên trình duyệt web để: (1) Mở một bản tin sang thẻ (Tab) mới mà không làm mất trang chủ đang xem; (2) Quay trở lại trang vừa xem trước đó; (3) Đánh dấu trang web để theo dõi thường xuyên.","a":"Các thao tác chuẩn trên trình duyệt web: - (1) Mở bản tin sang thẻ mới: Nháy nút phải chuột vào siêu liên kết tiêu đề bản tin -> chọn 'Mở liên kết trong thẻ mới' (Open link in new tab) hoặc giữ phím Ctrl khi nháy chuột trái vào liên kết. - (2) Quay lại trang trước đó: Nháy vào nút mũi tên quay lại (Back ←) ở góc trên bên trái thanh địa chỉ trình duyệt. - (3) Đánh dấu trang: Nháy chuột vào biểu tượng hình ngôi sao (Bookmark this tab) ở cuối thanh địa chỉ -> chọn thư mục lưu đánh dấu -> nhấn Done (Xong)."},{"i":71,"b":"Bài 7","c":6,"l":3,"s":"Em được phân công tìm tư liệu cho chuyên đề Sinh học lớp 6 về 'Vai trò của rừng ngập mặn Cần Giờ' gồm cả bài viết khoa học chính xác và sơ đồ hình ảnh minh họa. Em hãy viết các câu lệnh từ khóa tối ưu trên máy tìm kiếm và cách lọc kết quả phù hợp.","a":"- Để tìm bài viết khoa học chứa đúng địa danh và chủ đề: Nhập từ khóa có ngoặc kép “rừng ngập mặn Cần Giờ” vai trò hệ sinh thái tại thẻ lọc 'Tất cả' (All) và ưu tiên chọn các trang .edu.vn, .gov.vn hoặc tạp chí môi trường. - Để tìm sơ đồ, hình ảnh minh họa chất lượng cao: Nhập từ khóa sơ đồ “rừng ngập mặn Cần Giờ” rồi nháy chọn thẻ lọc 'Hình ảnh' (Images) ngay dưới thanh tìm kiếm, nhớ ghi lại tên tác giả và địa chỉ URL trang gốc để trích dẫn nguồn."},{"i":72,"b":"Bài 8","c":7,"l":3,"s":"Hãy kiểm tra 4 địa chỉ email sau đây, giải thích địa chỉ nào hợp lệ, địa chỉ nào sai quy tắc và sửa lại cho đúng:","a":"- Địa chỉ (1) clbtinhoc_6a1@gmail.com: HỢP LỆ vì có đúng tên đăng nhập không dấu cách, 1 kí hiệu @ và tên máy chủ gmail.com chuẩn. - Địa chỉ (2) nguyen van an@outlook.com: SAI vì phần tên đăng nhập chứa khoảng trắng (dấu cách) -> Sửa lại: nguyenvanan@outlook.com hoặc nguyen.van.an@outlook.com. - Địa chỉ (3) loptruong6a1.gmail.com: SAI vì thiếu kí hiệu bắt buộc @ ngăn cách tên đăng nhập và tên máy chủ -> Sửa lại: loptruong6a1@gmail.com. - Địa chỉ (4) baocao@nhom2@yahoo.com: SAI vì có tới hai kí hiệu @ -> Sửa lại: baocao.nhom2@yahoo.com."},{"i":73,"b":"Bài 1","c":0,"l":4,"s":"Trong một trận lũ quét miền núi, trạm khí tượng thủy văn đã phát bản tin cảnh báo sớm qua loa truyền thanh và tin nhắn điện thoại giúp người dân kịp sơ tán an toàn trước khi lũ về. Từ tình huống thực tiễn này, em hãy phân tích mối quan hệ giữa tính kịp thời, tính chính xác của thông tin với quyết định của con người.","a":"Phân tích tình huống: Bản tin cảnh báo lũ (dữ liệu âm thanh qua loa và dữ liệu văn bản qua tin nhắn điện thoại) đem lại thông tin sống còn cho người dân. Nếu dữ liệu thu thập sai dẫn đến thông tin thiếu chính xác (báo nhầm hoặc bỏ sót lũ), người dân sẽ chủ quan không sơ tán. Ngược lại, dù thông tin chính xác nhưng truyền đi quá muộn (sau khi lũ đã tràn về) thì thông tin mất hết giá trị phòng tránh. Như vậy, thông tin vừa chính xác vừa kịp thời đóng vai trò quyết định giúp con người đưa ra hành động đúng lúc để bảo vệ tính mạng và tài sản."},{"i":74,"b":"Bài 2","c":1,"l":4,"s":"Hệ thống tưới cây thông minh trong vườn trường UNIGO dùng cảm biến đo độ ẩm đất; khi độ ẩm dưới 40%, bộ điều khiển trung tâm tự động bật máy bơm nước tưới 5 phút và gửi thông báo về điện thoại bác bảo vệ. Em hãy phân tích đầy đủ 4 hoạt động xử lí thông tin diễn ra trong hệ thống tự động này.","a":"Bốn hoạt động xử lí thông tin của hệ thống tưới cây thông minh: - (1) Thu nhận thông tin: Cảm biến độ ẩm cắm trong đất đo và chuyển độ ẩm thực tế thành tín hiệu dữ liệu số đưa vào hệ thống. - (2) Lưu trữ thông tin: Bộ nhớ của mạch điều khiển lưu ngưỡng cài đặt chuẩn (40%), thời gian tưới (5 phút) và nhật kí các lần tưới. - (3) Xử lí thông tin: Bộ vi xử lí so sánh độ ẩm hiện tại với mốc 40%; phát hiện nhỏ hơn 40% nên ra quyết định kích hoạt rơ-le bật máy bơm đúng 5 phút rồi ngắt. - (4) Truyền thông tin: Mạch điều khiển truyền tín hiệu điều khiển ra máy bơm và gửi gói tin thông báo qua mạng Wi-Fi tới điện thoại của bác bảo vệ."},{"i":75,"b":"Bài 3","c":2,"l":4,"s":"Một nhà sản xuất ổ cứng ghi trên vỏ hộp dung lượng 500 GB theo hệ thập phân của nhà sản xuất (1 GB = 1000 MB, 1 MB = 1000 KB, 1 KB = 1000 Byte), nhưng khi cắm vào máy tính Windows (tính theo hệ nhị phân 1024), máy tính lại hiển thị dung lượng nhỏ hơn 500 GB. Em hãy giải thích nguyên nhân hiện tượng này và tính xem 500 000 000 000 Byte tương đương khoảng bao nhiêu GB nhị phân (làm tròn đến chữ số thập phân thứ nhất).","a":"Nguyên nhân không phải do ổ cứng bị lỗi hay thiếu dung lượng mà do sự chênh lệch quy ước hệ số quy đổi: Nhà sản xuất tính 500 GB = 500 × 1000 × 1000 × 1000 = 500 000 000 000 Byte. Trong khi đó hệ điều hành Windows quy đổi mỗi bậc theo hệ số nhị phân 1024, tức 1 GB nhị phân = 1024 × 1024 × 1024 = 1 073 741 824 Byte. Thực hiện phép chia: 500 000 000 000 : 1 073 741 824 ≈ 465,7 GB. Do vậy trên Windows ổ cứng hiển thị khoảng 465,7 GB là hoàn toàn chính xác."},{"i":76,"b":"Bài 4","c":3,"l":4,"s":"Trường học muốn tổ chức ngày hội 'Đấu trường Tin học' cho 60 học sinh thi trực tuyến cùng lúc tại hội trường lớn (nơi chưa kéo sẵn dây cáp mạng tới từng bàn học sinh, chỉ có 1 cổng dây mạng gốc từ phòng máy chủ kéo sang). Em hãy đề xuất mô hình thiết bị kết nối phù hợp và nêu ưu, nhược điểm của phương án mạng không dây trong tình huống này.","a":"- Mô hình thiết bị kết nối đề xuất: Từ cổng dây mạng gốc nối vào 1 Router hiệu năng cao (hoặc Switch), sau đó kéo cáp nối ra 2–3 Điểm truy cập không dây (Access Point) công suất lớn bố trí đều ở các góc hội trường để chia tải cho 60 máy tính xách tay/máy tính bảng kết nối Wi-Fi đồng thời. - Ưu điểm: Triển khai cực nhanh, gọn gàng, thẩm mĩ, an toàn (học sinh không vấp vào hàng chục sợi dây cáp chằng chịt trên sàn hội trường). - Nhược điểm cần lưu ý: Tốc độ không dây có thể bị suy giảm nếu quá nhiều thiết bị dồn vào 1 Access Point duy nhất hoặc bị nhiễu sóng, do đó cần chia thành 2–3 Access Point và đặt mật khẩu riêng cho phòng thi."},{"i":77,"b":"Bài 5","c":4,"l":4,"s":"Bạn Minh nhận được một đường liên kết gửi từ tài khoản lạ trên Internet với nội dung: 'Chúc mừng bạn trúng thưởng 1 chiếc máy tính bảng, hãy nháy vào đây nhập họ tên, ngày sinh, số điện thoại của bố mẹ và mật khẩu email để nhận quà trong 15 phút'. Vận dụng hiểu biết về các đặc điểm của Internet, em hãy phân tích rủi ro và cách xử lí an toàn cho Minh.","a":"Phân tích rủi ro: Do Internet có tính ẩn danh và tính không chủ sở hữu nên kẻ xấu có thể dễ dàng giả mạo danh tính các chương trình trúng thưởng để lừa đảo chiếm đoạt tài khoản (phishing) và đánh cắp thông tin cá nhân của gia đình. Cách xử lí an toàn: (1) Tuyệt đối KHÔNG nháy vào đường liên kết lạ và KHÔNG nhập bất kì thông tin cá nhân hay mật khẩu email nào; (2) Đánh dấu tin nhắn/thư đó là lừa đảo (Spam) hoặc chặn người gửi; (3) Báo ngay cho bố mẹ hoặc thầy cô giáo biết để được hướng dẫn phòng tránh."},{"i":78,"b":"Bài 6","c":5,"l":4,"s":"Một bạn học sinh nói: 'Hôm nay trang web của câu lạc bộ cờ vua bị bảo trì không mở được, vậy chắc chắn mạng Internet toàn cầu đã bị hỏng'. Bằng kiến thức phân biệt Internet và World Wide Web (WWW), em hãy giải thích vì sao kết luận của bạn là sai và nêu cách kiểm tra nhanh trên máy tính.","a":"Kết luận của bạn là sai vì: Internet là hạ tầng mạng liên kết toàn cầu (gồm hàng triệu máy chủ và dịch vụ như WWW, Email, trò chuyện trực tuyến...), còn website câu lạc bộ cờ vua chỉ là một địa chỉ đơn lẻ thuộc dịch vụ WWW đặt trên một máy chủ web cụ thể. Khi máy chủ của câu lạc bộ đó tạm dừng bảo trì, toàn bộ hạ tầng Internet và các website khác vẫn hoạt động bình thường. Cách kiểm tra nhanh: Mở thẻ mới trên trình duyệt truy cập một website uy tín khác (như google.com hoặc vietnamnet.vn) hoặc kiểm tra dịch vụ gửi/nhận Email để thấy kết nối Internet vẫn thông suốt."},{"i":79,"b":"Bài 7","c":6,"l":4,"s":"Khi tra cứu thông tin làm báo cáo Lịch sử về 'Khởi nghĩa Hai Bà Trưng năm 40', bạn Hà gõ từ khóa Trưng thì nhận được hàng triệu kết quả gồm cả tên đường phố, tên trường học, cửa hàng thời trang... Em hãy thiết kế chiến lược tìm kiếm 3 bước giúp Hà lọc chính xác tư liệu lịch sử đáng tin cậy trong chưa đầy 1 phút.","a":"Chiến lược 3 bước tối ưu trên máy tìm kiếm: - Bước 1 (Đặt cụm từ khóa chính xác trong ngoặc kép): Nhập “Khởi nghĩa Hai Bà Trưng” “năm 40” để loại bỏ hoàn toàn các trang chỉ nói về tên đường, cửa hàng không liên quan đến sự kiện lịch sử. - Bước 2 (Bổ sung từ khóa mục tiêu): Gõ thêm từ khóa khía cạnh cần tìm như “Khởi nghĩa Hai Bà Trưng” nguyên nhân diễn biến ý nghĩa. - Bước 3 (Lọc nguồn tin cậy & định dạng): Ưu tiên mở kết quả từ Bảo tàng Lịch sử Quốc gia (baotanglichsu.vn), cổng giáo dục .edu.vn và chuyển sang thẻ lọc 'Hình ảnh' với từ khóa lược đồ “Khởi nghĩa Hai Bà Trưng” để lấy bản đồ minh họa chuẩn."},{"i":80,"b":"Bài 8","c":7,"l":4,"s":"Em là nhóm trưởng Nhóm 2 lớp 6A1, cần gửi thư điện tử báo cáo sản phẩm học tập cuối kì cho cô giáo bộ môn (cohuong.tin6@unigo.edu.vn) và gửi đồng thời cho 3 bạn thành viên trong nhóm cùng nhận để theo dõi, kèm theo 2 tệp (Bao_cao_Nhom2.docx và So_do_mang.png). Em hãy soạn thảo đầy đủ nội dung các trường của bức thư điện tử này đúng chuẩn văn hóa số.","a":"Mẫu bức thư điện tử chuẩn văn hóa học đường:\n- Ô To (Người nhận chính): cohuong.tin6@unigo.edu.vn\n- Ô Cc (hoặc thêm vào ô người nhận cùng theo dõi): Nhập địa chỉ email của 3 bạn thành viên Nhóm 2 (ngăn cách nhau bằng dấu phẩy).\n- Ô Subject (Chủ đề): [Tin học 6A1 - Nhóm 2] Nộp sản phẩm dự án Học kì 1\n- Phần nội dung thư:\n Kính gửi cô Hương,\n Em là Minh Quân, đại diện Nhóm 2 lớp 6A1, xin phép gửi cô sản phẩm báo cáo tổng kết dự án Học kì 1 của nhóm em. Nhóm đã đính kèm trong thư 02 tệp gồm bài thuyết minh (Bao_cao_Nhom2.docx) và sơ đồ minh họa (So_do_mang.png).\n Nhóm em rất mong nhận được nhận xét góp ý của cô ạ. Em cảm ơn cô!\n Học sinh: Nguyễn Minh Quân - Nhóm trưởng Nhóm 2 (6A1).\n- Đính kèm tệp (Attach files - biểu tượng kẹp giấy): Chọn đính kèm đủ 2 tệp Bao_cao_Nhom2.docx và So_do_mang.png, kiểm tra tên tệp đã tải lên hoàn tất rồi nhấn Send."}]},"7":{"cs":[{"n":"Bài 1: Thiết bị vào – ra","b":["Thiết bị vào (Input): Tiếp nhận thông tin từ thế giới bên ngoài (văn bản, hình ảnh, âm thanh, thao tác điều khiển) đưa vào máy tính xử lí; gồm bàn phím, chuột, micro, máy quét (scanner), webcam, đầu đọc mã vạch.","Thiết bị ra (Output): Đưa thông tin đã xử lí từ máy tính ra ngoài cho con người nhận biết; gồm màn hình thường, loa, tai nghe, máy in (printer), máy chiếu (projector).","Thiết bị vừa vào vừa ra: Màn hình cảm ứng (touchscreen) trên điện thoại thông minh, máy tính bảng, cây ATM vừa hiển thị thông tin ra vừa nhận thao tác chạm đầu vào.","An toàn thiết bị: Cắm đúng cổng kết nối phù hợp, thao tác nhẹ nhàng, không tự ý cắm dây nguồn khi tay ướt hoặc giật mạnh cáp khi máy đang chạy."]},{"n":"Bài 2: Phần mềm máy tính","b":["Hệ điều hành (Operating System): Phần mềm hệ thống quan trọng nhất quản lí toàn bộ phần cứng, điều phối hoạt động và tạo môi trường chạy các phần mềm ứng dụng (ví dụ: Windows, macOS, Linux trên máy tính; Android, iOS trên thiết bị di động).","Phần mềm ứng dụng: Chương trình giúp người dùng thực hiện công việc cụ thể như soạn thảo Word, bảng tính Excel, trình chiếu PowerPoint, lập trình Scratch, trình duyệt Chrome.","Phần mở rộng tên tệp (đuôi tệp): Cho hệ điều hành biết loại dữ liệu và phần mềm mở tương ứng, phân cách với phần tên bằng dấu chấm (.): .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .sb3 (Scratch), .jpg/.png (ảnh), .mp3 (âm thanh), .mp4 (video), .zip/.rar (tệp nén)."]},{"n":"Bài 3: Quản lí dữ liệu trong máy tính","b":["Tổ chức cây thư mục: Đặt tên tệp, thư mục ngắn gọn, rõ nghĩa, theo cấu trúc phân cấp khoa học để tra cứu nhanh chóng.","Các thao tác và phím tắt thông dụng trong File Explorer: Sao chép (Ctrl + C), Cắt/Di chuyển (Ctrl + X), Dán (Ctrl + V), Đổi tên (F2), Xóa vào thùng rác (Delete).","Bảo vệ dữ liệu: Sao lưu dự phòng (Backup) sang ổ cứng ngoài, USB hoặc đám mây; dùng phần mềm diệt virus có bản quyền, đặt mật khẩu mạnh và không mở tệp lạ từ nguồn không rõ ràng."]},{"n":"Bài 4: Mạng xã hội và một số kênh trao đổi thông tin trên Internet","b":["Mạng xã hội (Facebook, Zalo, YouTube, Instagram...): Ứng dụng web kết nối cộng đồng có cùng sở thích hoặc mối quan hệ, cho phép tạo hồ sơ cá nhân, đăng bài, chia sẻ đa phương tiện, bình luận và nhắn tin trực tuyến.","Các kênh trao đổi thông tin khác: Thư điện tử (Email), diễn đàn trực tuyến (Forum), trang tin điện tử, ứng dụng hội nghị truyền hình (Zoom, Google Meet, Microsoft Teams).","Hai mặt của mạng xã hội: Giúp giao lưu, học tập nhanh chóng nhưng tiềm ẩn nguy cơ tin giả, lừa đảo trực tuyến, lộ thông tin cá nhân và mã độc."]},{"n":"Bài 5: Ứng xử trên mạng","b":["Giao tiếp văn minh trên mạng: Sử dụng ngôn từ lịch sự, tôn trọng người khác, xin phép trước khi đăng ảnh/thông tin riêng tư của bạn bè, kiểm chứng trước khi chia sẻ.","Cách xử lí khi bị bắt nạt qua mạng (Cyberbullying): Giữ bình tĩnh, KHÔNG nhắn tin chửi bới trả đũa; chụp màn hình lưu giữ bằng chứng; chặn (Block) và báo cáo tài khoản xấu; lập tức chia sẻ và nhờ cha mẹ, thầy cô hoặc cơ quan chức năng hỗ trợ.","Phòng tránh nghiện Internet: Sắp xếp thời gian sử dụng máy tính hợp lí, ưu tiên đọc sách, thể thao và giao tiếp trực tiếp cùng gia đình, bạn bè."]},{"n":"Bài 6: Làm quen với phần mềm bảng tính","b":["Giao diện trang tính (Excel): Gồm các cột kí hiệu bằng chữ cái (A, B, C...), các hàng đánh số (1, 2, 3...). Giao của cột và hàng là ô tính, địa chỉ ô viết dạng <Tên cột><Tên hàng> (ví dụ: C5).","Vùng dữ liệu (khối ô): Tập hợp các ô liền kề tạo thành hình chữ nhật, viết dạng <Ô góc trái trên>:<Ô góc phải dưới> (ví dụ: B3:C6).","Hộp tên (Name Box) hiển thị địa chỉ ô đang chọn; Thanh công thức (Formula Bar) dùng để nhập, hiển thị và chỉnh sửa dữ liệu hoặc công thức trong ô.","Mặc định căn lề dữ liệu trong ô: Dữ liệu văn bản (chữ) tự động căn thẳng lề trái; dữ liệu số, ngày tháng tự động căn thẳng lề phải."]},{"n":"Bài 7: Tính toán tự động trên bảng tính","b":["Kí hiệu phép toán trong Excel: Cộng (+), Trừ (-), Nhân (*), Chia (/), Lũy thừa (^), Phần trăm (%). Mọi công thức tính toán bắt buộc bắt đầu bằng dấu bằng (=).","Tính toán tự động với địa chỉ ô: Sử dụng địa chỉ ô (ví dụ: =B3+C3) thay vì hằng số giúp kết quả tự động cập nhật ngay khi dữ liệu nguồn thay đổi.","Sao chép công thức: Khi sao chép công thức chứa địa chỉ tương đối (bằng Ctrl+C / Ctrl+V hoặc kéo nút điền tự động Fill Handle), địa chỉ các ô trong công thức tự động thay đổi tương ứng theo vị trí hàng và cột mới."]},{"n":"Bài 8: Công cụ hỗ trợ tính toán (Tiết 1)","b":["Hàm trong bảng tính: Là công thức được định nghĩa sẵn giúp tính toán nhanh gọn, chính xác trên vùng dữ liệu lớn.","Cú pháp chung của hàm: =<Tên_hàm>(<các tham số>), trong đó các tham số có thể là số, địa chỉ ô hoặc vùng dữ liệu phân cách nhau bởi dấu phẩy (,) hoặc chấm phẩy (;).","5 hàm thống kê cơ bản: SUM (tính tổng), AVERAGE (tính trung bình cộng), MAX (tìm giá trị lớn nhất), MIN (tìm giá trị nhỏ nhất), COUNT (đếm số ô chứa dữ liệu kiểu số)."]}],"q":[{"i":1,"b":"Bài 1","c":0,"l":1,"s":"Nhóm thiết bị nào sau đây có chức năng tiếp nhận thông tin đưa vào máy tính?","o":["Vỏ thùng máy tính","Thiết bị ra (Output)","Thiết bị vào (Input)","Bộ nguồn điện dự phòng"],"a":2,"k":0},{"i":2,"b":"Bài 1","c":0,"l":1,"s":"Máy quét ảnh (Scanner) chuyển hình ảnh trên giấy vào máy tính nên được xếp vào loại thiết bị nào?","o":["Thiết bị ra","Thiết bị vào","Bộ nhớ ngoài","Phần mềm ứng dụng"],"a":1,"k":0},{"i":3,"b":"Bài 1","c":0,"l":1,"s":"Máy chiếu (Projector) dùng trong phòng học thực hiện chức năng nào?","o":["Quét mã vạch trên bìa sách giáo khoa đưa vào phần mềm thư viện","Lưu trữ dự phòng các tệp văn bản khi máy tính bị mất điện","Chiếu hình ảnh từ máy tính lên màn chiếu rộng cho cả lớp quan sát","Thu âm giọng giảng bài của giáo viên lưu thành tệp âm thanh"],"a":2,"k":1},{"i":4,"b":"Bài 1","c":0,"l":1,"s":"Thiết bị nào giúp ghi nhận hình ảnh chuyển động của người dùng đưa vào máy tính khi học trực tuyến?","o":["Máy in màu","Webcam","Tai nghe chụp tai","Loa vi tính"],"a":1,"k":0},{"i":5,"b":"Bài 1","c":0,"l":1,"s":"Thao tác nào sau đây đảm bảo an toàn khi kết nối chuột có dây vào máy tính?","o":["Dùng lực ấn thật mạnh đầu cắm USB vào cổng mạng LAN hoặc cổng HDMI","Nắm phần dây điện mảnh giật mạnh ra khỏi thùng máy khi tháo chuột","Cắm và rút đầu dây liên tục nhiều lần khi tay đang ướt nước","Quan sát đúng hình dạng cổng USB và cắm thẳng nhẹ nhàng, vừa khít"],"a":3,"k":3},{"i":6,"b":"Bài 2","c":1,"l":1,"s":"Phần mềm máy tính được chia thành hai nhóm chính nào?","o":["Bộ nhớ trong và bộ nhớ ngoài","Tệp văn bản và tệp hình ảnh","Thiết bị vào và thiết bị ra","Hệ điều hành và phần mềm ứng dụng"],"a":3,"k":0},{"i":7,"b":"Bài 2","c":1,"l":1,"s":"Hệ điều hành nào dưới đây được cài đặt phổ biến trên điện thoại thông minh iPhone?","o":["Microsoft Excel","Windows 11","Linux Ubuntu","iOS"  với tên tệp đặt là 1, 2, 3, 4","Tạo thư mục HOC_KI_1 trên ổ đĩa D:, bên trong tạo 3 thư mục con TOAN, NGU_VAN, TIN_HOC để lưu tệp đúng môn"],"a":3,"k":0},{"i":46,"b":"Bài 3","c":2,"l":2,"s":"Sự khác biệt cơ bản giữa thao tác Sao chép (Copy – Paste) và Di chuyển (Cut – Paste) một tệp tin là gì?","o":["Sao chép làm giảm một nửa dung lượng tệp, còn Di chuyển làm tăng gấp đôi dung lượng tệp","Sao chép chỉ thực hiện được với tệp hình ảnh, còn Di chuyển chỉ thực hiện được với tệp âm thanh","Sao chép giữ nguyên tệp gốc ở thư mục nguồn, còn Di chuyển đưa tệp sang thư mục đích và không còn tệp ở thư mục nguồn","Sao chép làm mất tệp ở thư mục nguồn, còn Di chuyển tạo ra hai tệp giống hệt nhau ở cả hai nơi"],"a":2,"k":1},{"i":47,"b":"Bài 4","c":3,"l":2,"s":"Khi đọc được một bài viết trên mạng xã hội thông báo 'Ngày mai toàn thành phố nghỉ học vì bão lớn' từ một trang cá nhân lạ không có dấu xác thực, em nên hành động như thế nào?","o":["Bình luận cãi nhau gay gắt dưới bài viết dù chưa kiểm tra nguồn tin chính thống","Gửi thông tin đăng nhập tài khoản học tập của mình cho chủ bài viết để hỏi thêm","Chưa vội tin hay chia sẻ, kiểm tra lại thông báo từ giáo viên chủ nhiệm và cổng thông tin Sở Giáo dục","Chia sẻ ngay lập tức vào tất cả các nhóm lớp để các bạn cùng nghỉ học sáng mai"],"a":2,"k":0},{"i":48,"b":"Bài 4","c":3,"l":2,"s":"So với tin nhắn tức thời trên mạng xã hội, việc trao đổi qua Thư điện tử (Email) có ưu điểm nổi bật nào trong môi trường học tập và công việc?","o":["Tự động phát trực tiếp hình ảnh camera của người nhận ngay cả khi họ không mở máy","Cho phép chỉnh sửa trực tiếp các tệp đang lưu trong ổ cứng của người nhận mà không cần họ tải về","Không cần kết nối mạng Internet mà vẫn gửi được tệp dung lượng hàng chục GB tức thời","Trình bày nội dung có tiêu đề rõ ràng, quản lí thư khoa học và đính kèm nhiều tệp tài liệu chuẩn mực"],"a":3,"k":1},{"i":49,"b":"Bài 5","c":4,"l":2,"s":"Trong nhóm chat học tập của lớp 7A1, hai bạn xảy ra tranh luận gay gắt về cách giải bài toán và bắt đầu dùng lời lẽ thiếu kiềm chế. Là thành viên nhóm, em nên ứng xử thế nào?","o":["Khuyên hai bạn bình tĩnh, trao đổi lịch sự tập trung vào lời giải toán hoặc nhờ cô giáo bộ môn giải đáp","Cổ vũ hai bạn cãi nhau to hơn rồi chụp ảnh đăng lên trang cá nhân để câu lượt thích","Đặt biệt danh xấu cho một bạn và kêu gọi cả lớp tẩy chay bạn đó khỏi nhóm học tập","Tung tin bịa đặt về điểm kiểm tra của hai bạn sang nhóm của lớp khác"],"a":0,"k":1},{"i":50,"b":"Bài 5","c":4,"l":2,"s":"Vì sao khi bị bắt nạt qua mạng, nạn nhân KHÔNG nên nhắn tin chửi bới trả đũa kẻ bắt nạt?","o":["Vì nhà cung cấp dịch vụ Internet sẽ thu phí gấp mười lần đối với tin nhắn phản hồi","Vì bàn phím máy tính sẽ tự động khóa vĩnh viễn nếu gõ quá ba tin nhắn liên tiếp","Vì tin nhắn trả đũa sẽ tự động xóa mất bằng chứng trên máy của bố mẹ và thầy cô","Vì trả đũa làm xung đột leo thang căng thẳng hơn và chính mình cũng vi phạm quy tắc ứng xử văn minh"],"a":3,"k":1},{"i":51,"b":"Bài 6","c":5,"l":2,"s":"Một vùng dữ liệu trên trang tính được chọn từ ô A2 đến ô D5 (kí hiệu A2:D5). Hỏi vùng dữ liệu này bao gồm tổng cộng bao nhiêu ô tính?","o":["9 ô tính (3 cột × 3 hàng)","16 ô tính (4 cột × 4 hàng)","20 ô tính (4 cột × 5 hàng)","8 ô tính (2 cột × 4 hàng)"],"a":1,"k":0},{"i":52,"b":"Bài 6","c":5,"l":2,"s":"Khi nhập điểm kiểm tra vào cột C trên Excel, bạn Nam vô tình gõ nhầm số không (0) thành chữ cái O trong giá trị '8.O'. Dấu hiệu trực quan nào giúp Nam nhận ra ngay ô đó đang bị hiểu là văn bản chứ không phải số?","o":["Ô tính tự động đổi màu nền sang màu tím đậm và phát tiếng kêu cảnh báo","Thanh tiêu đề của phần mềm Excel tự động đóng tệp bảng tính ngay lập tức","Hộp tên Name Box biến mất hoàn toàn khỏi màn hình làm việc","Giá trị '8.O' tự động căn thẳng sang lề trái của ô thay vì căn lề phải như các số khác"],"a":3,"k":3},{"i":53,"b":"Bài 7","c":6,"l":2,"s":"Cho các ô A1 = 10, B1 = 6, C1 = 2. Nếu tại ô D1 nhập công thức =A1+B1/C1 thì kết quả hiển thị trong ô D1 là bao nhiêu?","o":["8","13","32","18"],"a":1,"k":-1},{"i":54,"b":"Bài 7","c":6,"l":2,"s":"Tại ô C2 có công thức =A2*B2. Khi sao chép ô C2 sang ô D3 (lùi sang phải 1 cột và xuống dưới 1 hàng), công thức tại ô D3 sẽ tự động điều chỉnh thành gì?","o":["=B3*C3","=B2*C2","=A2*B2","=A3*B3"],"a":0,"k":2},{"i":55,"b":"Bài 8","c":7,"l":2,"s":"Cho vùng ô A1:A5 lần lượt chứa các dữ liệu sau: A1 = 8, A2 = 10, A3 = 'Vắng', A4 = 6, A5 = 12. Khi thực hiện hàm =COUNT(A1:A5) thì Excel trả về kết quả là bao nhiêu?","o":["9 (trung bình cộng các giá trị số trong vùng A1:A5)","36 (tổng các giá trị số trong vùng A1:A5)","5 (đếm toàn bộ số ô trong vùng từ A1 đến A5)","4 (vì chỉ có 4 ô chứa dữ liệu kiểu số, bỏ qua ô chữ 'Vắng')"],"a":3,"k":2},{"i":56,"b":"Bài 8","c":7,"l":2,"s":"Biết các ô B2 = 7, C2 = 8, D2 = 9. Công thức nào dưới đây cho kết quả KHÁC với ba công thức còn lại?","o":["=AVERAGE(B2:D2)","=(B2+C2+D2)/3","=B2+C2+D2/3","=SUM(B2:D2)/COUNT(B2:D2)"],"a":2,"k":-1}],"e":[{"i":57,"b":"Bài 1","c":0,"l":2,"s":"Phân biệt chức năng của thiết bị vào và thiết bị ra của máy tính. Kể tên 3 thiết bị vào, 3 thiết bị ra và giải thích vì sao màn hình cảm ứng được coi là thiết bị vừa vào vừa ra.","a":"Thiết bị vào tiếp nhận dữ liệu, lệnh điều khiển từ bên ngoài đưa vào máy tính xử lí (ví dụ: bàn phím, chuột, micro, máy quét, webcam). Thiết bị ra xuất thông tin đã xử lí từ máy tính ra dưới dạng hình ảnh, âm thanh, bản in cho con người nhận biết (ví dụ: màn hình thường, loa, máy in, máy chiếu). Màn hình cảm ứng vừa hiển thị hình ảnh kết quả ra cho người xem (Output), vừa nhận trực tiếp thao tác chạm, vuốt ngón tay làm dữ liệu điều khiển đầu vào (Input)."},{"i":58,"b":"Bài 2","c":1,"l":2,"s":"Nêu vai trò khác nhau giữa hệ điều hành và phần mềm ứng dụng. Cho biết các phần mở rộng .docx, .xlsx, .pptx, .sb3, .mp3, .mp4 tương ứng với loại tệp tin nào?","a":"Hệ điều hành (Windows, macOS, Android, iOS...) là phần mềm hệ thống quản lí phần cứng, dữ liệu và tạo môi trường nền tảng cho toàn bộ máy tính hoạt động. Phần mềm ứng dụng (Word, Excel, Scratch...) chạy trên nền hệ điều hành để giải quyết từng nhu cầu công việc cụ thể của người dùng. Ý nghĩa đuôi tệp: .docx (tệp văn bản Word), .xlsx (tệp bảng tính Excel), .pptx (tệp trình chiếu PowerPoint), .sb3 (tệp dự án lập trình Scratch), .mp3 (tệp âm thanh), .mp4 (tệp video)."},{"i":59,"b":"Bài 3","c":2,"l":2,"s":"Tại sao chúng ta cần tổ chức dữ liệu theo cây thư mục hợp lí và sao lưu dữ liệu (Backup) định kì? Nêu 3 cách sao lưu dữ liệu phổ biến hiện nay.","a":"Tổ chức cây thư mục khoa học giúp phân loại tài liệu ngăn nắp, tránh thất lạc và tìm kiếm nhanh chóng khi cần. Sao lưu dữ liệu định kì giúp khôi phục lại các tệp quan trọng nếu máy tính gặp sự cố hỏng ổ cứng, bị xóa nhầm hoặc nhiễm mã độc tống tiền. Ba cách sao lưu phổ biến: (1) Sao chép sang ổ cứng di động rời hoặc USB; (2) Đồng bộ lên dịch vụ lưu trữ đám mây (Google Drive, OneDrive); (3) Sao lưu sang một máy tính khác trong mạng."},{"i":60,"b":"Bài 4","c":3,"l":2,"s":"Trình bày 3 lợi ích thiết thực và 3 nguy cơ tiềm ẩn khi học sinh sử dụng mạng xã hội và các kênh trao đổi thông tin trên Internet.","a":"Ba lợi ích: (1) Kết nối, trao đổi bài học nhanh chóng với thầy cô và bạn bè; (2) Khai thác kho tài liệu, bài giảng trực tuyến phong phú; (3) Chia sẻ thông tin tích cực, tham gia câu lạc bộ năng khiếu. Ba nguy cơ tiềm ẩn: (1) Tiếp cận tin giả, thông tin sai lệch hoặc độc hại; (2) Bị lộ thông tin cá nhân, lừa đảo chiếm đoạt tài khoản hoặc nhiễm virus qua đường dẫn lạ; (3) Mất nhiều thời gian gây sao nhãng việc học và nguy cơ bị bắt nạt qua mạng."},{"i":61,"b":"Bài 5","c":4,"l":2,"s":"Em hãy nêu 4 quy tắc ứng xử văn minh khi tham gia bình luận, chia sẻ thông tin trên mạng xã hội.","a":"Bốn quy tắc ứng xử văn minh: (1) Sử dụng ngôn ngữ trong sáng, lịch sự, tôn trọng danh dự và nhân phẩm của người khác; (2) Xin phép trước khi đăng tải hình ảnh, thông tin riêng tư của người khác lên mạng; (3) Kiểm chứng độ chính xác của thông tin trước khi nhấn thích hoặc chia sẻ, không tiếp tay lan truyền tin đồn sai sự thật; (4) Tôn trọng bản quyền tác giả khi trích dẫn bài viết, hình ảnh, video."},{"i":62,"b":"Bài 6","c":5,"l":2,"s":"Giải thích khái niệm ô tính, địa chỉ ô, vùng dữ liệu trên trang tính Excel và nêu quy tắc căn lề mặc định khi nhập dữ liệu chữ so với dữ liệu số.","a":"Ô tính là vùng giao nhau giữa một cột và một hàng; địa chỉ ô gồm tên cột ghép liền tên hàng (ví dụ: B4). Vùng dữ liệu là khối các ô liền kề tạo thành hình chữ nhật, ghi bằng địa chỉ ô góc trái trên và ô góc phải dưới ngăn cách bởi dấu hai chấm (ví dụ: B3:D6). Quy tắc căn lề mặc định: dữ liệu kiểu văn bản (chữ) tự động căn thẳng lề trái; dữ liệu kiểu số, ngày tháng, thời gian tự động căn thẳng lề phải của ô."},{"i":63,"b":"Bài 7","c":6,"l":2,"s":"So sánh sự khác nhau giữa công thức dùng hằng số (ví dụ =25+15) và công thức dùng địa chỉ ô (ví dụ =B3+C3) tại ô D3. Khi sao chép công thức =B3+C3 từ ô D3 xuống ô D4 thì điều gì xảy ra?","a":"Công thức =25+15 cố định giá trị nên nếu số liệu trong ô B3 hoặc C3 thay đổi thì ô D3 vẫn giữ kết quả cũ 40 (không tự cập nhật). Ngược lại, công thức =B3+C3 tham chiếu đến địa chỉ ô nên mỗi khi giá trị trong B3 hoặc C3 thay đổi, Excel tự động tính lại kết quả mới chính xác tại D3. Khi sao chép =B3+C3 từ ô D3 xuống ô D4 (dịch xuống 1 hàng), địa chỉ tương đối tự động tăng chỉ số hàng thành =B4+C4."},{"i":64,"b":"Bài 8","c":7,"l":2,"s":"Nêu cú pháp tổng quát của hàm trong Excel và trình bày ý nghĩa của 5 hàm cơ bản: SUM, AVERAGE, MAX, MIN, COUNT kèm 1 ví dụ minh họa cho mỗi hàm.","a":"Cú pháp chung: =<Tên_hàm>(<các tham số>). Ý nghĩa và ví dụ trên vùng B3:B6: (1) SUM: tính tổng các giá trị số, ví dụ =SUM(B3:B6); (2) AVERAGE: tính trung bình cộng các giá trị số, ví dụ =AVERAGE(B3:B6); (3) MAX: tìm giá trị số lớn nhất, ví dụ =MAX(B3:B6); (4) MIN: tìm giá trị số nhỏ nhất, ví dụ =MIN(B3:B6); (5) COUNT: đếm số lượng ô chứa giá trị số trong vùng, ví dụ =COUNT(B3:B6)."},{"i":65,"b":"Bài 1","c":0,"l":3,"s":"Phòng Tin học cần trang bị bộ máy tính phục vụ dạy học trực tuyến kết hợp trình chiếu cho cả lớp cùng nghe và nhìn rõ. Em hãy lập danh sách các thiết bị vào - ra cần kết nối thêm vào thân máy và nêu công dụng cụ thể của từng thiết bị trong tiết học đó.","a":"Danh sách thiết bị cần kết nối: (1) Thiết bị vào: Bàn phím và chuột (nhập lệnh, điều khiển bài giảng), Webcam (ghi hình lớp học/giáo viên truyền lên phòng học trực tuyến), Micro (thu giọng nói phát biểu của giáo viên và học sinh). (2) Thiết bị ra: Máy chiếu hoặc màn hình tương tác lớn (hiển thị nội dung bài giảng cho cả lớp quan sát), Loa phòng học (phát âm thanh từ đầu cầu trực tuyến và video minh họa)."},{"i":66,"b":"Bài 2","c":1,"l":3,"s":"Trong thư mục Dự án Khoa học của nhóm có 6 tệp sau: Bao_cao_tong_ket.docx, So_lieu_do.xlsx, Slide_gioi_thieu.pptx, Mo_phong.sb3, Anh_thi_nghiem.png, Video_quay_cham.mp4. Em hãy phân loại từng tệp theo nhóm nội dung và chỉ rõ phần mềm ứng dụng phù hợp để mở chỉnh sửa từng tệp.","a":"Phân loại và phần mềm mở tương ứng: (1) Bao_cao_tong_ket.docx: tệp văn bản -> mở bằng Microsoft Word; (2) So_lieu_do.xlsx: tệp bảng tính -> mở bằng Microsoft Excel; (3) Slide_gioi_thieu.pptx: tệp bài trình chiếu -> mở bằng Microsoft PowerPoint; (4) Mo_phong.sb3: tệp chương trình lập trình trực quan -> mở bằng Scratch 3.0; (5) Anh_thi_nghiem.png: tệp hình ảnh -> mở sửa bằng Microsoft Paint hoặc Photos; (6) Video_quay_cham.mp4: tệp video -> mở xem/biên tập bằng Movies & TV hoặc trình biên tập video."},{"i":67,"b":"Bài 3","c":2,"l":3,"s":"Em hãy thiết kế sơ đồ cây thư mục trên ổ đĩa D: để quản lí tài liệu học tập năm Lớp 7 gồm 3 môn (Tin học, Toán, Tiếng Anh), trong đó thư mục Tin học chia thành 2 thư mục con là Bai_tap_Bang_tinh và Du_an_Trinh_chieu. Nêu quy trình phím tắt để di chuyển tệp Quyen_gop_sach.xlsx từ thư mục Downloads vào đúng thư mục con tương ứng.","a":"Cây thư mục chuẩn: D:\\NAM_HOC_LOP_7 gồm 3 thư mục con: TOAN, TIENG_ANH, TIN_HOC; bên trong TIN_HOC tạo 2 thư mục con: Bai_tap_Bang_tinh và Du_an_Trinh_chieu. Quy trình phím tắt di chuyển tệp: Bước 1: Mở thư mục Downloads, nhấp chọn tệp Quyen_gop_sach.xlsx và nhấn Ctrl + X (Cut); Bước 2: Mở theo đường dẫn D:\\NAM_HOC_LOP_7\\TIN_HOC\\Bai_tap_Bang_tinh và nhấn Ctrl + V (Paste)."},{"i":68,"b":"Bài 4","c":3,"l":3,"s":"Lớp 7A1 chuẩn bị tổ chức buổi quyên góp áo ấm vùng cao. Em hãy đề xuất cách kết hợp 3 kênh trao đổi thông tin trên Internet (Email, Mạng xã hội nhóm lớp, Google Meet) sao cho kế hoạch triển khai hiệu quả và an toàn nhất.","a":"Cách phối hợp hiệu quả và an toàn: (1) Dùng Email gửi thư xin phép và bản kế hoạch chi tiết (đính kèm tệp .docx, .xlsx) tới thầy cô chủ nhiệm và Ban phụ huynh lớp; (2) Dùng nhóm kín Zalo/Facebook của lớp để đăng thông báo nhanh, cập nhật tiến độ tiếp nhận đồ quyên góp (không công khai số điện thoại cá nhân lên trang công cộng); (3) Tổ chức họp trực tuyến ngắn buổi tối qua Google Meet để thống nhất phân công nhiệm vụ giữa các tổ trưởng."},{"i":69,"b":"Bài 5","c":4,"l":3,"s":"Bạn Hùng thường thức đến 1 giờ sáng để xem video ngắn trên mạng xã hội khiến sáng hôm sau ngủ gật trên lớp; gần đây Hùng còn tự ý chụp ảnh bạn cùng bàn lúc đang ngủ rồi đăng lên nhóm công khai để trêu đùa. Em hãy phân tích các điểm sai của Hùng và đưa ra lời khuyên khắc phục cụ thể.","a":"Hai điểm chưa đúng của Hùng: (1) Thức khuya lướt mạng quá độ là dấu hiệu lệ thuộc/nghiện Internet, gây hại sức khỏe và giảm chất lượng học tập; (2) Tự ý chụp và đăng ảnh riêng tư của bạn lên mạng công khai để trêu chọc là hành vi thiếu văn hóa, xâm phạm quyền riêng tư và có thể trở thành bắt nạt qua mạng. Lời khuyên: Hùng cần gỡ ngay bức ảnh và xin lỗi bạn chân thành; đồng thời lập thời gian biểu tắt thiết bị điện tử trước 21h30, đi ngủ đúng giờ và tham gia vận động thể thao sau giờ học."},{"i":70,"b":"Bài 6","c":5,"l":3,"s":"Giáo viên yêu cầu lập bảng theo dõi nhiệt độ trung bình 5 ngày trong tuần (từ Thứ Hai đến Thứ Sáu) của hai thành phố Hà Nội và Đà Nẵng trên Excel. Em hãy thiết kế bố cục hàng, cột từ ô A1 đến ô D7 và xác định địa chỉ vùng chứa toàn bộ dữ liệu số đo nhiệt độ.","a":"Thiết kế bố cục trang tính: Ô A1 nhập tiêu đề 'BẢNG THEO DÕI NHIỆT ĐỘ 5 NGÀY'; Hàng 2 làm tiêu đề cột: A2='STT', B2='Thứ', C2='Hà Nội (°C)', D2='Đà Nẵng (°C)'; các hàng từ Hàng 3 đến Hàng 7 lần lượt nhập STT 1..5, Thứ Hai..Thứ Sáu và số đo nhiệt độ tương ứng ở cột C, cột D. Địa chỉ vùng chứa toàn bộ dữ liệu số đo nhiệt độ của hai thành phố là vùng C3:D7 (gồm 2 cột × 5 hàng = 10 ô tính)."},{"i":71,"b":"Bài 7","c":6,"l":3,"s":"Cho bảng tính mua đồ dùng học tập: Hàng 3 là 'Vở kẻ ngang' có Số lượng tại ô B3 = 12, Đơn giá tại ô C3 = 8500; Hàng 4 là 'Bút bi xanh' có B4 = 5, C4 = 4000; ô E3 lưu mức giảm giá 2000 đồng. Hãy viết công thức tại ô D3 tính Thành tiền (= Số lượng × Đơn giá), tại ô F3 tính Thực trả (= Thành tiền - Giảm giá), và cho biết công thức cùng kết quả khi sao chép từ D3 xuống D4.","a":"Tại ô D3 viết công thức: =B3*C3 (kết quả = 12 × 8500 = 102000 đồng). Tại ô F3 viết công thức: =D3-E3 (kết quả = 102000 - 2000 = 100000 đồng). Khi sao chép công thức từ ô D3 xuống ô D4, địa chỉ tương đối tự động chuyển thành =B4*C4 và cho kết quả Thành tiền của Bút bi xanh là 5 × 4000 = 20000 đồng."},{"i":72,"b":"Bài 8","c":7,"l":3,"s":"Cho bảng điểm kiểm tra thường xuyên môn Tin học của Tổ 1 tại vùng C3:C8 gồm các giá trị: C3 = 8.5, C4 = 9.0, C5 = 7.5, C6 = 10.0, C7 = 8.0, C8 = 8.0. Hãy viết công thức hàm để tìm: (a) Điểm trung bình của tổ; (b) Điểm cao nhất; (c) Điểm thấp nhất; (d) Số bạn đã có điểm kiểm tra, kèm kết quả tính cụ thể.","a":"(a) Điểm trung bình của tổ: =AVERAGE(C3:C8) -> kết quả = (8.5 + 9.0 + 7.5 + 10.0 + 8.0 + 8.0) / 6 = 51 / 6 = 8.5. (b) Điểm cao nhất: =MAX(C3:C8) -> kết quả = 10.0. (c) Điểm thấp nhất: =MIN(C3:C8) -> kết quả = 7.5. (d) Số bạn đã có điểm kiểm tra: =COUNT(C3:C8) -> kết quả = 6 (bạn)."},{"i":73,"b":"Bài 1","c":0,"l":4,"s":"Một cửa hàng sách thông minh muốn thiết kế quầy tra cứu tự động cho khách hàng tự gõ hoặc chạm tìm vị trí kệ sách và nhận phiếu in sơ đồ vị trí kệ, nhưng không muốn dùng bàn phím và chuột rời để tránh thất lạc. Em hãy đề xuất giải pháp lựa chọn thiết bị vào - ra tối ưu nhất và giải thích cơ chế hoạt động của hệ thống.","a":"Giải pháp tối ưu: Trang bị 1 Màn hình cảm ứng (Touchscreen) kết hợp 1 Máy in nhiệt mini gắn liền thân quầy và 1 Đầu đọc mã vạch sách. Cơ chế hoạt động: Khách hàng chạm chọn tên sách trực tiếp trên bàn phím ảo của màn hình cảm ứng hoặc đưa mã vạch cuốn sách mẫu vào đầu đọc mã vạch (đầu vào Input); máy tính tra cứu cơ sở dữ liệu rồi hiển thị ngay bản đồ kệ sách lên chính màn hình cảm ứng đó, đồng thời xuất lệnh ra máy in nhiệt để in phiếu ghi số dãy kệ cho khách cầm theo (đầu ra Output)."},{"i":74,"b":"Bài 2","c":1,"l":4,"s":"Máy tính của bạn Mai gần đây khởi động rất chậm, khi tải một trò chơi miễn phí từ trang web lạ về có tên Game_vui.jpg.exe thì trình duyệt tự động mở hàng loạt trang quảng cáo. Hãy giải thích mánh khóe đặt tên tệp của kẻ xấu và đề xuất quy trình xử lí an toàn cho máy tính của Mai.","a":"Giải thích mánh khóe: Phần mở rộng thực sự đứng sau dấu chấm cuối cùng là .exe (tệp chương trình thực thi có khả năng chứa virus/phần mềm độc hại), còn chữ .jpg phía trước chỉ là phần tên giả mạo để đánh lừa người dùng tưởng là tệp ảnh an toàn. Quy trình xử lí: Ngắt tạm kết nối mạng Internet; gỡ bỏ chương trình lạ vừa cài; cập nhật và chạy quét toàn bộ ổ đĩa bằng phần mềm diệt virus uy tín (như Windows Security/Defender); sao lưu các tệp học tập sạch và bật chế độ hiển thị phần mở rộng tên tệp (File name extensions) trong File Explorer để không bị lừa lần sau."},{"i":75,"b":"Bài 3","c":2,"l":4,"s":"Nhóm làm dự án của em gồm 4 thành viên cùng làm chung bài thuyết trình Lịch sử địa phương, mỗi lần sửa bài các bạn lại đặt tên Bai_lam_moi.pptx, Bai_lam_moi_nhat.pptx, Bai_chot_cuoi.pptx khiến cả nhóm nhầm lẫn phiên bản. Em hãy thiết kế quy ước đặt tên tệp và cấu trúc thư mục quản lí phiên bản chuyên nghiệp cho nhóm.","a":"Quy ước chuyên nghiệp: Tạo thư mục gốc DU_AN_LICH_SU_7A1 gồm 3 thư mục con: 01_Tu_lieu_Anh_Video (chứa ảnh, tư liệu nguồn), 02_Ban_nhap_Thanh_vien (chứa phần làm riêng), 03_Ban_chinh_thuc (chứa bản tổng hợp). Quy tắc đặt tên tệp theo chuẩn <TenDuAn>_v<SoPhienBan>_<NgayThangNam>_<NguoiSua>.pptx (ví dụ: LichSuDiaPhuong_v01_20261110_Nhom7A1.pptx, LichSuDiaPhuong_v02_20261115_Nhom7A1.pptx), kết hợp sao lưu đồng bộ lên thư mục chung Google Drive để luôn xác định chính xác bản mới nhất."},{"i":76,"b":"Bài 4","c":3,"l":4,"s":"Tài khoản mạng xã hội của một người bạn thân bỗng nhiên nhắn tin cho em: 'Tớ đang cấp cứu ngoài đường mà quên ví, chuyển gấp giúp tớ 500 nghìn vào số tài khoản lạ tên Nguyễn Văn X nhé, cấm gọi điện vì máy tớ hỏng loa rồi!'. Em hãy nhận diện dấu hiệu bất thường và nêu cách kiểm chứng thông minh trước khi hành động.","a":"Dấu hiệu lừa đảo chiếm đoạt tài khoản (hack nick): Hối thúc chuyển tiền gấp đánh vào tâm lí lo lắng, tên chủ tài khoản ngân hàng khác tên bạn mình, và cố tình ngăn cản gọi điện xác minh. Cách xử lí thông minh: Tuyệt đối không chuyển tiền ngay; gọi điện thoại di động thông thường trực tiếp vào số máy của bạn hoặc gọi cho bố mẹ/giáo viên chủ nhiệm của bạn để xác nhận tình hình thực tế; nếu xác nhận tài khoản bạn bị chiếm đoạt thì cảnh báo ngay trên nhóm lớp để các bạn khác không bị lừa."},{"i":77,"b":"Bài 5","c":4,"l":4,"s":"Một nhóm học sinh lập trang ẩn danh 'Confession khối 7' để đăng các bài bêu xấu ngoại hình và điểm số của một bạn học sinh mới chuyển trường khiến bạn ấy sợ hãi không dám đến lớp. Dưới góc độ đạo đức và văn hóa số, hãy phân tích hậu quả của hành vi này và đề xuất phương án hành động của tập thể lớp để bảo vệ bạn.","a":"Phân tích hậu quả: Đây là hành vi bắt nạt qua mạng tập thể nghiêm trọng, xúc phạm danh dự, xâm phạm đời tư và gây tổn thương tâm lí nặng nề cho người bị hại (dù ẩn danh vẫn để lại dấu vết số và vi phạm quy định nhà trường, pháp luật). Phương án hành động của tập thể lớp: Không nhấn thích/bình luận hùa theo bài viết xấu; chụp màn hình bài đăng làm bằng chứng và đồng loạt báo cáo (Report) trang vi phạm; báo cáo ngay với giáo viên chủ nhiệm và Ban giám hiệu để xử lí, gỡ trang; đồng thời cả lớp chủ động trò chuyện, động viên và đồng hành cùng bạn mới hòa nhập."},{"i":78,"b":"Bài 6","c":5,"l":4,"s":"Khi lập bảng thu quỹ kế hoạch nhỏ trong Excel, bạn Bình nhập cột B như sau: B3 = '15 kg', B4 = '20 kg', B5 = '25 kg' rồi viết công thức =SUM(B3:B5) tại ô B6 nhưng kết quả lại hiện số 0. Hãy giải thích nguyên nhân lỗi này và hướng dẫn Bình cách thiết kế lại bảng tính đúng chuẩn để tính toán tự động được.","a":"Nguyên nhân: Khi Bình gõ kèm đơn vị chữ 'kg' trực tiếp vào ô (ví dụ '15 kg'), phần mềm Excel nhận diện toàn bộ nội dung ô là dữ liệu văn bản (căn lề trái) chứ không phải dữ liệu số,而 hàm SUM bỏ qua các ô văn bản nên trả về kết quả bằng 0. Cách khắc phục chuẩn: Đưa đơn vị đo lên ô tiêu đề cột B2 thành 'Khối lượng giấy vụn (kg)', còn trong các ô dữ liệu B3, B4, B5 chỉ nhập thuần giá trị số 15, 20, 25; khi đó công thức =SUM(B3:B5) tại B6 sẽ tính đúng tổng bằng 60."},{"i":79,"b":"Bài 7","c":6,"l":4,"s":"Tại ô E4 có công thức =B4*C4-D4. Người dùng thực hiện thao tác Sao chép (Copy) ô E4 rồi Dán (Paste) vào ô F6. Không cần mở máy tính, em hãy xác định chính xác công thức xuất hiện tại ô F6 và giải thích quy luật dịch chuyển tọa độ của Excel. Nếu thay vì Copy-Paste, người dùng dùng Cut-Paste (Di chuyển) từ E4 sang F6 thì công thức tại F6 là gì?","a":"Khi Sao chép (Copy – Paste) từ E4 sang F6: vị trí ô đích dịch sang phải 1 cột (từ cột E sang cột F) và dịch xuống dưới 2 hàng (từ hàng 4 xuống hàng 6); do đó mọi địa chỉ tương đối trong công thức đều tịnh tiến sang phải 1 cột và xuống 2 hàng: B4 -> C6, C4 -> D6, D4 -> E6, vậy công thức tại F6 là =C6*D6-E6. Ngược lại, nếu dùng Di chuyển (Cut – Paste) từ E4 sang F6 thì Excel chuyển nguyên ô công thức đi chỗ khác nên giữ nguyên tham chiếu gốc là =B4*C4-D4."},{"i":80,"b":"Bài 8","c":7,"l":4,"s":"Trong cuộc thi Hùng biện Tiếng Anh, mỗi thí sinh được 5 giám khảo chấm điểm lưu tại các ô từ B3 đến F3. Theo thể lệ công bằng, Điểm chung cuộc của thí sinh tại ô G3 được tính bằng trung bình cộng của 3 điểm còn lại sau khi đã loại bỏ 1 điểm cao nhất và 1 điểm thấp nhất. Chỉ dùng các hàm cơ bản đã học (SUM, MAX, MIN, COUNT), em hãy lập công thức tổng quát tại ô G3 và kiểm chứng với bộ điểm: 8, 9, 9, 10, 7.","a":"Ý tưởng toán học: Tổng 3 điểm còn lại bằng Tổng cả 5 điểm trừ đi Điểm cao nhất và trừ đi Điểm thấp nhất, sau đó chia cho 3 (hoặc chia cho COUNT(B3:F3)-2). Công thức chuẩn tại ô G3: =(SUM(B3:F3)-MAX(B3:F3)-MIN(B3:F3))/3. Kiểm chứng với bộ điểm (8, 9, 9, 10, 7): SUM = 43, MAX = 10, MIN = 7 -> Kết quả G3 = (43 - 10 - 7) / 3 = 26 / 3 ≈ 8,67 điểm."}]}};
